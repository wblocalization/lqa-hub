let paletteItems = [], paletteSel = 0;
function paletteCommands(){
  const cmds = [
    {group:'Действия', icon:'plus', label:'Новый проект', run:()=>openProjectModal()},
    {group:'Действия', icon:'image', label:'Новая сессия визуальной проверки', run:()=>{ location.hash='#/visual'; setTimeout(()=>openVisualSessionModal(null), 80); }},
    {group:'Действия', icon:'moon', label:'Переключить тему', hint:'светлая / тёмная', run:()=>setTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark')},
    {group:'Действия', icon:'user', label:'Кто я — выбрать себя', run:()=>openWhoAmI()},
    {group:'Действия', icon:'download', label:'Скачать резервную копию', run:()=>downloadBackup()},
    {group:'Действия', icon:'check', label:'Мои задачи', run:()=>{ location.hash='#/my'; }},
  ];
  if(typeof openPeriodReport==='function') cmds.push({group:'Действия', icon:'barChart', label:'Отчёт за период', run:()=>openPeriodReport()});
  if(syncEnabled()) cmds.push({group:'Действия', icon:'upload', label:'Синхронизировать сейчас', run:()=>syncNow(true)});
  if(typeof startTour==='function') cmds.push({group:'Действия', icon:'sparkles', label:'Показать тур по платформе', run:()=>{ location.hash='#/'; setTimeout(startTour, 120); }});
  NAV.forEach(n=>cmds.push({group:'Страницы', icon:n.icon, label:n.label, run:()=>{ location.hash=n.route; }}));
  return cmds;
}
function paletteScore(text, q){
  const t = text.toLowerCase(); if(!q) return 1;
  const i = t.indexOf(q); if(i===0) return 3; if(i>0) return (/[\s«"(\/·-]/.test(t[i-1]) ? 2.5 : 2);
  // all words present in any order
  const words = q.split(/\s+/).filter(Boolean); if(words.length>1 && words.every(w=>t.includes(w))) return 1.5;
  return 0;
}
function paletteCompute(qRaw){
  const q = (qRaw||'').trim().toLowerCase();
  const out = [];
  const addScored = (items, limit)=>{ const sc = items.map(x=>[x, paletteScore(x.label+' '+(x.hint||''), q)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]); sc.slice(0, limit).forEach(x=>out.push(x[0])); };
  addScored(dbList('savedViews').map(v=>({group:'Сохранённые фильтры', icon:'star', label:v.name, hint:savedViewSummary(v), run:()=>openSavedViewGlobally(v.id)})), q?6:4);
  addScored(paletteCommands(), q?8:6);
  if(q){
    addScored(dbList('projects').map(p=>({group:'Проекты', icon:'folder', label:p.name, hint:(p.languages||[]).map(l=>l.code).join(' '), run:()=>{ location.hash='#/project/'+p.id; }})), 5);
    addScored(dbList('components').map(c=>({group:'Папки', icon:'folder', label:compPath(c), hint:dbGet('projects',c.projectId)?.name||'', run:()=>{ location.hash='#/project/'+c.projectId+'/folder/'+c.id; }})), 6);
    addScored(dbList('visualSessions').map(v=>({group:'Визуальная проверка', icon:'image', label:v.name||'Сессия', hint:[v.languageCode, v.page].filter(Boolean).join(' · '), run:()=>{ location.hash='#/visual/'+v.id; }})), 5);
    addScored(dbList('glossaries').map(g=>({group:'Глоссарии', icon:'bookOpen', label:g.name, run:()=>{ location.hash='#/glossary/'+g.id; }})), 4);
    if(q.length>=2){
      const rows = []; const all = dbList('rows');
      for(let k=0;k<all.length && rows.length<8;k++){ const r = all[k]; if((r.key||'').toLowerCase().includes(q) || (r.source||'').toLowerCase().includes(q) || (r.target||'').toLowerCase().includes(q)) rows.push(r); }
      rows.forEach(r=>out.push({group:'Строки', icon:'file', label:(r.target||r.source||'').slice(0,90), hint:(r.key?r.key+' · ':'')+r.languageCode, run:()=>openRowDetail(r.id)}));
      const iss = dbList('issues').filter(i=>(i.text||'').toLowerCase().includes(q)).slice(0,5);
      iss.forEach(i=>out.push({group:'Проблемы', icon:'alertTriangle', label:i.text.slice(0,90), hint:i.type+' · '+(i.languageCode||''), run:()=>{ location.hash='#/issues'; setTimeout(()=>openIssueDetail(i.id), 120); }}));
      out.push({group:'Поиск', icon:'search', label:'Искать «'+qRaw.trim()+'» во всех проблемах', run:()=>{ document.getElementById('globalSearch').value = qRaw.trim(); doGlobalSearch(); document.getElementById('globalSearch').value=''; }});
    }
  }
  return out;
}
function openPalette(){
  if(document.getElementById('cmdk')) return;
  const bg = document.createElement('div'); bg.className = 'cmdk-bg'; bg.id = 'cmdk';
  bg.innerHTML = `<div class="cmdk" role="dialog" aria-label="Палитра команд"><div class="cmdk-in">${icon('search',17)}<input id="cmdkInput" type="text" placeholder="Команда, проект, папка, строка…" autocomplete="off" spellcheck="false"><span class="cmdk-esc">Esc</span></div><div class="cmdk-list" id="cmdkList" role="listbox"></div>
    <div class="cmdk-foot"><span><b>↑↓</b> выбрать</span><span><b>Enter</b> открыть</span><span><b>Esc</b> закрыть</span></div></div>`;
  bg.addEventListener('mousedown', e=>{ if(e.target===bg) closePalette(); });
  document.body.appendChild(bg);
  const inp = document.getElementById('cmdkInput');
  inp.addEventListener('input', ()=>{ paletteSel = 0; renderPaletteList(); });
  inp.addEventListener('keydown', e=>{
    if(e.key==='ArrowDown'){ e.preventDefault(); paletteSel = Math.min(paletteItems.length-1, paletteSel+1); renderPaletteList(true); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); paletteSel = Math.max(0, paletteSel-1); renderPaletteList(true); }
    else if(e.key==='Enter'){ e.preventDefault(); runPaletteItem(paletteSel); }
    else if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); closePalette(); }
  });
  paletteSel = 0; renderPaletteList(); inp.focus();
}
function closePalette(){ const el = document.getElementById('cmdk'); if(el) el.remove(); }
function renderPaletteList(keepScroll){
  const inp = document.getElementById('cmdkInput'), list = document.getElementById('cmdkList'); if(!inp || !list) return;
  if(!keepScroll) paletteItems = paletteCompute(inp.value);
  if(!paletteItems.length){ list.innerHTML = `<div class="cmdk-empty">Ничего не нашлось</div>`; return; }
  let lastGroup = '';
  list.innerHTML = paletteItems.map((it,n)=>{ const head = it.group!==lastGroup ? `<div class="cmdk-group">${esc(it.group)}</div>` : ''; lastGroup = it.group;
    return head+`<div class="cmdk-item ${n===paletteSel?'sel':''}" role="option" data-n="${n}" onmousemove="if(paletteSel!==${n}){paletteSel=${n};renderPaletteList(true);}" onclick="runPaletteItem(${n})"><span class="cmdk-ic">${icon(it.icon||'chevronRight',16)}</span><span class="cmdk-label">${esc(it.label)}</span>${it.hint?`<span class="cmdk-hint">${esc(it.hint)}</span>`:''}</div>`; }).join('');
  const sel = list.querySelector('.cmdk-item.sel'); if(sel && sel.scrollIntoView) sel.scrollIntoView({block:'nearest'});
}
function runPaletteItem(n){ const it = paletteItems[n]; if(!it) return; closePalette(); try{ it.run(); }catch(e){ toast('Не получилось: '+e.message); } }

/* ---------- page transitions ----------
   Navigation (not every re-render after an action) cross-fades the content area with the View
   Transitions API where the browser has it, then cards rise in one by one and numbers count up. */
const reduceMotion = ()=> window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
let lastRouteKey = null;
function routeKey(){ return (location.hash||'#/').split('/').slice(0,4).join('/'); }
function navigate(){
  const key = routeKey(), samePage = key===lastRouteKey;
  lastRouteKey = key;
  const run = ()=>{ router(); if(!samePage) window.scrollTo(0,0); };
  if(samePage || reduceMotion()){ run(); if(!samePage) afterNav(); return; }
  if(document.startViewTransition){
    document.documentElement.classList.add('nav-vt');
    const vt = document.startViewTransition(run);
    vt.finished.finally(()=>document.documentElement.classList.remove('nav-vt'));
    vt.updateCallbackDone.then(afterNav);
  } else { run(); const c = document.getElementById('content'); c.classList.remove('page-enter'); void c.offsetWidth; c.classList.add('page-enter'); afterNav(); }
}
function afterNav(){
  if(reduceMotion()) return;
  const content = document.getElementById('content');
  content.querySelectorAll('.stagger').forEach(g=>[...g.children].slice(0,16).forEach((ch,i)=>ch.style.setProperty('--i', i)));
  content.classList.add('entering');
  clearTimeout(afterNav._t); afterNav._t = setTimeout(()=>content.classList.remove('entering'), 1400);
  content.querySelectorAll('[data-count]').forEach(countUp);
}
function countUp(el){
  const target = +el.dataset.count, suffix = el.dataset.suffix || '';
  if(!isFinite(target) || target<=0) return;
  const start = performance.now(), dur = Math.min(1100, 500 + target*2);
  const tick = now=>{
    const t = Math.min(1, (now-start)/dur), v = Math.round(target*(1-Math.pow(1-t,3)));
    el.textContent = v.toLocaleString('ru-RU') + suffix;
    if(t<1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
window.addEventListener('hashchange', navigate);
window.addEventListener('hashchange', ()=>toggleNav(false));
document.addEventListener('keydown', e=>{
  if((e.metaKey||e.ctrlKey) && (e.key.toLowerCase()==='k' || e.key.toLowerCase()==='л')){
