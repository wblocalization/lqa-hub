  </div>`;
}

/* =========================================================
   TEAM STORAGE — record-level sync through the Apps Script backend (Google Drive)
   Local changes are found by comparing a hash of every record with the hash it had at the last
   sync ("base"); they're pushed, then everything newer than our last known server revision is
   pulled and merged record by record. Deletions travel as ids. Tables starting with "_" are
   local-only; AI connection settings stay per browser.
   ========================================================= */
const SYNC_KEY = 'lqa_sync';
const SYNC_LOCAL_SETTINGS = ['aiEnabled','aiEndpointUrl','aiModel','aiToken','aiBatchSize'];
const SYNC_IMMUTABLE = {visualShotImages:true};
const SYNC_BATCH_BYTES = 3500000;
let syncBusy = false, syncAgain = false, syncTimer = null, syncApplying = false;
let syncStatus = {state:'off', at:0, msg:'', sent:0, got:0};
function syncEnabled(){ try{ return localStorage.getItem(SYNC_KEY)==='on'; }catch(e){ return false; } }
function syncState(){
  let st = (DB._sync||[])[0];
  if(!st){ st = {id:'state', lastRev:0, base:{}}; DB._sync = [st]; }
  return st;
}
function saveSyncState(){ idbPersist('_sync', DB._sync); }
function fnvHash(str){ let h = 0x811c9dc5; for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); } return (h>>>0).toString(36)+str.length.toString(36); }
function syncStrip(t, rec){ if(t!=='settings') return rec; const c = Object.assign({}, rec); SYNC_LOCAL_SETTINGS.forEach(k=>delete c[k]); return c; }
function syncHash(t, rec){ return SYNC_IMMUTABLE[t] ? 'i' : fnvHash(JSON.stringify(syncStrip(t, rec))); }
function syncTables(){ return Object.keys(DB).filter(t=>Array.isArray(DB[t]) && !t.startsWith('_')); }
function collectLocalChanges(){
  const st = syncState(), out = {}; let count = 0;
  syncTables().forEach(t=>{
    const base = st.base[t] || {}, seen = new Set(), ups = [];
    DB[t].forEach(rec=>{
      if(!rec || rec.id==null) return;
      const id = String(rec.id); seen.add(id);
      const h = syncHash(t, rec);
      if(base[id]!==h) ups.push({rec:syncStrip(t, rec), h, id});
    });
    const dels = Object.keys(base).filter(id=>!seen.has(id));
    if(ups.length || dels.length){ out[t] = {ups, dels}; count += ups.length + dels.length; }
  });
  return {changes:out, count};
}
// split into requests of a few MB — Apps Script accepts big bodies, but smaller ones fail less
function buildSyncBatches(changes){
  const batches = []; let cur = null, size = 0;
  const fresh = ()=>{ cur = {push:{}, hashes:{}, dels:{}, n:0}; size = 0; batches.push(cur); };
  fresh();
  Object.entries(changes).forEach(([t, ch])=>{
    ch.dels.forEach(id=>{ (cur.push[t] = cur.push[t] || {upserts:[], deletes:[]}).deletes.push(id); (cur.dels[t] = cur.dels[t] || []).push(id); cur.n++; });
    ch.ups.forEach(u=>{
      const len = JSON.stringify(u.rec).length;
      if(size && size + len > SYNC_BATCH_BYTES) fresh();
      (cur.push[t] = cur.push[t] || {upserts:[], deletes:[]}).upserts.push(u.rec);
      (cur.hashes[t] = cur.hashes[t] || {})[u.id] = u.h;
      size += len; cur.n++;
    });
  });
  return batches;
}
async function syncRequest(body){
  const s = getSettings();
  const res = await fetch(s.aiEndpointUrl, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(Object.assign({mode:'sync', token:s.aiToken||''}, body))});
  if(!res.ok) throw new Error('backend ответил HTTP '+res.status);
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  return data;
}
function applyRemoteChanges(changes){
  const st = syncState(); let got = 0; const touchedTables = [];
  syncApplying = true;
  try{
    Object.entries(changes||{}).forEach(([t, ch])=>{
      if(t.startsWith('_')) return;
      const arr = (DB[t]||[]).slice(), idx = new Map(arr.map((r,i)=>[String(r.id), i]));
      const base = st.base[t] = st.base[t] || {}; let touched = false;
      (ch.upserts||[]).forEach(rec=>{
        const id = String(rec.id);
        let incoming = rec;
        if(t==='settings'){ const local = idx.has(id) ? arr[idx.get(id)] : {}; incoming = Object.assign({}, rec); SYNC_LOCAL_SETTINGS.forEach(k=>{ if(local && k in local) incoming[k] = local[k]; }); }
        const h = syncHash(t, incoming);
        if(idx.has(id)){
          const cur = arr[idx.get(id)], curH = syncHash(t, cur);
          if(curH===h){ base[id] = h; return; }
          if(base[id] && curH!==base[id]) return; // edited here during this sync — ours goes up next time
          arr[idx.get(id)] = incoming;
        } else { idx.set(id, arr.length); arr.push(incoming); }
        base[id] = h; touched = true; got++;
      });
      (ch.deletes||[]).forEach(id=>{ id = String(id); if(idx.has(id)){ arr[idx.get(id)] = null; touched = true; got++; } delete base[id]; });
      if(touched){ DB[t] = arr.filter(Boolean); idbPersist(t, DB[t]); touchedTables.push(t); }
    });
  } finally { syncApplying = false; }
  return {got, touchedTables};
}
function setSyncStatus(state, extra){ syncStatus = Object.assign({}, syncStatus, {state}, extra||{}); renderSyncBadge(); const card = document.getElementById('syncStatusLine'); if(card) card.innerHTML = syncStatusText(); }
function syncStatusText(){
  const s = syncStatus;
  if(!syncEnabled()) return 'Выключено — данные только в этом браузере';
  if(s.state==='busy') return 'Синхронизирую…';
  if(s.state==='error') return '<span style="color:var(--crit)">Ошибка: '+esc(s.msg)+'</span>';
  if(!s.at) return 'Ещё не синхронизировалось';
  return 'Синхронизировано '+timeAgo(s.at)+(s.sent||s.got?' · отправлено '+s.sent+', получено '+s.got:'');
}
function renderSyncBadge(){
  const b = document.getElementById('syncBadge'); if(!b) return;
  b.style.display = syncEnabled() ? 'flex' : 'none';
  b.dataset.state = syncStatus.state;
  b.title = 'Командное хранилище: '+syncStatusText().replace(/<[^>]+>/g,'')+'. Нажми, чтобы синхронизировать';
}
function uiIsBusy(){
  const a = document.activeElement;
  return (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) || document.getElementById('modalRoot').children.length || document.getElementById('dialogRoot')?.children.length
    || document.getElementById('shotViewer') || document.getElementById('detailPanel').classList.contains('open');
}
async function syncNow(manual){
  const s = getSettings();
  if(!syncEnabled()){ if(manual) toast('Командное хранилище выключено — включи его в Настройках'); return; }
  if(!s.aiEndpointUrl){ setSyncStatus('error', {msg:'не указан адрес backend в Настройках'}); return; }
  if(syncBusy){ syncAgain = true; return; }
  syncBusy = true; setSyncStatus('busy');
  try{
    const st = syncState();
    let sent = 0, result = {got:0, touchedTables:[]};
    // first sync of this browser: take the team's data first, so local defaults (e.g. fresh
    // settings) don't overwrite what the team already has; our own records go up right after
    if(!st.lastRev){
      const first = await syncRequest({since:0, pull:true, push:{}});
      result = applyRemoteChanges(first.changes); st.lastRev = first.rev; saveSyncState();
    }
    const {changes} = collectLocalChanges();
    const batches = buildSyncBatches(changes);
    for(let b=0; b<batches.length; b++){
      const last = b===batches.length-1;
      const resp = await syncRequest({since:st.lastRev, pull:last, push:batches[b].push});
      Object.entries(batches[b].hashes).forEach(([t, m])=>{ st.base[t] = Object.assign(st.base[t]||{}, m); });
      Object.entries(batches[b].dels).forEach(([t, ids])=>{ ids.forEach(id=>{ if(st.base[t]) delete st.base[t][id]; }); });
      sent += batches[b].n;
      if(last){ const r2 = applyRemoteChanges(resp.changes); result = {got:result.got+r2.got, touchedTables:[...new Set(result.touchedTables.concat(r2.touchedTables))]}; st.lastRev = resp.rev; }
      saveSyncState();
    }
    setSyncStatus('ok', {at:Date.now(), sent, got:result.got, msg:''});
    if(result.touchedTables.length){
      renderSidebar();
      if(!uiIsBusy()) router();
      else toast('Команда внесла изменения', {duration:8000, action:{label:'Обновить', fn:()=>router()}});
    }
    if(manual) toast(result.got||sent ? 'Синхронизировано: отправлено '+sent+', получено '+result.got : 'Всё уже синхронизировано');
  }catch(err){
    setSyncStatus('error', {msg: /Failed to fetch/.test(err.message) ? 'backend недоступен' : err.message});
    if(manual) toast('Не получилось синхронизировать: '+syncStatus.msg);
  }finally{
    syncBusy = false;
    if(syncAgain){ syncAgain = false; scheduleSync(1500); }
  }
}
function scheduleSync(delay){
  if(!syncEnabled() || syncApplying) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(()=>syncNow(false), delay==null ? 3000 : delay);
}
function onLocalChange(table){ if(table && String(table).startsWith('_')) return; scheduleSync(); }
async function setSyncEnabled(on){
  const s = getSettings();
  if(on && !s.aiEndpointUrl){ toast('Сначала укажи адрес backend и ключ доступа в блоке «Проверка ИИ» ниже'); router(); return; }
  if(on){
    const ok = await uiConfirm({title:'Включить командное хранилище?', icon:'globe', danger:false, okText:'Включить',
      text:'Данные этого браузера отправятся в общее хранилище на Google Диске, а данные коллег придут сюда. Дальше всё синхронизируется само, раз в минуту и после изменений.<br><br>Перед первым включением лучше скачать резервную копию.'});
    if(!ok){ router(); return; }
  }
  try{ localStorage.setItem(SYNC_KEY, on ? 'on' : 'off'); }catch(e){}
  setSyncStatus(on ? 'idle' : 'off');
  router();
  if(on) syncNow(true);
}

/* =========================================================
   PLACEHOLDER / VARIABLE / TAG DETECTION
   ========================================================= */
const VAR_RE = /\{\{[^{}]*\}\}|\$\{[^{}]*\}|%%|%(\d+\$)?[-+0 #]*\d*(\.\d+)?[sdxXofc@]|\{\d+\}/g;
// Distinguishes real translatable copy from strings that are legitimately identical
// between source and target because there's nothing to translate: pure placeholder
// strings ("%@ · %@ · %@"), locale codes ("RU"), brand/campaign names ("FUN&SUN").
// Real sentences almost always contain either a longish word (4+ letters, any script —
// covers caseless scripts like Georgian too) or a lowercase letter (covers short mixed-
// case words); bare codes/acronyms/brand names are short and either all-caps or symbols.
function looksLikeTranslatableText(str){
  if(!str) return false;
  const stripped = str.replace(new RegExp(VAR_RE.source, VAR_RE.flags), ' ');
  const words = stripped.match(/\p{L}+/gu) || [];
  return words.some(w => w.length>=4 || (w.length>=2 && /\p{Ll}/u.test(w)));
}
// How many plural forms gettext expects per language (nplurals). A file's own Plural-Forms
// header wins over this table; languages missing here are only checked against the header.
const PLURAL_COUNTS = {ru:3, uk:3, be:3, kk:2, uz:2, ky:2, tg:2, hy:2, ka:2, az:2, en:2, am:2, sw:2, tr:2, fr:2, zh:1, ko:1, ar:6};
function baseLang(code){ return String(code||'').toLowerCase().split(/[-_]/)[0]; }
// Currency each market shows prices in — a leftover ₽ in, say, the Kazakh UI is almost always a bug
const LOCALE_CURRENCY = {kk:'₸ (тенге)', uz:'сум', ky:'сом', hy:'֏ (драм)', ka:'₾ (лари)', az:'₼ (манат)', tg:'сомони', be:'Br (белорусский рубль)', en:'валюта рынка', zh:'валюта рынка', tr:'₺'};
const GUILLEMET_LANGS = ['ru','kk','ky','be','tg','uz','az','hy','uk'];
function parseDntTerms(text){ return String(text||'').split(/[\n,;]+/).map(t=>t.trim()).filter(t=>t.length>1); }
function hasWholeTerm(text, term){
  return new RegExp('(?<![\\p{L}\\p{N}])'+term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?![\\p{L}\\p{N}])', 'u').test(text||'');
}
// Languages whose UI is not written in Cyrillic: Cyrillic letters in their translation are almost
// always an untranslated or copy-pasted Russian piece. (Uzbek also exists in Cyrillic, so for uz
// only a Latin text with Cyrillic words mixed in is flagged.)
const NON_CYRILLIC_LANGS = ['en','tr','fr','az','uz','sw','hy','ka','zh','ko','ar','he','am'];
const CYR_WORD_RE = /[\u0400-\u04FF]+(?:[-'’][\u0400-\u04FF]+)*/gu;
function visibleText(str){ return String(str||'').replace(new RegExp(VAR_RE.source,'g'),' ').replace(new RegExp(TAG_RE.source,'g'),' ').replace(/\{[^{}]*\}/g,' '); }
// "checkout.button.* = 20" per line → [{re, max, pattern}]
function parseLengthRules(text){
  return String(text||'').split('\n').map(l=>l.trim()).filter(l=>l && !l.startsWith('#')).map(l=>{
    const m = /^(.+?)\s*[=:]\s*(\d+)\s*$/.exec(l); if(!m) return null;
    const pattern = m[1].trim();
    return {pattern, max:+m[2], re:new RegExp('^'+pattern.split('*').map(x=>x.replace(/[.+?^${}()|[\]\\]/g,'\\$&')).join('.*')+'$', 'i')};
  }).filter(Boolean);
}
/* ---------- numbers ----------
   "12 990", "12,990", "12.990" and "12990" are the same number; "4,5" and "4.5" too. Only the
   numbers themselves are compared (as a multiset), so reordering in the sentence is fine. */
function extractNumbers(str){
  const vis = visibleText(str).replace(/\{[^{}]*\}/g,' ');
  const out = [];
  (vis.match(/\d(?:[\d    .,']*\d)?/g)||[]).forEach(raw=>{
    let t = raw.replace(/[    ']/g,'');
    const lastSep = Math.max(t.lastIndexOf('.'), t.lastIndexOf(','));
    if(lastSep>=0){
      const tail = t.slice(lastSep+1), head = t.slice(0,lastSep).replace(/[.,]/g,'');
      // "12.990"/"12,990" (exactly three digits after the only separator, several before) reads as thousands
      const onlyOne = (t.match(/[.,]/g)||[]).length===1;
      t = (onlyOne && tail.length===3) ? head+tail : head+'.'+tail;
    }
    t = t.replace(/^0+(?=\d)/,'');
    out.push({raw:raw.trim(), norm:t});
  });
  return out;
}
function numbersIssue(src, tgt){
  const a = extractNumbers(src), b = extractNumbers(tgt);
  if(!a.length) return null;
  const {missing, extra} = diffMultiset(a.map(x=>x.norm), b.map(x=>x.norm));
  if(!missing.length) return null;
  const rawOf = (list, n)=> (list.find(x=>x.norm===n)||{}).raw || n;
  return {missing: missing.map(n=>rawOf(a,n)), extra: extra.map(n=>rawOf(b,n))};
}

/* ---------- language rules ----------
   Built-in, per language; each returns {text, highlight, expected, severity}. Custom rules come
   from Settings: one per line «язык ; что искать ; подсказка», where «что искать» is text or
   /регулярка/. */
const CYR = '\\u0400-\\u04FF', LAT = 'A-Za-z';
const LANGUAGE_RULES = {
  uz: [t=>{ const m = t.match(/[oOgG]['’`‘]/); return m && {text:'Узбекский апостроф: в «oʻ» и «gʻ» ставится знак ʻ (U+02BB), а не '+m[0].slice(1), highlight:m[0], expected:m[0][0]+'ʻ', severity:'Низкая'}; }],
  hy: [t=>{ const m = /[Ա-և][^Ա-և]*$/.test(t) && t.trim().match(/[Ա-և]+([.:])\s*$/); return m && {text:'Армянская точка — «։» (վերջակետ), а не «'+m[1]+'»', highlight:m[1], expected:'։', severity:'Низкая'}; }],
  az: [t=>{ const m = t.match(/[Әә]/); return m && {text:'Кириллическая «'+m[0]+'» вместо латинской «'+(m[0]==='ә'?'ə':'Ə')+'» в азербайджанском', highlight:m[0], expected:m[0]==='ә'?'ə':'Ə', severity:'Высокая'}; }],
  kk: [t=>{ const m = t.match(/[əƏ]/); return m && {text:'Латинская «'+m[0]+'» вместо казахской «ә»', highlight:m[0], expected:'ә', severity:'Высокая'}; }],
  zh: [t=>{ const m = t.match(/[一-鿿][,.!?;:](?=[一-鿿]|$)/); return m && {text:'В китайском тексте — полноширинная пунктуация (，。！？；：), а не «'+m[0].slice(-1)+'»', highlight:m[0], severity:'Низкая'}; }],
};
// letters from the other alphabet hiding inside a word ("Сeбет" with a Latin «e») — invisible to the eye, breaks search and fonts
function homoglyphIssue(t, lang){
  const cyrLang = ['ru','kk','ky','tg','be','uk'].includes(lang) || (lang==='uz' && /[Ѐ-ӿ]{3}/.test(t));
  const re = cyrLang ? new RegExp('(?:['+CYR+']+['+LAT+']+['+CYR+']*|['+LAT+']+['+CYR+']+['+LAT+']*)','u')
    : ['en','tr','az','uz','fr'].includes(lang) ? new RegExp('['+LAT+']+['+CYR+']+['+LAT+']*|['+CYR+']+['+LAT+']+','u') : null;
  if(!re) return null;
  const m = visibleText(t).match(re);
  if(!m) return null;
  return {text:'Смешаны алфавиты внутри слова «'+m[0]+'» — вероятно, латинская буква вместо кириллической (или наоборот)', highlight:m[0], severity:'Высокая'};
}
function parseCustomLangRules(text){
  return String(text||'').split('\n').map(l=>l.trim()).filter(l=>l && !l.startsWith('#')).map(l=>{
    const parts = l.split(';').map(x=>x.trim());
    if(parts.length<2 || !parts[1]) return null;
    let re;
    const rx = /^\/(.+)\/([a-z]*)$/.exec(parts[1]);
    try{ re = rx ? new RegExp(rx[1], rx[2].replace(/[gy]/g,'')+(rx[2].includes('u')?'':'u')) : new RegExp(parts[1].replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'u'); }catch(e){ return null; }
    return {lang:(parts[0]||'*').toLowerCase(), re, hint:parts[2]||('Найдено «'+parts[1]+'»')};
  }).filter(Boolean);
}

/* ---------- ignore rules ----------
   {id, keyPattern, text, type, lang, action:'skip'|'fp', note}. Checked after every check run:
   a matching new problem is dropped ('skip') or created already closed as a false positive ('fp'). */
function globToRe(p){ return new RegExp('^'+String(p).split('*').map(x=>x.replace(/[.+?^${}()|[\]\\]/g,'\\$&')).join('.*')+'$', 'i'); }
function ignoreRuleMatches(rule, issue, row){
  if(rule.type && rule.type!==issue.type) return false;
  if(rule.lang && baseLang(rule.lang)!==baseLang(issue.languageCode) && rule.lang!==issue.languageCode) return false;
  if(rule.keyPattern && !(row && row.key && globToRe(rule.keyPattern).test(row.key))) return false;
  if(rule.text){ const hay = ((row?row.source:'')+'\n'+(row?row.target:'')+'\n'+(issue.text||'')).toLowerCase(); if(!hay.includes(String(rule.text).toLowerCase())) return false; }
  return !!(rule.type || rule.keyPattern || rule.text);
}
function applyIgnoreRules(rowIds){
  const rules = getSettings().ignoreRules || [];
  if(!rules.length) return {skipped:0, closed:0};
  const idSet = rowIds ? new Set(rowIds) : null;
  const rowsById = {}; dbList('rows').forEach(r=>rowsById[r.id]=r);
  let skipped = 0, closed = 0;
  const out = [];
  dbList('issues').forEach(i=>{
    const fresh = i.status==='Новая' && !i.manual && !i.visual && (i.history||[]).length<=1 && (!idSet || idSet.has(i.rowId));
    const rule = fresh && rules.find(r=>ignoreRuleMatches(r, i, rowsById[i.rowId]));
    if(!rule){ out.push(i); return; }
    if(rule.action==='skip'){ skipped++; return; }
    closed++;
    out.push(Object.assign({}, i, {status:'Ложное срабатывание', history:(i.history||[]).concat([{ts:nowISO(), action:'Ложное срабатывание (правило «игнорировать»'+(rule.note?': '+rule.note:'')+')'}])}));
  });
  if(skipped || closed) dbSave('issues', out);
  return {skipped, closed};
}
function ignoreRuleText(r){
  const parts = [];
  if(r.type) parts.push('тип «'+r.type+'»');
  if(r.keyPattern) parts.push('ключ '+r.keyPattern);
  if(r.lang) parts.push('язык '+r.lang);

const REBRAND_TERMS = ['WB','ВБ','RWB','РВБ','Wildberries','Вайлдберриз'];
const REBRAND_LANGUAGES = ['az']; // languages currently following the WB→N11 rebrand rule
function isUrlOrEmailContext(text, matchStart, matchEnd){
  // a brand mention that's part of an actual URL or email address (a real domain like
  // wildberries.ru, or inside an href="...") legitimately keeps its real address — only
  // the visible/translatable copy around it should say N11
  const after = text.slice(matchEnd, matchEnd+8);
  if(/^\.[a-z]{2,6}\b/i.test(after)) return true; // "...berries.ru", "...berries.com"
  const before = text.slice(Math.max(0, matchStart-15), matchStart);
  if(/(https?:\/\/|www\.|@|\/\/)[\w.-]*$/i.test(before)) return true; // preceded by protocol, www., or @
  return false;
}
function findRebrandingTerms(text){
  if(!text) return [];
  const found = [];
  REBRAND_TERMS.forEach(term=>{
    const re = new RegExp('(?<![\\p{L}\\p{N}])'+term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?![\\p{L}\\p{N}])', 'giu');
    let m;
    while((m = re.exec(text)) !== null){
      if(!isUrlOrEmailContext(text, m.index, m.index+m[0].length)){ found.push({term, matched:m[0], index:m.index}); break; }
      if(m[0].length===0) re.lastIndex++;
    }
  });
  return found;
}
const TAG_RE = /<\/?[a-zA-Z][^<>]*>/g;
function extractTagsNormalized(str){
  // compares tags by name only (<a>, </a>, <b>…) so attribute differences
  // (quote style, href value, order) never trigger a false "потерян тег"
  if(!str) return [];
  const re = new RegExp(TAG_RE.source, TAG_RE.flags);
  const out = []; let m;
  while((m = re.exec(str)) !== null){
    const raw = m[0];
    const closing = raw.startsWith('</');
    const nameMatch = raw.match(/^<\/?\s*([a-zA-Z][a-zA-Z0-9]*)/);
    out.push((closing?'</':'<') + (nameMatch?nameMatch[1].toLowerCase():raw) + '>');
    if(raw.length===0) re.lastIndex++;
  }
  return out;
}
const BREAK_RE = /\\n|\\r/g;
function extractAll(str, re){ if(!str) return []; const r = new RegExp(re.source, re.flags); return str.match(r) || []; }
function diffMultiset(a, b){
  const ca={}, cb={};
  a.forEach(t=>ca[t]=(ca[t]||0)+1); b.forEach(t=>cb[t]=(cb[t]||0)+1);
  const missing=[], extra=[];
  new Set([...Object.keys(ca), ...Object.keys(cb)]).forEach(k=>{
    const s=ca[k]||0, t=cb[k]||0;
    if(s>t) for(let i=0;i<s-t;i++) missing.push(k);
    if(t>s) for(let i=0;i<t-s;i++) extra.push(k);
  });
  return {missing, extra};
}
function highlightTokens(str){
  if(!str) return '';
  const res = [];
  [VAR_RE, TAG_RE, BREAK_RE].forEach(re=>{
    const r = new RegExp(re.source, re.flags); let m;
    while((m = r.exec(str)) !== null){ res.push({start:m.index, end:m.index+m[0].length, text:m[0]}); if(m[0].length===0) r.lastIndex++; }
  });
  res.sort((a,b)=>a.start-b.start);
  let out='', last=0;
  res.forEach(m=>{ if(m.start<last) return; out += esc(str.slice(last,m.start)) + '<span class="mark">'+esc(m.text)+'</span>'; last=m.end; });
  out += esc(str.slice(last));
  return out;
}
/* ---- precise problem-fragment highlighting (extends highlightTokens, doesn't replace it) ---- */
function findHighlightRange(str, text, caseInsensitive){
  if(!str || !text) return null;
  const hay = caseInsensitive ? str.toLowerCase() : str;
  const needle = caseInsensitive ? text.toLowerCase() : text;
  const idx = hay.indexOf(needle);
  if(idx<0) return null;
  return {start: idx, end: idx+text.length};
}
function findRawTagText(str, normalizedToken){
  if(!str) return null;
  const re = new RegExp(TAG_RE.source, TAG_RE.flags);
  let m;
  while((m = re.exec(str)) !== null){
    const raw = m[0];
    const closing = raw.startsWith('</');
    const nameMatch = raw.match(/^<\/?\s*([a-zA-Z][a-zA-Z0-9]*)/);
    const norm = (closing?'</':'<') + (nameMatch?nameMatch[1].toLowerCase():raw) + '>';
    if(norm === normalizedToken) return raw;
    if(raw.length===0) re.lastIndex++;
  }
  return null;
}
function extractWordAt(str, idx){
  let start=idx, end=idx;
  const isLetter = ch => ch!==undefined && /[\p{L}\p{N}]/u.test(ch);
  while(start>0 && isLetter(str[start-1])) start--;
  while(end<str.length && isLetter(str[end])) end++;
  return str.slice(start,end);
}
function issueHlClass(severity){
  return {'Критическая':'issue-hl-crit','Высокая':'issue-hl-high','Средняя':'issue-hl-med','Низкая':'issue-hl-low'}[severity] || 'issue-hl-med';
}
// Renders one side (source/target) of a row, overlaying the issue's specific problem
// fragment (if any) on top of the existing generic token highlighting — old issues
// without highlight fields fall straight back to plain highlightTokens().
function renderFieldWithHighlight(str, issue, field){
  if(!str) return '';
  if(!issue || issue.highlightField!==field || !issue.highlightText) return highlightTokens(str);
  const range = findHighlightRange(str, issue.highlightText, true);
  if(!range) return highlightTokens(str);
  const cls = issueHlClass(issue.severity);
  return highlightTokens(str.slice(0,range.start)) + '<mark class="'+cls+'">'+esc(str.slice(range.start,range.end))+'</mark>' + highlightTokens(str.slice(range.end));
}

/* =========================================================
   .PO PARSER
   ========================================================= */
function extractQuoted(line){
  const start = line.indexOf('"');
  if(start<0) return '';
  let i = start+1, out = '';
  while(i<line.length){
    const ch = line[i];
    if(ch==='\\' && i+1<line.length){ out += ch+line[i+1]; i += 2; continue; }
    if(ch==='"') break;
    out += ch; i++;
  }
  return out.replace(/\\"/g,'"');
}
function isContinuationLine(line){
  const t = line.trim();
  return t.length>=2 && t.charCodeAt(0)===34 && t.charCodeAt(t.length-1)===34;
}
function tokenizePoBlock(lines){
  let idx=0;
  while(idx<lines.length && lines[idx].startsWith('#')) idx++;
  let msgctxt=null;
  if(lines[idx] && lines[idx].startsWith('msgctxt')){
    let val = extractQuoted(lines[idx]); idx++;
    while(lines[idx] && isContinuationLine(lines[idx])){ val += extractQuoted(lines[idx]); idx++; }
    msgctxt = val;
  }
  let msgidIdx=-1, msgid='';
  if(lines[idx] && lines[idx].startsWith('msgid ')){
    msgidIdx = idx; msgid = extractQuoted(lines[idx]); idx++;
    while(lines[idx] && isContinuationLine(lines[idx])){ msgid += extractQuoted(lines[idx]); idx++; }
  }
  let msgidPlural = null;
  if(lines[idx] && lines[idx].startsWith('msgid_plural')){
    msgidPlural = extractQuoted(lines[idx]); idx++;
    while(lines[idx] && isContinuationLine(lines[idx])){ msgidPlural += extractQuoted(lines[idx]); idx++; }
  }
  let msgstrIdx=-1, msgstr='';
  const forms = [];
  // plural entries carry msgstr[0], msgstr[1]… — keep every form, not just the first
  while(lines[idx] && /^msgstr(\[\d+\])?\s/.test(lines[idx])){
    if(msgstrIdx<0) msgstrIdx = idx;
    let val = extractQuoted(lines[idx]); idx++;
    while(lines[idx] && isContinuationLine(lines[idx])){ val += extractQuoted(lines[idx]); idx++; }
    forms.push(val);
  }
  msgstr = forms[0] || '';
  return {msgctxt, msgidIdx, msgid, msgidPlural, msgstrIdx, msgstr, forms};
}
function parseTranslationFile(filename, text){
  const lower = filename.toLowerCase();
  if(lower.endsWith('.json')) return parseJsonEntries(text);
  if(lower.endsWith('.csv') || lower.endsWith('.tsv')) return parseCsvEntries(text);
  return parsePoText(text);
}
function parsePoText(text){
  const normalized = text.replace(/\r\n/g,'\n');
  const blocks = normalized.split(/\n\s*\n/);
  const entries = [];
  let headerPlurals = 0;
  blocks.forEach(blockText=>{
    if(!blockText.trim()) return;
    const lines = blockText.split('\n');
    const isObsolete = lines.some(l=>l.trim().startsWith('#~'));
    const p = tokenizePoBlock(lines);
    const isHeader = p.msgidIdx>=0 && p.msgid==='' && !p.msgctxt;
    if(isHeader){ const m = /nplurals\s*=\s*(\d+)/.exec(p.msgstr); if(m) headerPlurals = +m[1]; return; }
    if(p.msgidIdx>=0 && p.msgstrIdx>=0 && !isObsolete){
      const en = {key:p.msgctxt||'', source:p.msgid, target:p.msgstr};
      if(p.msgidPlural!=null){ en.sourcePlural = p.msgidPlural; en.targetForms = p.forms; }
      entries.push(en);
    }
  });
  if(headerPlurals) entries.forEach(en=>{ if(en.targetForms) en.nplurals = headerPlurals; });
  return entries;
}

function yieldToUI(){ return new Promise(resolve=>setTimeout(resolve, 0)); }
async function runTechnicalCheckOnRows(rowIds, override, onProgress){
  const s = Object.assign({}, getSettings(), override||{});
  const issues = dbList('issues').filter(i=>!rowIds.includes(i.rowId) || i.manual); // keep manual issues, drop old auto issues for these rows
  const allRows = dbList('rows');
  const rowsById = {}; allRows.forEach(r=>{ rowsById[r.id]=r; });
  const dntTerms = parseDntTerms(s.dntTerms);
  const lengthRules = parseLengthRules(s.lengthRules);
  const customLangRules = parseCustomLangRules(s.customLangRules);
  const CHUNK = 1500;
  for(let start=0; start<rowIds.length; start+=CHUNK){
    const chunk = rowIds.slice(start, start+CHUNK);
    chunk.forEach(rowId=>{
      const r = rowsById[rowId];
      if(!r) return;
      const src = r.source||'', tgt = r.target||'';
      const srcTrim = src.trim(), tgtTrim = tgt.trim();
      const push = (type, severity, text, extra) => issues.push(Object.assign({
        id: uid(), rowId: r.id, projectId:r.projectId, componentId:r.componentId, languageCode:r.languageCode,
        type, severity, text, status:'Новая', createdAt: nowISO(), history:[{ts:nowISO(),action:'Обнаружена (техническая проверка)'}],
        aiExplanation:null, aiSuggestion:null, aiConfidence:null,
        highlightField:null, highlightText:null, expectedText:null, confidence:'high', matchType:null
      }, extra||{}));

      if(s.checkUntranslated){
        if(!tgtTrim && srcTrim) push('Не переведено','Критическая','Пустой перевод');
        else if(tgtTrim && srcTrim && tgtTrim===srcTrim && looksLikeTranslatableText(srcTrim)) push('Не переведено','Высокая','Перевод совпадает с исходным текстом');
      }
      if(s.checkVars){
        const {missing, extra} = diffMultiset(extractAll(src,VAR_RE), extractAll(tgt,VAR_RE));
        if(missing.length) push('Переменные','Критическая','Потеряна переменная: '+missing.join(', '), {highlightField:'source', highlightText:missing[0]});
        if(extra.length) push('Переменные','Критическая','Лишняя переменная: '+extra.join(', '), {highlightField:'target', highlightText:extra[0]});
        if(!missing.length && !extra.length){
          const so=extractAll(src,VAR_RE), to=extractAll(tgt,VAR_RE);
          if(so.length>1 && so.join('|')!==to.join('|')) push('Переменные','Средняя','Порядок переменных отличается от исходного');
        }
      }
      if(s.checkTags){
        const {missing, extra} = diffMultiset(extractTagsNormalized(src), extractTagsNormalized(tgt));
        if(missing.length) push('Разметка','Критическая','Потерян тег: '+missing.join(', '), {highlightField:'source', highlightText: findRawTagText(src, missing[0]) || missing[0]});
        if(extra.length) push('Разметка','Критическая','Лишний тег: '+extra.join(', '), {highlightField:'target', highlightText: findRawTagText(tgt, extra[0]) || extra[0]});
      }
      if(s.checkBreaks){
        const {missing, extra} = diffMultiset(extractAll(src,BREAK_RE), extractAll(tgt,BREAK_RE));
        if(missing.length) push('Перенос строки','Высокая','Потерян перенос строки', {highlightField:'source', highlightText:missing[0]});
        if(extra.length) push('Перенос строки','Высокая','Лишний перенос строки', {highlightField:'target', highlightText:extra[0]});
      }
      if(s.checkSpaces){
        let m;
        if(m = tgt.match(/^\s+/)) push('Пробелы','Низкая','Пробел в начале строки', {highlightField:'target', highlightText:m[0]});
        if(tgt.length && (m = tgt.match(/\s+$/))) push('Пробелы','Низкая','Пробел в конце строки', {highlightField:'target', highlightText:m[0]});
        if(m = tgt.match(/ {2,}/)) push('Пробелы','Низкая','Двойной пробел', {highlightField:'target', highlightText:m[0]});
      }
      if(s.checkPunct){
        let m;
        if(m = tgt.match(/ [.,!?;:]/)) push('Пунктуация','Средняя','Пробел перед знаком препинания', {highlightField:'target', highlightText:m[0]});
        if(m = tgt.match(/([!?,;:])\1+/)) push('Пунктуация','Средняя','Повторяющийся знак препинания', {highlightField:'target', highlightText:m[0]});
        if(m = tgt.match(/\.{4,}/)) push('Пунктуация','Средняя','Слишком много точек подряд', {highlightField:'target', highlightText:m[0]});
      }
      if(s.checkLength && srcTrim.length>=3 && tgtTrim.length>0){
        const ratio = tgtTrim.length/srcTrim.length;
        if(ratio > (s.lengthRatio||1.6)) push('Длина','Средняя','Перевод заметно длиннее исходного (×'+ratio.toFixed(2)+') — может не влезть в интерфейс');
      }
      if(s.checkRebranding && REBRAND_LANGUAGES.includes((r.languageCode||'').toLowerCase())){
        const found = findRebrandingTerms(tgt);
        if(found.length) push('Ребрендинг','Высокая','В переводе остались старые упоминания бренда, должно быть N11: '+found.map(f=>f.matched).join(', '),
          {highlightField:'target', highlightText:found[0].matched, expectedText:'N11', matchType:'rebrand', confidence:'high'});
      }
      const lang = baseLang(r.languageCode);
      if(s.checkPlurals && r.targetForms){
        const need = r.nplurals || PLURAL_COUNTS[lang];
        if(need && r.targetForms.length!==need) push('Множественное число','Высокая','Форм множественного числа '+r.targetForms.length+', а для этого языка нужно '+need+(r.nplurals?' (по заголовку файла)':''));
        r.targetForms.forEach((f,i)=>{
          if(i===0) return; // form 0 is the row's own target and goes through every check above
          if(!String(f||'').trim()){ push('Множественное число','Критическая','Не заполнена форма №'+(i+1)+' множественного числа'); return; }
          const {missing, extra} = diffMultiset(extractAll(r.sourcePlural||src, VAR_RE), extractAll(f, VAR_RE));
          if(missing.length) push('Множественное число','Высокая','В форме №'+(i+1)+' потеряна переменная: '+missing.join(', '));
          if(extra.length) push('Множественное число','Высокая','В форме №'+(i+1)+' лишняя переменная: '+extra.join(', '));
          const tagDiff = diffMultiset(extractTagsNormalized(r.sourcePlural||src), extractTagsNormalized(f));
          if(tagDiff.missing.length || tagDiff.extra.length) push('Множественное число','Высокая','В форме №'+(i+1)+' не совпадает разметка');
        });
      }
      if(s.checkLocale){
        let m;
        if(lang!=='ru' && (m = tgt.match(/₽|(?<![\p{L}])руб\.?(?![\p{L}])/u)) && LOCALE_CURRENCY[lang])
          push('Формат под страну','Средняя','В переводе осталась валюта «'+m[0]+'» — для этого языка обычно '+LOCALE_CURRENCY[lang], {highlightField:'target', highlightText:m[0]});
        if(GUILLEMET_LANGS.includes(lang) && /«[^»]*»/.test(src) && (m = tgt.match(/"[^"]+"/)))
          push('Формат под страну','Низкая','Прямые кавычки вместо «ёлочек», как в исходном тексте', {highlightField:'target', highlightText:m[0], expectedText:'«'+m[0].slice(1,-1)+'»'});
        if(lang==='en' && (m = tgt.match(/«[^»]*»/)))
          push('Формат под страну','Низкая','«Ёлочки» в английском тексте — принято “…” или "…"', {highlightField:'target', highlightText:m[0]});
      }
      if(s.checkNumbers && srcTrim && tgtTrim){
        const n = numbersIssue(src, tgt);
        if(n) push('Числа','Высокая','В переводе нет числа '+n.missing.map(x=>'«'+x+'»').join(', ')+(n.extra.length?' — вместо него '+n.extra.map(x=>'«'+x+'»').join(', '):''), {highlightField:n.extra.length?'target':'source', highlightText:n.extra.length?n.extra[0]:n.missing[0], expectedText:n.extra.length?n.missing[0]:null});
      }
      if(s.checkLangRules && tgtTrim){
        const found = [];
        (LANGUAGE_RULES[lang]||[]).forEach(fn=>{ const x = fn(tgt); if(x) found.push(x); });
        if(!found.length){ const h = homoglyphIssue(tgt, lang); if(h) found.push(h); } // a specific rule already names the odd letter
        customLangRules.forEach(cr=>{ if(cr.lang!=='*' && cr.lang!==lang && cr.lang!==String(r.languageCode||'').toLowerCase()) return; const m = tgt.match(cr.re); if(m) found.push({text:cr.hint, highlight:m[0], severity:'Средняя'}); });
        found.forEach(x=>push('Правила языка', x.severity||'Средняя', x.text, {highlightField:'target', highlightText:x.highlight||null, expectedText:x.expected||null}));
      }
      if(s.checkScript && NON_CYRILLIC_LANGS.includes(lang) && tgtTrim){
        const vis = visibleText(tgt);
        const cyr = vis.match(CYR_WORD_RE);
        if(cyr){
          const letters = (vis.match(/\p{L}/gu)||[]).length, cyrLetters = cyr.join('').length;
          if(lang!=='uz' || cyrLetters/letters < .5)
            push('Не тот алфавит','Высокая','Кириллица в тексте на языке, который пишется не кириллицей: «'+cyr.slice(0,3).join(', ')+'» — похоже на непереведённый кусок', {highlightField:'target', highlightText:cyr[0]});
        }
      }
      if(s.checkLimits && lengthRules.length && r.key){
        const rule = lengthRules.find(x=>x.re.test(r.key));
        if(rule){
          const forms = [tgt].concat(r.targetForms ? r.targetForms.slice(1) : []);
          const longest = Math.max(...forms.map(f=>visibleText(f).replace(/\s+/g,' ').trim().length));
          if(longest > rule.max) push('Лимит длины','Высокая','Длиннее лимита: '+longest+' символов при максимуме '+rule.max+' (правило «'+rule.pattern+'»)');
        }
      }
      if(s.checkDnt && dntTerms.length){
        dntTerms.forEach(term=>{
          if(REBRAND_LANGUAGES.includes(lang) && REBRAND_TERMS.some(b=>b.toLowerCase()===term.toLowerCase())) return; // rebrand rule owns these
          if(hasWholeTerm(src, term) && !hasWholeTerm(tgt, term))
            push('Не переводить','Средняя','«'+term+'» из списка «Не переводить» пропал из перевода или переведён', {highlightField:'source', highlightText:term, expectedText:term});
        });
      }
    });
    if(onProgress) onProgress(Math.min(start+CHUNK, rowIds.length), rowIds.length, 'tech');
    if(start+CHUNK < rowIds.length) await yieldToUI(); // let the tab repaint/respond between chunks instead of freezing solid
  }
  dbSave('issues', issues);
}

function runConsistencyCheck(projectId, override){
  const s = Object.assign({}, getSettings(), override||{});
  if(!s.checkConsistency) return;
  let issues = dbList('issues').filter(i=>!(i.projectId===projectId && i.type==='Согласованность'));
  const rows = dbQuery('rows', r=>r.projectId===projectId);
  const componentsById = {}; dbList('components').forEach(c=>{ componentsById[c.id]=c; });
  const groups = {};
  rows.forEach(r=>{
    const src=(r.source||'').trim(); if(!src) return;
    const gkey = r.languageCode+'||'+src.toLowerCase();
    (groups[gkey] = groups[gkey]||[]).push(r);
  });
  Object.values(groups).forEach(group=>{
    const byComponent = {};
    group.forEach(r=>{ (byComponent[r.componentId] = byComponent[r.componentId]||[]).push(r); });
    const componentIds = Object.keys(byComponent);
    if(componentIds.length < 2) return;
    const targets = new Set(group.map(r=>(r.target||'').trim()).filter(Boolean));
    if(targets.size < 2) return;
    group.forEach(r=>{
      if(!(r.target||'').trim()) return;
      const others = componentIds.filter(c=>c!==r.componentId)
        .map(c=>{
          const comp = componentsById[c];
          const txts = [...new Set(byComponent[c].map(x=>(x.target||'').trim()).filter(Boolean))];
          return (comp?comp.name:c) + ': «' + txts.join(' / ') + '»';
        }).join('; ');
      issues.push({
        id: uid(), rowId:r.id, projectId:r.projectId, componentId:r.componentId, languageCode:r.languageCode,
        type:'Согласованность', severity:'Средняя', text:'Возможное расхождение переводов. Другие папки — '+others,
        status:'Новая', createdAt:nowISO(), history:[{ts:nowISO(),action:'Обнаружена (проверка согласованности)'}],
        aiExplanation:null, aiSuggestion:null, aiConfidence:null
      });
    });
  });
  dbSave('issues', issues);
}

function levenshtein(a, b){
  const m=a.length, n=b.length;
  if(m===0) return n; if(n===0) return m;
  let prev = new Array(n+1); for(let j=0;j<=n;j++) prev[j]=j;
  for(let i=1;i<=m;i++){
    const cur=[i];
    for(let j=1;j<=n;j++) cur[j] = a[i-1]===b[j-1] ? prev[j-1] : 1+Math.min(prev[j-1], prev[j], cur[j-1]);
    prev=cur;
  }
  return prev[n];
}
function extractWordsWithPositions(str){
  const words=[]; const re=/[\p{L}\p{N}]+/gu; let m;
  while((m=re.exec(str))!==null) words.push({word:m[0], start:m.index});
  return words;
}
function containsApprovedForm(tgtLower, approvedLower){
  // Staged, cautious matching so a normal grammatical form (case, number, suffix
  // chains in agglutinative languages) is never treated as a glossary violation:
  //   1. exact/case-insensitive substring at a clean word boundary before it —
  //      this also covers "approved + suffix" (e.g. тапсырыс -> тапсырыстардың)
  //   2. a shorter stem of the approved term at a clean boundary — covers the
  //      word losing characters only at the tail
  //   3. whole-word edit-distance fallback — covers internal changes (vowel
  //      harmony, softened consonants) a plain substring search can't see;
  //      only reached when 1–2 found nothing, and always low-confidence
  //   4. nothing found at all — confident miss
  if(!approvedLower) return {matched:true, confidence:'exact', matchedText:null};
  const isLetter = ch => ch!==undefined && /[\p{L}\p{N}]/u.test(ch);
  const idx = tgtLower.indexOf(approvedLower);
  if(idx>=0){
    const before = idx>0 ? tgtLower[idx-1] : undefined;
    if(!isLetter(before)) return {matched:true, confidence:'exact', matchedText: approvedLower, matchStart: idx};
  }
  const minLen = Math.max(3, Math.ceil(approvedLower.length * 0.7));
  for(let len = approvedLower.length - 1; len >= minLen; len--){
    const stem = approvedLower.slice(0, len);
    const sIdx = tgtLower.indexOf(stem);
    if(sIdx>=0){
      const before = sIdx>0 ? tgtLower[sIdx-1] : undefined;
      if(!isLetter(before)) return {matched:true, confidence:'heuristic', matchedText: stem, matchStart: sIdx};
    }
  }
  if(approvedLower.length>=4){
    const words = extractWordsWithPositions(tgtLower);
    const maxDist = approvedLower.length<=6 ? 1 : 2;
    for(const w of words){
      if(Math.abs(w.word.length - approvedLower.length) > 2) continue;
      if(levenshtein(w.word, approvedLower) <= maxDist) return {matched:true, confidence:'heuristic', matchedText: w.word, matchStart: w.start};
    }
  }
  return {matched:false, confidence:'none', matchedText:null};
}
function crossPlatformGlossaryExamples(allRows, languageCode, componentId, termLower, approvedLower, componentsById){
  if(!approvedLower) return [];
  const seen = new Set(), examples = [];
  for(let i=0;i<allRows.length && examples.length<3;i++){
    const r = allRows[i];
    if(r.componentId===componentId || r.languageCode!==languageCode) continue;
    const src = (r.source||'').toLowerCase();
    if(!src.includes(termLower)) continue;
    const tgt = (r.target||'').toLowerCase();
    const check = containsApprovedForm(tgt, approvedLower);
    if(!check.matched || check.confidence!=='exact') continue; // only confident matches count as cross-platform proof
    const comp = componentsById[r.componentId];
    const label = comp ? comp.name : r.componentId;
    if(seen.has(label)) continue;
    seen.add(label);
    examples.push({component: label, target: r.target});
  }
  return examples;
}
function findCaseInsensitiveMatch(str, needle){
  if(!str || !needle) return null;
  const idx = str.toLowerCase().indexOf(needle.toLowerCase());
  if(idx<0) return null;
  return {index: idx, matched: str.slice(idx, idx+needle.length)};
}
async function runGlossaryCheck(projectId, override, onProgress){
  const s = Object.assign({}, getSettings(), override||{});
  if(!s.checkGlossary) return;
  let issues = dbList('issues').filter(i=>!(i.projectId===projectId && i.type==='Терминология'));
  const glossaries = dbQuery('glossaries', g=>!g.projectId || g.projectId===projectId);
  const glossaryIds = glossaries.map(g=>g.id);
  const glossaryLangById = {}; glossaries.forEach(g=>{ glossaryLangById[g.id] = g.language || ''; });
  const rawTerms = dbQuery('glossaryTerms', t=>glossaryIds.includes(t.glossaryId));
  if(!rawTerms.length){ dbSave('issues', issues); return; }
  // precompute lowercase fields once — these were previously recomputed on every single row, the dominant cost with a large glossary
  const terms = rawTerms.filter(t=>t.term).map(t=>({
    term: t.term, approved: t.approved||'', glossaryId: t.glossaryId,
    termLower: t.term.toLowerCase(), approvedLower: (t.approved||'').toLowerCase(),
    forbidden: t.forbidden||[], forbiddenLower: (t.forbidden||[]).map(f=>(f||'').toLowerCase()),
    language: t.language || ''
  }));
  const rows = dbQuery('rows', r=>r.projectId===projectId);
  const componentsById = {}; dbList('components').forEach(c=>{ componentsById[c.id]=c; });
  const CHUNK = 800;
  for(let start=0; start<rows.length; start+=CHUNK){
    const chunk = rows.slice(start, start+CHUNK);
    chunk.forEach(r=>{
      const srcLower = (r.source||'').toLowerCase(), tgtLower=(r.target||'').toLowerCase();
      if(!srcLower) return;
      terms.forEach(term=>{
        const termLang = glossaryLangById[term.glossaryId] || term.language;
        if(termLang && r.languageCode && termLang.toLowerCase()!==r.languageCode.toLowerCase()) return;
        if(!srcLower.includes(term.termLower)) return;

        const forbiddenIdx = term.forbiddenLower.findIndex(f=>f && tgtLower.includes(f));
        const approvedCheck = term.approvedLower ? containsApprovedForm(tgtLower, term.approvedLower) : {matched:true, confidence:'exact'};
        const isExact = approvedCheck.matched && approvedCheck.confidence==='exact';
        if(forbiddenIdx<0 && isExact) return; // clean — nothing to report, skip the cross-platform scan entirely

        const crossExamples = crossPlatformGlossaryExamples(rows, r.languageCode, r.componentId, term.termLower, term.approvedLower, componentsById);
        const crossNote = crossExamples.length ? ' Расхождение между папками — верно переведено в: ' + crossExamples.map(e=>e.component+' («'+e.target+'»)').join('; ') + '.' : '';
        const crossSuggestion = crossExamples.length ? crossExamples[0].target : null;
        const srcHit = findCaseInsensitiveMatch(r.source, term.term);

        if(forbiddenIdx>=0){
          const tgtHit = findCaseInsensitiveMatch(r.target, term.forbidden[forbiddenIdx]);
          issues.push({id:uid(), rowId:r.id, projectId:r.projectId, componentId:r.componentId, languageCode:r.languageCode,
            type:'Терминология', severity: crossExamples.length ? 'Критическая' : 'Высокая',
            text:'Термин «'+term.term+'»: найден запрещённый вариант «'+term.forbidden[forbiddenIdx]+'», ожидался «'+term.approved+'».'+crossNote,
            status:'Новая', createdAt:nowISO(), history:[{ts:nowISO(),action:'Обнаружена (проверка глоссария)'}],
            aiExplanation:null, aiSuggestion:null, aiConfidence:null, crossPlatformSuggestion: crossSuggestion,
            highlightField: tgtHit?'target':null, highlightText: tgtHit?tgtHit.matched:null, expectedText: term.approved, matchType:'forbidden', confidence:'high'});
        } else if(approvedCheck.confidence==='heuristic'){
          const foundForm = extractWordAt(r.target, approvedCheck.matchStart) || approvedCheck.matchedText;
          issues.push({id:uid(), rowId:r.id, projectId:r.projectId, componentId:r.componentId, languageCode:r.languageCode,
            type:'Терминология', severity:'Средняя',
            text:'Возможное несоответствие: найдена форма «'+foundForm+'», базовый термин — «'+term.approved+'». Возможно, это допустимая грамматическая форма.'+crossNote,
            status:'Новая', createdAt:nowISO(), history:[{ts:nowISO(),action:'Обнаружена (проверка глоссария)'}],
            aiExplanation:null, aiSuggestion:null, aiConfidence:null, crossPlatformSuggestion: crossSuggestion,
            highlightField: 'target', highlightText: foundForm, expectedText: term.approved, matchType:'heuristic', confidence:'medium'});
        } else {
          issues.push({id:uid(), rowId:r.id, projectId:r.projectId, componentId:r.componentId, languageCode:r.languageCode,
            type:'Терминология', severity: crossExamples.length ? 'Критическая' : 'Высокая',
            text:'Термин «'+term.term+'»: одобренный перевод «'+term.approved+'» не найден в переводе.'+crossNote,
            status:'Новая', createdAt:nowISO(), history:[{ts:nowISO(),action:'Обнаружена (проверка глоссария)'}],
            aiExplanation:null, aiSuggestion:null, aiConfidence:null, crossPlatformSuggestion: crossSuggestion,
            highlightField: srcHit?'source':null, highlightText: srcHit?srcHit.matched:null, expectedText: term.approved, matchType:'missing', confidence:'high'});
        }
      });
    });
    if(onProgress) onProgress(Math.min(start+CHUNK, rows.length), rows.length, 'glossary');
    if(start+CHUNK < rows.length) await yieldToUI();
  }
  dbSave('issues', issues);
}

/* =========================================================
   AI REVIEW (stage 2) — calls a Google Apps Script backend
   which holds the OpenAI API key server-side. See Settings → ИИ.
   ========================================================= */
const AI_SEVERITIES = ['Критическая','Высокая','Средняя','Низкая'];
const AI_TYPES = ['Смысл','Точность перевода','Терминология','Грамматика','Стиль','Пропуск','Добавление','Согласованность'];
function collectGlossaryForRow(row){
  const glossaryIds = dbQuery('glossaries', g=>!g.projectId || g.projectId===row.projectId).map(g=>g.id);
  return dbQuery('glossaryTerms', t=>glossaryIds.includes(t.glossaryId) && (!t.language || t.language.toLowerCase()===row.languageCode.toLowerCase()))
    .map(t=>({term:t.term, approved:t.approved}));
}
async function callAiEndpoint(items){
  const s = getSettings();
  if(!s.aiEndpointUrl) throw new Error('В Настройках не указан адрес backend (Apps Script Web App URL)');
  const res = await fetch(s.aiEndpointUrl, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'}, // text/plain avoids a CORS preflight that Apps Script doesn't handle
    body: JSON.stringify({model: s.aiModel || '', token: s.aiToken || '', items})
  });
  if(!res.ok) throw new Error('Backend ответил с ошибкой: HTTP ' + res.status);
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  return data.results || [];
}
async function runAIReviewForRows(rowIds){
  const s = getSettings();
  if(!s.aiEnabled){ toast('ИИ-проверка выключена — включи её в Настройках'); return; }
  if(!s.aiEndpointUrl){ toast('Сначала укажи адрес backend в Настройках → ИИ'); return; }
  const rows = rowIds.map(id=>dbGet('rows', id)).filter(Boolean);
  if(!rows.length){ toast('Нет строк для проверки'); return; }
  const batchSize = s.aiBatchSize || 15;
  let created = 0, checked = 0, failed = 0;
  toast('Запускаю ИИ-проверку: '+rows.length+' строк…');
  for(let i=0;i<rows.length;i+=batchSize){
    const batch = rows.slice(i, i+batchSize);
    const items = batch.map(r=>{
      const comp = dbGet('components', r.componentId);
      return {id:r.id, source:r.source, target:r.target, language:r.languageCode, component:comp?comp.name:'', context:r.key||'', glossary:collectGlossaryForRow(r)};
    });
    try{
      const results = await callAiEndpoint(items);
      const issuesArr = dbList('issues');
      results.forEach(res=>{
        checked++;
        if(res.error){ failed++; return; }
        if(!res.has_issue) return;
        const r = batch.find(b=>b.id===res.id);
        if(!r) return;
        const severity = AI_SEVERITIES.includes(res.severity) ? res.severity : 'Средняя';
        const type = AI_TYPES.includes(res.type) ? res.type : 'Смысл';
        issuesArr.push({
          id:uid(), rowId:r.id, projectId:r.projectId, componentId:r.componentId, languageCode:r.languageCode,
          type, severity, text: res.explanation || 'Найдена смысловая проблема',
          status:'Новая', createdAt:nowISO(), history:[{ts:nowISO(), action:'Обнаружена (проверка ИИ)'}],
          aiExplanation: res.explanation || null, aiSuggestion: res.suggestion || null,
          aiConfidence: typeof res.confidence==='number' ? res.confidence : null
        });
        created++;
      });
      dbSave('issues', issuesArr);
    }catch(err){
      failed += batch.length;
      toast('Ошибка ИИ-проверки: ' + err.message);
      console.error(err);
      break;
    }
  }
  toast('ИИ-проверка завершена: проверено '+checked+', новых проблем '+created+(failed?', ошибок '+failed:''));
  router();
}
async function bulkRunAI(key){
  const ids = getSelectedIssueIds(key);
  if(!ids.length){ toast('Выбери хотя бы одну проблему'); return; }
  const rowIds = [...new Set(ids.map(id=>dbGet('issues', id)?.rowId).filter(Boolean))];
  await runAIReviewForRows(rowIds);
}

// UI theme is a per-browser display preference, not app data, so it's kept outside the
// IndexedDB-backed store (localStorage is fine here and doesn't touch the real data layer).
// with a click event: the new theme spreads as a circle from the button (View Transitions)
function setTheme(mode, ev){
  const cur = document.documentElement.getAttribute('data-theme');
  if(ev && cur && cur!==mode && document.startViewTransition && !reduceMotion()){
    const x = ev.clientX, y = ev.clientY, r = Math.hypot(Math.max(x, innerWidth-x), Math.max(y, innerHeight-y));
    document.documentElement.classList.add('theme-vt');
    const vt = document.startViewTransition(()=>setTheme(mode));
    vt.ready.then(()=>document.documentElement.animate({clipPath:[`circle(0px at ${x}px ${y}px)`, `circle(${r}px at ${x}px ${y}px)`]}, {duration:520, easing:'cubic-bezier(.2,.8,.3,1)', pseudoElement:'::view-transition-new(root)'}));
    vt.finished.finally(()=>document.documentElement.classList.remove('theme-vt'));
    return;
  }
  document.documentElement.setAttribute('data-theme', mode);
  try{ localStorage.setItem('lqa_theme', mode); }catch(e){}
  document.querySelectorAll('#themeToggle button').forEach(b=>b.classList.toggle('active', b.dataset.mode===mode));
}
function initTheme(){
  let mode = 'light';
  try{ mode = localStorage.getItem('lqa_theme') || 'light'; }catch(e){}
  setTheme(mode);
}
function renderSidebar(){
  const h = location.hash || '#/';
  const openIssueCount = dbList('issues').filter(i=>i.status==='Новая'||i.status==='На проверке').length;
  const groups = {};
  NAV.forEach(n=>{ (groups[n.group] = groups[n.group]||[]).push(n); });
  let html = '';
  Object.keys(groups).forEach(g=>{
    html += `<div class="side-group-label">${esc(g)}</div>`;
    groups[g].forEach(n=>{
      const active = h===n.route || (n.route!=='#/' && h.startsWith(n.route));
      const myCount = n.route==='#/my' ? myTaskCount() : 0;
      const badge = (n.route==='#/issues' && openIssueCount) ? `<span class="side-badge-count">${openIssueCount}</span>` : myCount ? `<span class="side-badge-count me">${myCount}</span>` : '';
      html += `<a class="side-link ${active?'active':''}" href="${n.route}"><span class="ic">${icon(n.icon)}</span><span class="lbl">${n.label}</span>${badge}</a>`;
    });
  });
  document.getElementById('sideNav').innerHTML = html;
}
function setCrumbs(parts){
  document.getElementById('crumbs').innerHTML = parts.map((p,i)=>{
    const isLast = i===parts.length-1;
    const label = typeof p === 'string' ? p : p.label;
    const hash = typeof p === 'string' ? null : p.hash;
    if(isLast) return '<b>'+esc(label)+'</b>';
    if(hash) return '<a href="'+hash+'">'+esc(label)+'</a>';
    return esc(label);
  }).join('<span class="sep">/</span>');
}

function toggleNav(open){
  document.body.classList.toggle('nav-open', open===undefined ? !document.body.classList.contains('nav-open') : !!open);
}

function router(){
  renderSidebar();
  const hash = location.hash || '#/';
  const parts = hash.replace(/^#\//,'').split('/').filter(Boolean);
  const content = document.getElementById('content');
  try{
    if(parts.length===0) return renderDashboard(content);
    if(parts[0]==='projects' && parts.length===1) return renderProjectsList(content);
    if(parts[0]==='project' && parts[1] && parts[2]==='folder' && parts[3]) return renderFolderDetail(content, parts[1], parts[3], parts[4]||'overview');
    if(parts[0]==='project' && parts[1]) return renderProjectDetail(content, parts[1], parts[2]||'overview', parts[3]);
    if(parts[0]==='issues') return renderIssuesPage(content);
    if(parts[0]==='my') return renderMyTasks(content);
    if(parts[0]==='visual' && parts[1]) return renderVisualSession(content, parts[1]);
    if(parts[0]==='visual') return renderVisualList(content);
    if(parts[0]==='review-queue') return renderReviewQueue(content);
    if(parts[0]==='runs') return renderRunsPage(content);
    if(parts[0]==='glossaries' && parts.length===1) return renderGlossariesList(content);
    if(parts[0]==='glossary' && parts[1]) return renderGlossaryDetail(content, parts[1]);
    if(parts[0]==='analytics') return renderAnalytics(content);
    if(parts[0]==='export') return renderExportPage(content);
    if(parts[0]==='settings') return renderSettingsPage(content);
    setCrumbs(['Страница не найдена']);
    content.innerHTML = emptyState({img:IMG.ERROR_ILL, title:'Страница не найдена', text:'Такой страницы нет — возможно, ссылка устарела.', action:'<a class="btn secondary" href="#/">На главную</a>'});
  }catch(err){
    content.innerHTML = emptyState({img:IMG.ERROR_ILL, title:'Не получилось показать страницу', text:esc(err.message), action:'<button class="btn secondary" onclick="router()">Попробовать ещё раз</button>'});
    console.error(err);
  }
}

function donutChart(dataObj, colorMap, size){
  size = size || 132;
  const entries = Object.entries(dataObj).filter(([,v])=>v>0);
  const total = entries.reduce((s,[,v])=>s+v,0);
  if(!total) return '<div class="empty" style="padding:28px 0;font-size:13px;">Пока нет данных</div>';
  let acc = 0;
  const stops = entries.map(([k,v])=>{
    const start = acc/total*360; acc += v; const end = acc/total*360;
    return `${colorMap[k]||'var(--primary)'} ${start}deg ${end}deg`;
  }).join(', ');
  const legend = entries.map(([k,v])=>`<div class="row" style="gap:8px;font-size:13px;margin-bottom:6px;flex-wrap:nowrap;"><span style="width:8px;height:8px;border-radius:50%;background:${colorMap[k]||'var(--primary)'};flex-shrink:0;"></span><span style="color:var(--text-soft);flex:1;">${esc(k)}</span><b style="font-weight:600;font-variant-numeric:tabular-nums;">${v}</b></div>`).join('');
  return `<div class="row" style="gap:24px;flex-wrap:nowrap;">
    <div style="position:relative;width:${size}px;height:${size}px;border-radius:50%;background:conic-gradient(${stops});flex-shrink:0;">
      <div style="position:absolute;inset:18px;border-radius:50%;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;"><b style="font-size:22px;font-weight:700;line-height:1;">${total}</b><span style="font-size:12px;color:var(--text-faint);margin-top:2px;">всего</span></div>
    </div>
    <div style="flex:1;min-width:0;">${legend}</div>
  </div>`;
}
function weeklyTrendBars(issues){
  const days = [];
  for(let i=6;i>=0;i--){ const d = new Date(); d.setDate(d.getDate()-i); days.push(d); }
  const counts = days.map(d=>{
    const key = d.toDateString();
    return issues.filter(i=>new Date(i.createdAt).toDateString()===key).length;
  });
  const max = Math.max(1, ...counts);
  return `<div class="row" style="align-items:flex-end;gap:8px;height:132px;flex-wrap:nowrap;">
    ${days.map((d,i)=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;">
      <div style="font-size:12px;color:var(--text-soft);font-variant-numeric:tabular-nums;">${counts[i]||''}</div>
      <div style="width:100%;max-width:28px;height:${Math.max(4,counts[i]/max*80)}px;background:${counts[i]?'var(--brand-grad)':'var(--bg-2)'};border-radius:6px;"></div>
      <div style="font-size:12px;color:var(--text-faint);">${d.toLocaleDateString('ru-RU',{weekday:'short'})}</div>
    </div>`).join('')}
  </div>`;
}
function ringSvg(pct, size, stroke, color){
  size = size||56; stroke = stroke||6;
  const r = (size-stroke)/2, c = 2*Math.PI*r, off = c*(1-Math.max(0,Math.min(1,pct)));
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--ring-track)" stroke-width="${stroke}"/><circle class="ring-val" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}" style="--c:${c.toFixed(2)}" transform="rotate(-90 ${size/2} ${size/2})"/></svg>`;
}

// per-language quality: share of that language's strings with no open problem
function languageStats(){
  const rows = dbList('rows'), issues = dbList('issues');
  const by = {};
  const get = code => by[code] = by[code] || {code, rows:0, rowsWithOpen:new Set(), open:0, crit:0, high:0, med:0, low:0, resolved:0, week:[0,0,0,0,0,0,0], visual:0};
  rows.forEach(r=>{ if(r.languageCode) get(r.languageCode).rows++; });
  const days = []; for(let d=6; d>=0; d--){ const x = new Date(); x.setDate(x.getDate()-d); days.push(x.toDateString()); }
  issues.forEach(i=>{
    if(!i.languageCode) return;
    const st = get(i.languageCode);
    const di = days.indexOf(new Date(i.createdAt).toDateString()); if(di>=0) st.week[di]++;
    if(i.visual) st.visual++;
    if(isOpenIssue(i)){
      st.open++; if(i.rowId) st.rowsWithOpen.add(i.rowId);
      if(i.severity==='Критическая') st.crit++; else if(i.severity==='Высокая') st.high++; else if(i.severity==='Средняя') st.med++; else st.low++;
    } else st.resolved++;
  });
  const runsByLang = {};
  dbList('runs').filter(r=>typeof r.quality==='number').sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt)).forEach(r=>{ (runsByLang[r.languageCode] = runsByLang[r.languageCode]||[]).push(r.quality); });
  return Object.values(by).map(st=>{ const q = runsByLang[st.code]||[]; return Object.assign(st, {quality: st.rows ? 1 - st.rowsWithOpen.size/st.rows : (st.open?0:1), trend: q.length>1 ? q[q.length-1]-q[q.length-2] : null}); })
    .sort((a,b)=> b.crit-a.crit || b.open-a.open || b.rows-a.rows);
}

function plural(n, one, few, many){
  const m10 = n%10, m100 = n%100;
  if(m10===1 && m100!==11) return one;
  if(m10>=2 && m10<=4 && (m100<10 || m100>=20)) return few;
  return many;
}

async function deleteProject(id){
  const p = dbGet('projects', id);
  if(!await uiConfirm({title:'Удалить проект «'+(p?p.name:'')+'»?', text:'Удалятся папки, строки, проблемы, история проверок и скриншоты проекта. Сразу после удаления можно нажать «Отменить».', okText:'Удалить проект'})) return;
  const snap = snapshotTables(['projects','components','rows','issues','files','runs','glossaries','visualSessions','visualShots','visualShotImages']);
  dbSave('components', dbList('components').filter(c=>c.projectId!==id));
  dbSave('rows', dbList('rows').filter(r=>r.projectId!==id));
  dbSave('issues', dbList('issues').filter(i=>i.projectId!==id));
  dbSave('files', dbList('files').filter(f=>f.projectId!==id));
  dbSave('runs', dbList('runs').filter(r=>r.projectId!==id));
  dbSave('glossaries', dbList('glossaries').filter(g=>g.projectId!==id));
  const sessIds = new Set(dbQuery('visualSessions', v=>v.projectId===id).map(v=>v.id));
  const shotIds = new Set(dbQuery('visualShots', v=>sessIds.has(v.sessionId)).map(v=>v.id));
  dbSave('visualShotImages', dbList('visualShotImages').filter(x=>!shotIds.has(x.id)));
  dbSave('visualShots', dbList('visualShots').filter(x=>!sessIds.has(x.sessionId)));
  dbSave('visualSessions', dbList('visualSessions').filter(x=>!sessIds.has(x.id)));
  dbRemove('projects', id);
  toastUndo('Проект удалён', snap, ()=>{ location.hash = '#/project/'+id; router(); });
  location.hash = '#/projects';
}

// Small real trend line for a KPI card — counts real issues per day over the last 7
// days (not a fabricated percentage), so it never claims a number that isn't backed by data.
function last7DayCounts(items, tsField){
  const days = [];
  for(let i=6;i>=0;i--){ const d = new Date(); d.setDate(d.getDate()-i); days.push(d.toDateString()); }
  return days.map(ds => items.filter(x=>new Date(x[tsField]).toDateString()===ds).length);
}
function miniSparkline(counts, color){
  const max = Math.max(1, ...counts);
  const w = 64, h = 22;
  const step = counts.length>1 ? w/(counts.length-1) : 0;
  const points = counts.map((c,i)=>`${(i*step).toFixed(1)},${(h-2-(c/max*(h-4))).toFixed(1)}`).join(' ');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block;overflow:visible;"><polyline points="${points}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".75"/></svg>`;
}
function timeAgo(ts){
  if(!ts) return '';
  const diff = Date.now()-ts;
  const min = Math.floor(diff/60000);
  if(min<1) return 'только что';
  if(min<60) return min+' мин назад';
  const hr = Math.floor(min/60);
  if(hr<24) return hr+' ч назад';
  const days = Math.floor(hr/24);
  if(days<30) return days+' дн назад';
  return fmtDate(new Date(ts).toISOString());
}

/* ---------- folder tree ----------
   Folders (components) may sit inside another folder via parentId. Everything that counts rows or
   problems "for a folder" can include its subfolders through compDescendants(). */
function compChildren(id){ return dbList('components').filter(c=>c.parentId===id).sort((a,b)=>a.name.localeCompare(b.name,'ru')); }
function compDescendants(id){
  const out = new Set(), stack = [id];
  const byParent = {}; dbList('components').forEach(c=>{ if(c.parentId) (byParent[c.parentId] = byParent[c.parentId]||[]).push(c.id); });
  while(stack.length){ const cur = stack.pop(); (byParent[cur]||[]).forEach(ch=>{ if(!out.has(ch)){ out.add(ch); stack.push(ch); } }); }
  return out;
}
function compWithDescendants(id){ const s = compDescendants(id); s.add(id); return s; }
function compAncestors(c){ const out = []; let cur = c, guard = 0; while(cur && cur.parentId && guard++<20){ cur = dbGet('components', cur.parentId); if(cur) out.unshift(cur); } return out; }
function compPath(c){ return c ? compAncestors(c).map(a=>a.name).concat([c.name]).join(' / ') : ''; }
// depth-first list for selects and trees
function componentTree(projectId){
  const all = dbList('components').filter(c=>c.projectId===projectId);
  const ids = new Set(all.map(c=>c.id));
  const out = [];
  const walk = (parent, depth)=>all.filter(c=>(c.parentId||null)===parent || (!parent && c.parentId && !ids.has(c.parentId)))
    .filter(c=>parent ? true : !c.parentId || !ids.has(c.parentId))
    .sort((a,b)=>a.name.localeCompare(b.name,'ru')).forEach(c=>{ if(out.includes(c)) return; out.push(c); c._depth = depth; walk(c.id, depth+1); });
  walk(null, 0);
  return out;
}
function componentOptionsHtml(projectId, selected, withNone){
  return (withNone?`<option value="">— в корне проекта —</option>`:'') + componentTree(projectId).map(c=>`<option value="${c.id}" ${c.id===selected?'selected':''}>${'   '.repeat(c._depth)}${c._depth?'└ ':''}${esc(c.name)}</option>`).join('');
}

function folderCounts(id){
  const set = compWithDescendants(id);
  let rows = 0, issues = 0, open = 0;
  dbList('rows').forEach(r=>{ if(set.has(r.componentId)) rows++; });
  dbList('issues').forEach(i=>{ if(set.has(i.componentId)){ issues++; if(isOpenIssue(i)) open++; } });
  return {rows, issues, open};
}

async function deleteFile(fileId){

  const rowIds = new Set(dbList('rows').filter(r=>r.fileId===fileId).map(r=>r.id));
  const nIssues = dbList('issues').filter(i=>rowIds.has(i.rowId) && !i.visual).length;

function inferLanguageFromFilename(filename, languages){
  const lower = filename.toLowerCase();
  const sorted = [...(languages||[])].sort((a,b)=>b.code.length-a.code.length); // longer codes first (en-shtat before en)
  for(const l of sorted){
    const code = l.code.toLowerCase();
    const re = new RegExp('(^|[^a-z0-9])'+code.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'($|[^a-z0-9])', 'i');
    if(re.test(lower)) return l.code;
  }
  return '';
}
async function extractPoFilesFromZip(file){
  const ok = await ensureJSZip();
  if(!ok) throw new Error('JSZip не загрузился — проверь интернет/сеть');
  const buf = await file.arrayBuffer();
  const zip = await JSZip.loadAsync(buf);
  const entries = [];
  for(const path of Object.keys(zip.files)){
    const entry = zip.files[path];
    if(entry.dir || !/\.po$/i.test(path)) continue;
    const content = await entry.async('string');
    entries.push({name: path.split('/').pop(), content, fullPath: path});
  }
  return entries;
}
// Guesses which project folder (component) a zip entry belongs to, so a zip that bundles
// several platforms/sections (e.g. a Weblate export with one subfolder per component) can
// be split automatically instead of dumping everything into one folder.
//   1. the entry's own subfolder inside the zip, if it matches an existing component name
//   2. an existing component's name found as a substring of the filename
//   3. otherwise: the subfolder name as a suggested NEW component (still needs confirming),
//      or nothing
function inferComponentFromPath(fullPath, filename, components){
  const parts = fullPath.split('/').filter(Boolean);
  if(parts.length > 1){
    const folderName = parts[parts.length-2];
    const match = components.find(c=>c.name.toLowerCase()===folderName.toLowerCase());
    return match ? {componentId: match.id, newName: null} : {componentId: null, newName: folderName};
  }
  const lower = filename.toLowerCase();
  const sorted = [...components].sort((a,b)=>b.name.length-a.name.length); // longest first: wb-web-astro before wb-web
  for(const c of sorted){ if(lower.includes(c.name.toLowerCase())) return {componentId: c.id, newName: null}; }
  return {componentId: null, newName: null};
}

async function handleFolderPoFiles(projectId, componentId, items){
  const uploadedBy = document.getElementById('folderUploadManager') ? document.getElementById('folderUploadManager').value : '';
  const checkOverride = document.getElementById('folderChkUntranslated') ? readCheckSettingsOverride('folderChk') : null;
  if(!items.length){ toast('Выбери .po файл'); return; }
  const status = document.getElementById('folderUploadStatus');
  let allNewRowIds = [];
  const byLanguage = {}; // for a per-language run summary when a zip mixes several languages
  const undoSnap = snapshotTables(['rows','issues','files','runs']);
  const versionPairs = [];
  for(const item of items){
    status.textContent = 'Разбираю ' + item.name + '…';
    const text = typeof item.source === 'string' ? item.source : await item.source.text();
    const languageCode = item.languageCode;
    let entries;
    try{ entries = parseTranslationFile(item.name, text); }
    catch(err){ toast('Не удалось прочитать «'+item.name+'»: '+err.message); continue; }
    const fileRec = {id:uid(), projectId, componentId, languageCode, filename:item.name, uploadedAt:nowISO(), rowCount:entries.length, uploadedBy};
    const prevVersion = previousVersionOf(projectId, componentId, languageCode, item.name);
    if(prevVersion){ fileRec.previousVersionId = prevVersion.id; versionPairs.push({prev:prevVersion, next:fileRec}); }
    dbUpsert('files', fileRec);
    const rowsArr = dbList('rows');
    const newIdsForThisFile = [];
    entries.forEach(en=>{
      const row = {id:uid(), projectId, componentId, languageCode, fileId:fileRec.id, key:en.key, source:en.source, target:en.target};
      if(en.targetForms){ row.sourcePlural = en.sourcePlural; row.targetForms = en.targetForms; if(en.nplurals) row.nplurals = en.nplurals; }
      rowsArr.push(row);
      allNewRowIds.push(row.id);
      newIdsForThisFile.push(row.id);
    });
    dbSave('rows', rowsArr);
    (byLanguage[languageCode] = byLanguage[languageCode]||[]).push(...newIdsForThisFile);
    toast('Файл «'+item.name+'» успешно загружен');
  }
  status.textContent = 'Запускаю проверку…';
  await runFullCheckForProject(projectId, allNewRowIds, checkOverride, (done,total,stage)=>{
    status.textContent = (stage==='tech' ? 'Техническая проверка: ' : 'Проверка глоссария: ') + done + ' / ' + total;
  });
  const diffs = reconcileVersions(versionPairs);
  Object.entries(byLanguage).forEach(([languageCode, rowIds])=>{
    const idSet = new Set(rowIds);
    const issues = dbQuery('issues', i=>idSet.has(i.rowId));
    const d = diffs[componentId+'|'+languageCode];
    dbUpsert('runs', {id:uid(), projectId, componentId, languageCode, fileId:null, rowCount:rowIds.length, issueCount:issues.length, quality:rowsQuality(rowIds), versionDiff:d||null, createdAt:nowISO(), runBy:uploadedBy});
    if(d) toast('Новая версия ('+languageCode+'): '+versionSummaryText(d), {duration:9000});
  });
  if(versionPairs.length) toast('Прежние версии файлов заменены новыми', {duration:9000, action:{label:'Отменить', fn:()=>{ restoreSnapshot(undoSnap); toast('Загрузка отменена'); router(); }}});
  const allIssues = dbQuery('issues', i=>allNewRowIds.includes(i.rowId));
  toast('Проверка завершена');
  if(allIssues.some(i=>i.severity==='Критическая')) toast('Найдены критические проблемы');
  status.textContent = '';
  presetStringsTypeFilterFromOverride('folderStringsRoot', checkOverride);
  location.hash = '#/project/'+projectId+'/folder/'+componentId+'/strings';
}

  Object.values(byGroup).forEach(({componentId, languageCode, rowIds})=>{
    const idSet = new Set(rowIds);
    const issues = dbQuery('issues', i=>idSet.has(i.rowId));
    const d = diffs[componentId+'|'+languageCode];
    dbUpsert('runs', {id:uid(), projectId, componentId, languageCode, fileId:null, rowCount:rowIds.length, issueCount:issues.length, quality:rowsQuality(rowIds), versionDiff:d||null, createdAt:nowISO(), runBy:uploadedBy});

  const allIssues = dbQuery('issues', i=>allNewRowIds.includes(i.rowId));
  toast('Проверка завершена');
  if(allIssues.some(i=>i.severity==='Критическая')) toast('Найдены критические проблемы');
  status.textContent = '';
  presetStringsTypeFilterFromOverride('projTabStrings', checkOverride);
  location.hash = '#/project/'+projectId+'/content/strings';
}

/* ---------- string history ----------
   rows keep targetHistory: [{ts, how:'upload'|'fix', from, to, file, by, comment}] — every change of the
   translation between file versions and every fix made in the platform. */
const ROW_HISTORY_MAX = 30;
function wordDiffHtml(a, b){
  a = a||''; b = b||'';
  const A = a.split(/(\s+)/).filter(x=>x!==''), B = b.split(/(\s+)/).filter(x=>x!=='');
  if(A.length*B.length > 250000) return `<del>${esc(a)}</del> <ins>${esc(b)}</ins>`;
  const n = A.length, m = B.length, L = Array.from({length:n+1},()=>new Uint16Array(m+1));
  for(let x=n-1;x>=0;x--) for(let y=m-1;y>=0;y--) L[x][y] = A[x]===B[y] ? L[x+1][y+1]+1 : Math.max(L[x+1][y], L[x][y+1]);
  const out = []; let x = 0, y = 0;
  const add = (k,t)=>{ const last = out[out.length-1]; if(last && last[0]===k) last[1]+=t; else out.push([k,t]); };
  while(x<n && y<m){ if(A[x]===B[y]){ add('=',A[x]); x++; y++; } else if(L[x+1][y]>=L[x][y+1]) add('-',A[x++]); else add('+',B[y++]); }
  while(x<n) add('-',A[x++]); while(y<m) add('+',B[y++]);
  return out.map(([k,t])=>k==='=' ? esc(t) : k==='-' ? `<del>${esc(t)}</del>` : `<ins>${esc(t)}</ins>`).join('');
}
function rowHistoryHtml(r){
