function toggleMselPanel(key, field){
  const st = issuesPageState[key];
  st.openPanel = (st.openPanel===field) ? null : field;
  rerenderIssuesOrRows(key, issuesFixedFilters[key]);
  if(st.openPanel){
    setTimeout(()=>{
      const panel = document.getElementById(key+'_'+field+'_panel');
      const btn = document.getElementById(key+'_'+field+'_btn');
      if(!panel || !btn) return;
      const btnRect = btn.getBoundingClientRect();
      const panelW = panel.offsetWidth, panelH = panel.offsetHeight;
      let left = btnRect.left;
      left = Math.min(left, window.innerWidth - panelW - 8);
      left = Math.max(8, left);
      let top = btnRect.bottom + 4;
      if(top + panelH > window.innerHeight - 8) top = Math.max(8, btnRect.top - panelH - 4); // flip above if no room below
      panel.style.left = left + 'px';
      panel.style.top = top + 'px';
    }, 0);
  }
}

function getSelectedIssueIds(key){

// works from both the row-grouped "Строки" table (selection is already row ids) and the
// issue-grouped tables like "Все проблемы" (selection is issue ids — resolved to their rows)
function getSelectedRowIds(key){
  const st = issuesPageState[key];
  if(!st) return [];
  if(st.mode==='rows') return [...st.selected];
  return [...new Set([...st.selected].map(id=>dbGet('issues', id)?.rowId).filter(Boolean))];

function escapePoString(str){
  // our own po parser only unescapes \" -> " on import (leaves \n, \t etc. as literal
  // 2-char sequences, since that's already correct .po syntax) — so on export we must
  // only escape real quote/newline/tab characters, and must NOT touch existing
  // backslashes, or a round-tripped "\n" would corrupt into "\\n".
  return String(str==null?'':str).replace(/"/g,'\\"').replace(/\r?\n/g,'\\n').replace(/\t/g,'\\t');
}
function generatePoFromRows(rows){
  let out = 'msgid ""\nmsgstr ""\n"Content-Type: text/plain; charset=UTF-8\\n"\n\n';
  rows.forEach(r=>{
    if(r.key) out += 'msgctxt "'+escapePoString(r.key)+'"\n';
    out += 'msgid "'+escapePoString(r.source)+'"\n';
    out += 'msgstr "'+escapePoString(r.target)+'"\n\n';
  });
  return out;
}
function downloadPoFile(text, filename){
  const blob = new Blob([text], {type:'text/plain;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}
function bulkExportPo(key){
  const rowIds = getSelectedRowIds(key);
  if(!rowIds.length){ toast('Выбери хотя бы одну строку'); return; }
  const rows = rowIds.map(id=>dbGet('rows', id)).filter(Boolean);
  const langs = [...new Set(rows.map(r=>r.languageCode))];
  const filename = 'export_'+(langs.length===1?langs[0]:'multi')+'_'+rows.length+'.po';
  downloadPoFile(generatePoFromRows(rows), filename);
  toast('Экспортировано в .po: '+rows.length+' строк');
}

/* ---- deadlines ---- */
function formatDeadline(d){
  if(!d) return '<span class="hint">—</span>';
  if(d.type==='asap') return '<span class="pill sev-high">как можно скорее</span>';
  if(d.type==='date' && d.date){
    const overdue = new Date(d.date) < new Date(new Date().toDateString());
    return `<span class="pill ${overdue?'sev-critical':'type'}">${overdue?'просрочено ':''}${new Date(d.date).toLocaleDateString('ru-RU')}</span>`;
  }
  return '<span class="hint">—</span>';
}
function toggleDeadlineDateVisibility(selectId, dateId){

  if(!sel || !dateEl) return;

}
function saveIssueDeadline(issueId){

  const date = document.getElementById('issueDeadlineDate').value;
  const i = dbGet('issues', issueId);
  i.deadline = type==='date' ? (date ? {type:'date', date} : null) : (type==='asap' ? {type:'asap'} : null);
  dbUpsert('issues', i);
  toast('Дедлайн сохранён');

function detectionSourceLabel(issue){
  const first = (issue.history||[])[0];
  if(!first || !first.action) return 'Ручная проверка';
  const a = first.action;
  if(a.includes('техническая проверка')) return 'Техническая проверка';
  if(a.includes('глоссария')) return 'Глоссарий';
  if(a.includes('согласованности')) return 'Проверка согласованности';
  if(a.includes('по скриншоту')) return 'AI по скриншоту';
  if(a.includes('визуальная')) return 'Визуальная проверка';
  if(a.includes('ИИ')) return 'AI-проверка';
  return 'Ручная проверка';
}

function addIssueNote(issueId){
  const el = document.getElementById('issueNoteInput');
  const val = el ? el.value.trim() : '';
  if(!val){ toast('Введи текст заметки'); return; }
  const i = dbGet('issues', issueId);
  i.history.push({ts:nowISO(), action:'Заметка', comment:val});
  dbUpsert('issues', i);
  toast('Заметка добавлена');
  openIssueDetail(issueId);
}
function renderDecisionButtons(issueId){
  return `<button class="btn secondary" onclick="decideIssue('${issueId}','Подтвердить')">Подтвердить</button>
    <button class="btn secondary" onclick="decideIssue('${issueId}','Опровергнуть')">Опровергнуть</button>
    ${dbGet('issues', issueId)?.rowId ? `<button class="btn secondary" onclick="openFixModal('${issueId}')">Исправить</button>` : ''}
    <button class="btn secondary" onclick="decideIssue('${issueId}','Ложное срабатывание')">Ложное срабатывание</button>`;
}
function decideIssue(issueId, action){
  const i = dbGet('issues', issueId);
  const map = {'Подтвердить':'Принята','Опровергнуть':'Отклонена','Ложное срабатывание':'Ложное срабатывание'};
  const reviewerEl = document.getElementById('reviewerNameInput');
  const reviewer = reviewerEl ? reviewerEl.value.trim() : '';
  i.status = map[action];
  if(reviewer) i.assignedTo = reviewer;
  i.history.push({ts:nowISO(), action, reviewer: reviewer||null});
  dbUpsert('issues', i);
  toast('Решение сохранено: '+i.status);
  closeDetailPanel(); router();
}
function openFixModal(issueId){
  const i = dbGet('issues', issueId); const r = dbGet('rows', i.rowId);
  if(!r){ toast('Проблема не связана со строкой из файлов — исправлять нечего'); return; }
  const reviewerEl = document.getElementById('reviewerNameInput');
  const reviewer = reviewerEl ? reviewerEl.value.trim() : (i.assignedTo||'');
  openModal(`<h3>Исправить перевод</h3>
    <div class="hint">Было: «${esc(r.target)}»</div>
    <label class="field" style="margin-top:10px;">Новый перевод<textarea id="fixTarget" style="min-height:60px;">${esc(r.target)}</textarea></label>
    ${i.crossPlatformSuggestion ? `<button type="button" class="btn secondary sm" style="margin-top:6px;" data-suggestion="${esc(i.crossPlatformSuggestion)}" onclick="document.getElementById('fixTarget').value=this.dataset.suggestion">Вставить вариант из другой папки: «${esc(i.crossPlatformSuggestion)}»</button>` : ''}
    <label class="field" style="margin-top:10px;">Кто исправил (редактор)<select id="fixReviewer">${editorSelectOptions(reviewer, editorsForLanguage(i.languageCode))}</select></label>
    <label class="field" style="margin-top:10px;">Комментарий<textarea id="fixComment" style="min-height:50px;"></textarea></label>
    <div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Отмена</button><button class="btn" onclick="applyFix('${issueId}')">Сохранить</button></div>`);
}
function applyFix(issueId){
  const i = dbGet('issues', issueId); const r = dbGet('rows', i.rowId);
  const oldTarget = r.target;
  const newTarget = document.getElementById('fixTarget').value;
  const comment = document.getElementById('fixComment').value.trim();
  const reviewer = document.getElementById('fixReviewer').value.trim();
  r.target = newTarget; dbUpsert('rows', r);
  i.status = 'Принята после исправления';
  if(reviewer) i.assignedTo = reviewer;
  i.history.push({ts:nowISO(), action:'Исправлено', comment, oldTarget, newTarget, reviewer: reviewer||null});
  dbUpsert('issues', i);
  toast('Исправление сохранено');
  closeModal(); closeDetailPanel(); router();
}

function languageSelectOptionsGrouped(selectedCode){
  return LANGUAGE_GROUPS.map(g=>`<optgroup label="${esc(g.label)}">${g.items.map(([c,n])=>`<option value="${c}" ${c===selectedCode?'selected':''}>${esc(n)} (${c})</option>`).join('')}</optgroup>`).join('');
}
function languageLabel(code){
  if(!code) return '';
  const preset = LANGUAGE_PRESETS.find(([c])=>c===code);
  return preset ? preset[1] : code;
}
const LANGUAGE_FLAGS = {
  az:'🇦🇿', en:'🇬🇧', am:'🇪🇹', hy:'🇦🇲', ka:'🇬🇪', kk:'🇰🇿', zh:'🇨🇳', ky:'🇰🇬',
  ru:'🇷🇺', tg:'🇹🇯', uz:'🇺🇿', sw:'🇹🇿', be:'🇧🇾', he:'🇮🇱', ko:'🇰🇷', tr:'🇹🇷', ar:'🇸🇦', fr:'🇫🇷'
};
function languageFlag(code){
  if(!code) return '🌐';
  const base = code.replace(/-shtat$/,'');
  return LANGUAGE_FLAGS[base] || '🌐';
}
function renderGlossariesList(el){
  setCrumbs(['Глоссарии']);

  const groupKeys = Object.keys(groups).sort((a,b)=> a===''?1 : b===''?-1 : languageLabel(a).localeCompare(languageLabel(b)));
  el.innerHTML = `<div class="page-head"><div><h1 class="page-title">Глоссарии</h1><div class="page-sub">Термины и утверждённые переводы, по языкам</div></div><button class="btn" onclick="openGlossaryModal()">${icon('plus',16)}Новый глоссарий</button></div>

      <div class="grid grid-3">${groups[key].map(g=>{
        const proj = g.projectId ? dbGet('projects', g.projectId) : null;
        const termCount = dbQuery('glossaryTerms', t=>t.glossaryId===g.id).length;
        return `<div class="card clickable" style="margin:0;" onclick="location.hash='#/glossary/${g.id}'"><div class="row" style="gap:12px;flex-wrap:nowrap;align-items:flex-start;"><span class="es-ic" style="width:36px;height:36px;border-radius:10px;background:var(--primary-bg);color:var(--primary);display:flex;align-items:center;justify-content:center;flex-shrink:0;">${icon('bookOpen',18)}</span><div style="min-width:0;"><h3 style="margin:0 0 2px;">${esc(g.name)}</h3><div class="hint" style="margin:0;">${proj?'Проект: '+esc(proj.name):'Общий, для всех проектов'} · ${termCount} ${plural(termCount,'термин','термина','терминов')}</div></div></div></div>`;
      }).join('')}</div>
    `).join('') : `<div class="card">${emptyState({img:IMG.LANGUAGES, title:'Глоссариев пока нет', text:'Создай глоссарий для конкретного языка — общий, на все проекты сразу, или привязанный к одному.', action:'<button class="btn" onclick="openGlossaryModal()">'+icon('plus',16)+'Новый глоссарий</button>'})}</div>`}`;

function toggleGlossaryModalMode(){
  const mode = document.getElementById('glMode').value;
  document.getElementById('glModeNewFields').style.display = mode==='new' ? 'block' : 'none';
  document.getElementById('glModeExistingFields').style.display = mode==='existing' ? 'block' : 'none';
}
function submitGlossaryModal(){
  const mode = document.getElementById('glMode').value;
  let glossaryId;
  if(mode==='existing'){
    glossaryId = document.getElementById('glExisting').value;
    if(!glossaryId){ toast('Выбери глоссарий для обновления'); return; }
  } else {
    const language = document.getElementById('glLang').value;
    let name = document.getElementById('glName').value.trim();
    const projectId = document.getElementById('glProject').value || null;
    if(!language){ toast('Выбери язык'); return; }
    if(!name) name = languageLabel(language);
    const rec = {id:uid(), name, language, projectId, createdAt:nowISO()};
    dbUpsert('glossaries', rec);
    glossaryId = rec.id;
  }
  const importMode = document.getElementById('glImportMode').value;
  const file = document.getElementById('glFile').files[0];
  const pasteText = document.getElementById('glPaste').value.trim();
  const goToGlossary = ()=>{ closeModal(); location.hash = '#/glossary/'+glossaryId; };

  if(file){
    importGlossaryFile(glossaryId, file, importMode, goToGlossary);
  } else if(pasteText){
    const lines = pasteText.split(/\r?\n/).filter(l=>l.trim());
    const delim = lines[0].includes('\t') ? '\t' : (lines[0].includes(';') && !lines[0].includes(',') ? ';' : ',');
    applyGlossaryImportRows(glossaryId, lines.map(l=>splitCsvLine(l, delim)), importMode);
    goToGlossary();
  } else {
    goToGlossary();
  }
}

function splitCsvLine(line, delim){
  if(delim!==','){ return line.split(delim).map(s=>s.trim()); }
  const res=[]; let cur='', q=false;
  for(let i=0;i<line.length;i++){ const c=line[i]; if(c==='"'){ if(q&&line[i+1]==='"'){cur+='"';i++;} else q=!q; } else if(c===','&&!q){res.push(cur);cur='';} else cur+=c; }
  res.push(cur); return res.map(s=>s.trim());
}
function findColumnIndex(header, candidates){
  const lower = header.map(h=>(h==null?'':String(h)).trim().toLowerCase());
  for(const c of candidates){ const idx = lower.indexOf(c); if(idx>=0) return idx; }
  return -1;
}
// alternate to .po for the upload dropzone: a CSV/TSV with key/source/target-style columns
// (header names auto-detected across common variants), falling back to columns 1/2/3 if no
// recognizable header is found
function parseCsvEntries(text){
  const lines = text.split(/\r?\n/).filter(l=>l.trim());
  if(!lines.length) return [];
  const delim = lines[0].includes('\t') ? '\t' : (lines[0].includes(';') && !lines[0].includes(',') ? ';' : ',');
  const rows = lines.map(l=>splitCsvLine(l, delim));
  const header = rows[0];
  const keyIdx = findColumnIndex(header, ['key','ключ','id','msgctxt','название','name']);
  const srcIdx = findColumnIndex(header, ['source','ru','original','исходный','msgid','русский','src']);
  const tgtIdx = findColumnIndex(header, ['target','translation','перевод','msgstr','tgt']);
  const hasHeader = srcIdx>=0 || tgtIdx>=0;
  const dataRows = hasHeader ? rows.slice(1) : rows;
  const kI = hasHeader ? keyIdx : 0;
  const sI = hasHeader ? (srcIdx>=0?srcIdx:1) : 1;
  const tI = hasHeader ? (tgtIdx>=0?tgtIdx:2) : 2;
  return dataRows.map((r,i)=>({
    key: kI>=0 ? (r[kI]||'') : ('row'+(i+1)),
    source: r[sI]||'',
    target: r[tI]||''
  })).filter(e=>e.source || e.target);
}
// alternate to .po for the upload dropzone: either an array of {key/source/target}-ish
// objects (field names auto-detected), or a flat "key": "translated string" locale map —
// the latter has no separate source, so checks that only look at the translation
// (spacing, punctuation, rebranding, glossary) still work; ones comparing to source won't
// find anything to flag, which is the best available given the format has no source text
function parseJsonEntries(text){
  let data;
  try{ data = JSON.parse(text); }catch(e){ throw new Error('Некорректный JSON: '+e.message); }
  if(Array.isArray(data)){
    return data.map((obj,i)=>{
      const lower = {}; Object.keys(obj||{}).forEach(k=>{ lower[k.toLowerCase()]=obj[k]; });
      const pick = (cands, fallback) => { for(const c of cands){ if(lower[c]!=null) return lower[c]; } return fallback; };
      return {
        key: String(pick(['key','id','msgctxt','ключ','name'], 'row'+(i+1))),
        source: String(pick(['source','ru','original','msgid','исходный','src'], '')),
        target: String(pick(['target','translation','msgstr','перевод','tgt','value'], ''))
      };
    }).filter(e=>e.source || e.target);
  }
  if(data && typeof data==='object'){
    return Object.keys(data).map(k=>({ key:k, source:'', target: data[k]==null?'':String(data[k]) }));
  }
  return [];
}
function applyGlossaryImportRows(glossaryId, rowsMatrix, mode){
  mode = mode || 'upsert';
  if(!rowsMatrix.length){ toast('Не удалось прочитать данные'); return; }
  let arr = dbList('glossaryTerms');
  if(mode==='replace') arr = arr.filter(t=>t.glossaryId!==glossaryId);
  let start = 0;
  const header = (rowsMatrix[0]||[]).map(c=>String(c||'').trim().toLowerCase());
  if(header[0]==='term' || header[0]==='термин') start=1;
  let added=0, updated=0;
  for(let i=start;i<rowsMatrix.length;i++){
    const cells = rowsMatrix[i].map(c=>String(c===undefined?'':c).trim());
    if(!cells[0]) continue;
    const term = cells[0], approved = cells[1]||'', forbidden = (cells[2]||'').split(';').map(s=>s.trim()).filter(Boolean);
    const existing = mode==='upsert' ? arr.find(t=>t.glossaryId===glossaryId && t.term.trim().toLowerCase()===term.trim().toLowerCase()) : null;
    if(existing){
      existing.approved = approved; existing.forbidden = forbidden;
      updated++;
    } else {
      arr.push({id:uid(), glossaryId, term, approved, forbidden, comment:'', status:'Активен'});
      added++;
    }
  }
  dbSave('glossaryTerms', arr);
  toast(mode==='replace' ? ('Термины заменены: '+added) : ('Добавлено новых: '+added+', обновлено: '+updated));
  router();
}
function importGlossaryFile(glossaryId, file, mode, onDone){
  if(!file) return;
  const name = file.name.toLowerCase();
  const finish = rowsMatrix => { applyGlossaryImportRows(glossaryId, rowsMatrix, mode); if(onDone) onDone(); };
  if(name.endsWith('.csv')||name.endsWith('.tsv')||name.endsWith('.txt')){
    const reader = new FileReader();
    reader.onload = e=>{
      const lines = e.target.result.split(/\r?\n/).filter(l=>l.trim());
      const delim = name.endsWith('.tsv') ? '\t' : (lines[0]&&lines[0].includes('\t')?'\t':(lines[0]&&lines[0].includes(';')&&!lines[0].includes(',')?';':','));
      finish(lines.map(l=>splitCsvLine(l, delim)));
    };
    reader.readAsText(file, 'UTF-8');
  } else {
    const glossary = dbGet('glossaries', glossaryId);
    const langCode = glossary ? glossary.language : '';
    const finishXlsx = matrix => finish(remapSmartcatMatrix(matrix, langCode) || matrix);
    ensureXlsx().then(xlsxOk=>{
      const reader = new FileReader();
      reader.onload = async e=>{
        const buf = e.target.result;
        if(xlsxOk){
          try{
            const wb = XLSX.read(new Uint8Array(buf), {type:'array'});
            finishXlsx(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, defval:''}));
            return;
          }catch(err1){ /* fall through to the JSZip-based reader below */ }
        }
        try{
          const matrix = await parseOoxmlXlsxFallback(buf);
          finishXlsx(matrix);
        }catch(err2){
          toast('Не удалось прочитать Excel-файл. Попробуй открыть его в Excel/Google Таблицах и заново сохранить как .xlsx, либо экспортировать в .csv.');
        }
      };
      reader.readAsArrayBuffer(file);
    });
  }
}
function importGlossaryPaste(glossaryId, mode){
  const raw = document.getElementById('glossaryPasteArea').value;
  if(!raw.trim()){ toast('Вставь текст с терминами'); return; }

}

function fmtClock(sec){ sec = Math.round(sec||0); return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0'); }

function wireShotDrop(sessionId){
  const drop = document.getElementById('shotDrop'), input = document.getElementById('shotFileInput');
  if(!drop || !input) return;
  input.onchange = ()=>{ addShotFiles(sessionId, [...input.files]); input.value=''; };
  drop.ondragover = e=>{ e.preventDefault(); drop.classList.add('drag'); };
  drop.ondragleave = ()=>drop.classList.remove('drag');
  drop.ondrop = e=>{ e.preventDefault(); drop.classList.remove('drag'); addShotFiles(sessionId, [...e.dataTransfer.files]); };
}
document.addEventListener('paste', e=>{
  const m = (location.hash||'').match(/^#\/visual\/([^/]+)/);
  if(!m || document.getElementById('shotViewer')) return;
  if(e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  const files = [...(e.clipboardData?e.clipboardData.files:[])].filter(f=>f.type.startsWith('image/'));
  if(files.length){ e.preventDefault(); addShotFiles(m[1], files, 'paste'); }
});
function setShotStatus(t){ const el = document.getElementById('shotStatus'); if(el) el.textContent = t||''; }
async function addShotFiles(sessionId, files, how){
  if(visualState.busy){ toast('Подожди — ещё обрабатываются предыдущие файлы'); return; }
  files = files.filter(f=>f.type.startsWith('image/')||f.type.startsWith('video/'));
  if(!files.length){ toast('Нужны изображения или видео'); return; }
  visualState.busy = true;
  const shots = dbList('visualShots'), images = dbList('visualShotImages');
  let order = Math.max(0, ...shots.filter(s=>s.sessionId===sessionId).map(s=>s.order||0));
  let added = 0;
  try{
    for(const f of files){
      if(f.type.startsWith('video/')){
        const frames = await extractVideoFrames(f, visualState.interval, (i,n)=>setShotStatus(`«${f.name}»: кадр ${i} из ~${n}…`));
        frames.forEach(fr=>{
          const id = uid();
          shots.push({id, sessionId, name:f.name.replace(/\.[^.]+$/,'')+' · '+fmtClock(fr.t), source:'video', frameTime:fr.t, w:fr.w, h:fr.h, thumb:fr.thumb, order:++order, createdAt:nowISO()});
          images.push({id, dataUrl:fr.dataUrl}); added++;
        });
      } else {
        setShotStatus('Обрабатываю «'+f.name+'»…');
        const img = await loadImageFromFile(f);
        const full = drawScaled(img, SHOT_MAX_W, SHOT_MAX_H);
        const id = uid();
        shots.push({id, sessionId, name: how==='paste' ? 'Вставлено '+new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}) : f.name.replace(/\.[^.]+$/,''), source:'image', w:full.width, h:full.height, thumb:drawScaled(img, THUMB_W, THUMB_W*3).toDataURL('image/webp', .8), order:++order, createdAt:nowISO()});
        images.push({id, dataUrl: full.toDataURL('image/webp', .86)}); added++;
      }
    }
  }catch(err){ console.error(err); toast('Не получилось обработать файл: '+err.message); }
  visualState.busy = false; setShotStatus('');
  if(added){ dbSave('visualShotImages', images); dbSave('visualShots', shots); toast('Добавлено скриншотов: '+added); }
  router();
}
function loadImageFromFile(file){
  return new Promise((resolve, reject)=>{
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = ()=>{ URL.revokeObjectURL(url); resolve(img); };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('это не похоже на изображение')); };
    img.src = url;
  });
}
function drawScaled(src, maxW, maxH){
  const sw = src.videoWidth || src.naturalWidth || src.width, sh = src.videoHeight || src.naturalHeight || src.height;
  const k = Math.min(1, maxW/sw, maxH/sh);
  const c = document.createElement('canvas'); c.width = Math.round(sw*k); c.height = Math.round(sh*k);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  return c;
}
// Samples a frame every `step` seconds and keeps it only if it differs enough from the last
// kept frame (compared on a tiny grayscale copy) — scrolling/idle stretches don't flood the session.
async function extractVideoFrames(file, step, onProgress){
  const url = URL.createObjectURL(file);
  const v = document.createElement('video'); v.muted = true; v.playsInline = true; v.preload = 'auto'; v.src = url;
  await new Promise((res, rej)=>{ v.onloadeddata = res; v.onerror = ()=>rej(new Error('браузер не может открыть это видео (попробуй MP4)')); });
  const duration = isFinite(v.duration) ? v.duration : 0;
  const total = Math.max(1, Math.floor(duration/step)+1);
  const tiny = document.createElement('canvas'); tiny.width = 48; tiny.height = 27; const tctx = tiny.getContext('2d', {willReadFrequently:true});
  let prev = null; const out = [];
  for(let i=0, t=0; t<=duration && out.length<150; i++, t+=step){
    v.currentTime = Math.min(t, Math.max(0, duration-0.05));
    await new Promise(res=>{ v.onseeked = res; });
    onProgress && onProgress(i+1, total);
    tctx.drawImage(v, 0, 0, 48, 27);
    const d = tctx.getImageData(0,0,48,27).data; const gray = new Float32Array(48*27);
    for(let k=0;k<gray.length;k++) gray[k] = d[k*4]*.3 + d[k*4+1]*.59 + d[k*4+2]*.11;
    let diff = 255;
    if(prev){ diff = 0; for(let k=0;k<gray.length;k++) diff += Math.abs(gray[k]-prev[k]); diff /= gray.length; }
    if(diff < 4) continue;
    prev = gray;
    const full = drawScaled(v, SHOT_MAX_W, SHOT_MAX_H);
    out.push({t, w:full.width, h:full.height, dataUrl:full.toDataURL('image/webp', .86), thumb:drawScaled(v, THUMB_W, THUMB_W*3).toDataURL('image/webp', .8)});
  }
  URL.revokeObjectURL(url);
  if(!out.length) throw new Error('не удалось достать кадры из видео');
  return out;
}

function focusViewerIssue(id){ if(!viewerState) return; viewerState.focus = viewerState.focus===id ? null : id; renderShotViewer(); }
function wireViewerDrawing(){
  const cv = document.getElementById('viewerCanvas'); if(!cv) return;
  let start = null, ghost = null;
  const pt = e=>{ const r = cv.getBoundingClientRect(); return {x:Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)), y:Math.min(1,Math.max(0,(e.clientY-r.top)/r.height))}; };
  cv.onpointerdown = e=>{
    if(e.button!==0 || e.target.closest('.vbox:not(.draft)')) return;
    e.preventDefault(); cv.setPointerCapture(e.pointerId);
    start = pt(e);
    ghost = document.createElement('div'); ghost.className = 'vbox draft'; cv.appendChild(ghost);
  };
  cv.onpointermove = e=>{
    if(!start) return; const p = pt(e);
    const b = {x:Math.min(start.x,p.x), y:Math.min(start.y,p.y), w:Math.abs(p.x-start.x), h:Math.abs(p.y-start.y)};
    Object.assign(ghost.style, {left:b.x*100+'%', top:b.y*100+'%', width:b.w*100+'%', height:b.h*100+'%'});
  };
  cv.onpointerup = e=>{
    if(!start) return; const p = pt(e); const r = cv.getBoundingClientRect();
    const b = {x:Math.min(start.x,p.x), y:Math.min(start.y,p.y), w:Math.abs(p.x-start.x), h:Math.abs(p.y-start.y)};
    start = null;
    if(b.w*r.width < 8 || b.h*r.height < 8){ ghost.remove(); return; }
    viewerState.draft = {box:b}; viewerState.focus = null;
    renderShotViewer();
    setTimeout(()=>{ const t = document.getElementById('vdText'); if(t) t.focus(); }, 30);
  };
}

// finds .po rows of the session's project+language whose text matches what's visible on screen
function findRowsByScreenText(projectId, languageCode, text, limit){
  const q = (text||'').toLowerCase().replace(/\s+/g,' ').trim();
  if(q.length < 2) return [];
  const rows = dbQuery('rows', r=>r.projectId===projectId && (r.languageCode||'').toLowerCase()===(languageCode||'').toLowerCase());
  const scored = [];
  rows.forEach(r=>{
    const t = (r.target||'').toLowerCase().replace(/\s+/g,' ').trim(), s = (r.source||'').toLowerCase().replace(/\s+/g,' ').trim();
    let score = 0;
    if(t===q) score = 100; else if(t.includes(q)) score = 80 - Math.min(40, (t.length-q.length)/4); else if(q.includes(t) && t.length>3) score = 60 - Math.min(30,(q.length-t.length)/4);
    else if(s.includes(q)) score = 40;
    if(score>0) scored.push({r, score});
  });
  return scored.sort((a,b)=>b.score-a.score).slice(0, limit||5).map(x=>x.r);
}
function suggestRowsForDraft(){
  const box = document.getElementById('vdRows'); if(!box || !viewerState) return;
  const sh = dbGet('visualShots', viewerState.shotId), sess = dbGet('visualSessions', sh.sessionId);
  const found = findRowsByScreenText(sess.projectId, sess.languageCode, document.getElementById('vdFound').value, 5);
  box.innerHTML = found.length ? found.map((r,n)=>`<label class="v-row"><input type="radio" name="vdRow" value="${r.id}" ${n===0?'checked':''}><span><span class="mono" style="font-size:12px;color:var(--text-faint);">${esc(r.key||'')}</span><br>${esc(r.target||'')}</span></label>`).join('') + `<label class="v-row"><input type="radio" name="vdRow" value=""><span>Не связывать</span></label>`
    : 'Похожих строк не нашлось — проблема сохранится только со скриншотом.';
}
function saveVisualDraft(){
  const sh = dbGet('visualShots', viewerState.shotId), sess = dbGet('visualSessions', sh.sessionId);
  const text = document.getElementById('vdText').value.trim();
  if(!text){ toast('Опиши, что не так'); return; }
  const rowEl = document.querySelector('input[name=vdRow]:checked');
  const row = rowEl && rowEl.value ? dbGet('rows', rowEl.value) : null;
  const issue = {id:uid(), visual:true, manual:true, sessionId:sess.id, shotId:sh.id, box:viewerState.draft.box,
    projectId:sess.projectId, componentId: row ? row.componentId : null, rowId: row ? row.id : null, languageCode:sess.languageCode,
    type:document.getElementById('vdType').value, severity:document.getElementById('vdSev').value, text,
    highlightText: document.getElementById('vdFound').value.trim() || null, expectedText: document.getElementById('vdExpected').value.trim() || null,
    status:'Новая', createdAt:nowISO(), history:[{ts:nowISO(), action:'Обнаружена (визуальная проверка)'}]};
  dbUpsert('issues', issue);
  viewerState.draft = null; viewerState.focus = issue.id;

}
function deleteVisualIssue(id){
  if(!confirm('Удалить эту проблему?')) return;
  dbRemove('issues', id);

}
function deleteShot(shotId){
  if(!confirm('Удалить скриншот и отмеченные на нём проблемы?')) return;
  const sh = dbGet('visualShots', shotId);
  const siblings = dbQuery('visualShots', x=>x.sessionId===sh.sessionId).sort((a,b)=>(a.order||0)-(b.order||0));
  const idx = siblings.findIndex(x=>x.id===shotId);
  dbRemove('visualShotImages', shotId); dbRemove('visualShots', shotId);
  dbSave('issues', dbList('issues').filter(i=>i.shotId!==shotId));
  const next = siblings[idx+1] || siblings[idx-1];
  if(next) openShotViewer(next.id); else closeShotViewer();
}
document.addEventListener('keydown', e=>{
  if(!viewerState || /^(INPUT|TEXTAREA|SELECT)$/.test((e.target||{}).tagName||'')) return;
  if(e.key==='Escape'){ if(viewerState.draft){ viewerState.draft=null; renderShotViewer(); } else closeShotViewer(); }
  if(e.key==='ArrowLeft' || e.key==='ArrowRight'){
    const sh = dbGet('visualShots', viewerState.shotId);
    const sib = dbQuery('visualShots', x=>x.sessionId===sh.sessionId).sort((a,b)=>(a.order||0)-(b.order||0));
    const i = sib.findIndex(x=>x.id===sh.id) + (e.key==='ArrowLeft'?-1:1);
    if(sib[i]) openShotViewer(sib[i].id);
  }
});

// preview of the marked area for the issue side panel
function shotCropHtml(issue){
  const sh = dbGet('visualShots', issue.shotId); if(!sh) return '';
  const b = issue.box || {x:0,y:0,w:1,h:1};
  // show the box with some surrounding context, scaled to the panel width
  const pad = .08, cx = Math.max(0,b.x-pad), cy = Math.max(0,b.y-pad*sh.w/sh.h), cw = Math.min(1-cx, b.w+pad*2), ch = Math.min(1-cy, b.h+pad*2*sh.w/sh.h);
  const ratio = (ch*sh.h)/(cw*sh.w);
  return `<div class="shot-crop" style="padding-top:${Math.min(80,ratio*100)}%;cursor:zoom-in;" onclick="openShotViewer('${sh.id}','${issue.id}')" title="Открыть скриншот">
    <div style="position:absolute;inset:0;background-image:url('${shotImage(sh.id)}');background-size:${100/cw}% auto;background-position:${cw<1?cx/(1-cw)*100:0}% ${ch<1?cy/(1-ch)*100:0}%;background-repeat:no-repeat;"></div>
    <div class="vbox sev-${severityClass(issue.severity)}" style="left:${(b.x-cx)/cw*100}%;top:${(b.y-cy)/ch*100}%;width:${b.w/cw*100}%;height:${b.h/ch*100}%;"></div>
  </div>`;
}

/* ---------- AI check of screenshots ----------
   Uses the same backend URL as the text AI check. Request (one screenshot per call):
     {mode:'visual', model, image:'data:image/webp;base64,…', language, languageName, page, pageUrl, glossary:[{term,approved}]}
   Expected response:
     {findings:[{type, severity, text, found, expected, box:{x,y,w,h}}]}   — box in 0..1 of the image
   The backend needs a model that accepts images. */
const VISUAL_AI_PROMPT_HINT = 'Найди проблемы локализации на скриншоте интерфейса: обрезанный или не помещающийся текст, непереведённый текст, смешение языков/алфавитов, видимые переменные/теги/ключи, неверные форматы чисел/дат/валют, склонения, битые символы, поломанная вёрстка, нарушения глоссария.';
async function runVisualAI(sessionId, shotIds){
  const s = getSettings();
  if(!s.aiEnabled || !s.aiEndpointUrl){
    openModal(`<h3>ИИ-проверка ещё не подключена</h3>
      <div class="hint" style="margin-top:8px;font-size:14px;line-height:1.6;">Когда подключишь модель, которая понимает изображения, укажи адрес backend в Настройках → «Проверка ИИ» и включи его. Платформа будет отправлять каждый скриншот и получать список проблем с координатами — они появятся рамками на скриншотах и в общей таблице проблем.</div>
      <div class="hint" style="font-size:13px;">Пока можно размечать проблемы вручную: открой скриншот и выдели место мышью.</div>
      <div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Понятно</button><button class="btn" onclick="closeModal();location.hash='#/settings'">Открыть настройки</button></div>`);
    return;
  }
  const sess = dbGet('visualSessions', sessionId);
  const shots = (shotIds ? shotIds.map(id=>dbGet('visualShots', id)) : dbQuery('visualShots', x=>x.sessionId===sessionId)).filter(Boolean);
  const glossaryIds = dbQuery('glossaries', g=>!g.projectId || g.projectId===sess.projectId).map(g=>g.id);
  const glossary = dbQuery('glossaryTerms', t=>glossaryIds.includes(t.glossaryId) && (!t.language || t.language.toLowerCase()===sess.languageCode.toLowerCase())).slice(0,300).map(t=>({term:t.term, approved:t.approved}));
  let created = 0, failed = 0, done = 0;
  toast('ИИ проверяет скриншоты: '+shots.length+'…');
  for(const sh of shots){
    setShotStatus(`ИИ: ${done+1} из ${shots.length}…`);
    try{
      const res = await fetch(s.aiEndpointUrl, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify({mode:'visual', model:s.aiModel, instructions:VISUAL_AI_PROMPT_HINT, image:shotImage(sh.id), language:sess.languageCode, languageName:languageLabel(sess.languageCode), page:sess.name, pageUrl:sess.pageUrl||'', glossary})});
      if(!res.ok) throw new Error('HTTP '+res.status);
      const data = await res.json();
      if(data.error) throw new Error(data.error);
      const issues = dbList('issues').filter(i=>!(i.shotId===sh.id && i.status==='Новая' && (i.history||[]).length===1 && (i.history[0].action||'').includes('по скриншоту')));
      (data.findings||[]).forEach(f=>{
        const b = f.box || {};
        const box = [b.x,b.y,b.w,b.h].every(v=>typeof v==='number') ? {x:Math.max(0,Math.min(1,b.x)), y:Math.max(0,Math.min(1,b.y)), w:Math.max(.005,Math.min(1,b.w)), h:Math.max(.005,Math.min(1,b.h))} : null;
        const row = f.found ? findRowsByScreenText(sess.projectId, sess.languageCode, f.found, 1)[0] : null;
        issues.push({id:uid(), visual:true, manual:true, sessionId, shotId:sh.id, box, projectId:sess.projectId, componentId:row?row.componentId:null, rowId:row?row.id:null, languageCode:sess.languageCode,
          type: VISUAL_TYPES.includes(f.type) ? f.type : 'Другое', severity: AI_SEVERITIES.includes(f.severity) ? f.severity : 'Средняя',
          text: f.text || 'Найдено ИИ', highlightText: f.found || null, expectedText: f.expected || null, aiExplanation: f.text || null,
          status:'Новая', createdAt:nowISO(), history:[{ts:nowISO(), action:'Обнаружена (ИИ по скриншоту)'}]});
        created++;
      });
      dbSave('issues', issues);
      sh.aiCheckedAt = nowISO(); dbUpsert('visualShots', sh);
    }catch(err){ failed++; console.error(err); if(failed===1) toast('Ошибка ИИ-проверки: '+err.message); if(failed>=3) break; }
    done++;
  }
  setShotStatus('');
  toast(`ИИ-проверка завершена: ${done} скриншотов, новых проблем ${created}${failed?', ошибок '+failed:''}`);
  router();
}

function exportIssuesToCsv(issues){
  if(!issues.length){ toast('Нечего экспортировать'); return; }
  let csv = 'id,source,target,project,language,component,type,severity,confidence,explanation,suggestion,status,comment\n';
  const esc2 = s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';
  issues.forEach(i=>{
    const r = dbGet('rows', i.rowId); const p = dbGet('projects', i.projectId); const c = dbGet('components', i.componentId);
    const lastComment = (i.history||[]).slice().reverse().find(h=>h.comment)?.comment || '';
    csv += [esc2(i.id), esc2(r?r.source:''), esc2(r?r.target:''), esc2(p?p.name:''), esc2(i.languageCode), esc2(c?c.name:''), esc2(i.type), esc2(i.severity), esc2(i.aiConfidence), esc2(i.aiExplanation), esc2(i.aiSuggestion), esc2(i.status), esc2(lastComment)].join(',')+'\n';
  });
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='lqa_issues.csv'; a.click(); URL.revokeObjectURL(url);
}
function exportIssuesToXlsx(issues){
  if(!issues.length){ toast('Нечего экспортировать'); return; }
  ensureXlsx().then(ok=>{
    if(!ok){ toast('Библиотека Excel не загрузилась — используй CSV вместо этого.'); return; }
    const data = issues.map(i=>{
      const r = dbGet('rows', i.rowId); const p = dbGet('projects', i.projectId); const c = dbGet('components', i.componentId);
      return {ID:i.id, Исходный_текст:r?r.source:'', Перевод:r?r.target:'', Проект:p?p.name:'', Язык:i.languageCode, Папка:c?c.name:'', Тип:i.type, Важность:i.severity, Уверенность_ИИ:i.aiConfidence, Объяснение:i.aiExplanation, Предложение:i.aiSuggestion, Статус:i.status};
    });
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Проблемы');
    XLSX.writeFile(wb, 'lqa_issues.xlsx');
  });
}

function doExport(fmt){
  let issues = dbList('issues');
