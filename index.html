  st._lastFilteredIds = issues.map(i=>i.id); // used by "select all по фильтру"
}
/* Строки+Проблемы объединены: одна строка таблицы = одна запись перевода, все
   найденные по ней проблемы показаны внутри (бейджами) и доступны через "Открыть".
   Фильтры важности/статуса/типа сужают до строк, у которых есть подходящая проблема;
   без них — показывает вообще всё, что загружено, как раньше делала вкладка "Строки". */
function renderRowsIssuesGeneric(fixedFilter, mountId){
  issuesFixedFilters[mountId] = fixedFilter;
  const projects = dbList('projects');
  const key = mountId;
  issuesPageState[key] = issuesPageState[key] || {page:1, selected:new Set(), openPanel:null, mode:'rows',
    filters:{proj:new Set(), comp:new Set(), file:new Set(), lang:new Set(), sev:new Set(), status:new Set(), type:new Set()}};
  const st = issuesPageState[key];
  st.mode = 'rows';

  const languageOptions = fixedFilter.projectId
    ? (dbGet('projects', fixedFilter.projectId)?.languages||[]).map(l=>[l.code, l.name])
    : [...new Set(dbList('rows').map(r=>r.languageCode).filter(Boolean))].sort().map(c=>[c,c]);
  const componentOptions = fixedFilter.componentId ? [] :
    (fixedFilter.projectId ? dbQuery('components', c=>c.projectId===fixedFilter.projectId) : dbList('components'));
  const fileOptions = (fixedFilter.componentId ? dbQuery('files', f=>f.componentId===fixedFilter.componentId)
    : fixedFilter.projectId ? dbQuery('files', f=>f.projectId===fixedFilter.projectId)
    : dbList('files')).filter(f=>!f.supersededBy);
  const SEV_OPTS = ['Критическая','Высокая','Средняя','Низкая'].map(v=>[v,v]);
  const STATUS_OPTS = ['Новая','На проверке','Принята','Принята после исправления','Отклонена','Ложное срабатывание'].map(v=>[v,v]);
  const TYPE_OPTS = [...new Set(dbList('issues').map(i=>i.type))].map(v=>[v,v]);

  let root = document.getElementById(mountId);
  if(!root) return;
  if(!root.dataset.inited){
    root.innerHTML = `<div class="row" style="margin-bottom:14px;flex-wrap:wrap;">
        <input type="text" id="${key}_q" placeholder="Поиск по тексту, ключу…" style="flex:1;min-width:180px;" oninput="renderRowsIssuesGeneric(issuesFixedFilters['${mountId}'], '${mountId}')">
        <div id="${key}_filterswrap" style="display:contents;"></div>
      </div>
      <div class="row between" style="margin-bottom:6px;flex-wrap:wrap;">
        <div class="row" style="gap:14px;">
          <label class="hint" style="margin:0;display:flex;align-items:center;gap:8px;cursor:pointer;"><input type="checkbox" id="${key}_all" onchange="toggleAllIssues('${key}', issuesFixedFilters['${mountId}'])"> выбрать все на странице</label>
          <button class="btn secondary sm" onclick="selectAllFiltered('${key}', issuesFixedFilters['${mountId}'])">Выбрать вообще все по фильтру</button>
          <a href="javascript:void(0)" onclick="clearSelection('${key}', issuesFixedFilters['${mountId}'])" style="color:var(--text-faint);font-size:12.5px;">снять выделение</a>
        </div>
        <div id="${key}_bulkbar" class="row" style="display:none;">
          <span class="badge" id="${key}_selcount" style="font-size:13px;padding:5px 12px;"></span>
          <button class="btn secondary sm" onclick="bulkRunAI('${key}')">ИИ-проверка выбранных</button><button class="btn secondary sm" onclick="bulkSendToReview('${key}')">Отправить на проверку</button><button class="btn secondary sm" onclick="bulkChangeStatus('${key}')">Изменить статус</button><button class="btn secondary sm" onclick="bulkExportSelected('${key}')">Экспорт выбранных</button><button class="btn secondary sm" onclick="bulkExportPo('${key}')">Скачать .po</button><button class="btn danger sm" onclick="bulkDeleteIssues('${key}')">Удалить</button>
        </div></div>
      <div class="hint" style="margin-bottom:10px;">Массовые действия применяются ко всем найденным проблемам выбранных строк (даже если фильтр важности/статуса/типа сейчас показывает не все).</div>
      <div id="${key}_tablewrap"></div>`;
    root.dataset.inited = '1';
  }

  const fwrap = document.getElementById(key+'_filterswrap');
  if(fwrap){
    let html = '';
    if(!fixedFilter.projectId) html += renderMsel(key, 'proj', 'Проект', projects.map(p=>[p.id,p.name]));
    if(!fixedFilter.componentId) html += renderMsel(key, 'comp', 'Папка', componentOptions.map(c=>[c.id,c.name]));
    html += renderMsel(key, 'file', 'Файл', fileOptions.map(f=>[f.id, f.filename+' ('+f.languageCode+')']));
    html += renderMsel(key, 'lang', 'Язык', languageOptions);
    html += renderMsel(key, 'sev', 'Важность', SEV_OPTS);
    html += renderMsel(key, 'status', 'Статус', STATUS_OPTS);
    html += renderMsel(key, 'type', 'Тип', TYPE_OPTS);
    fwrap.innerHTML = html;
  }

  let q = document.getElementById(key+'_q'); q = q ? q.value.toLowerCase() : '';
  const f = st.filters;

  let rows = dbList('rows');
  if(fixedFilter.projectId) rows = rows.filter(r=>r.projectId===fixedFilter.projectId);
  else if(f.proj.size) rows = rows.filter(r=>f.proj.has(r.projectId));
  if(fixedFilter.componentId) rows = rows.filter(r=>r.componentId===fixedFilter.componentId);
  else if(f.comp.size) rows = rows.filter(r=>f.comp.has(r.componentId));
  if(f.file.size) rows = rows.filter(r=>f.file.has(r.fileId));
  if(f.lang.size) rows = rows.filter(r=>f.lang.has(r.languageCode));
  if(q) rows = rows.filter(r=>(r.source||'').toLowerCase().includes(q) || (r.target||'').toLowerCase().includes(q) || (r.key||'').toLowerCase().includes(q));

  const rowIdSet = new Set(rows.map(r=>r.id));
  const hasIssueFilter = f.sev.size>0 || f.status.size>0 || f.type.size>0;
  const issuesByRow = {};
  dbList('issues').forEach(i=>{
    if(!rowIdSet.has(i.rowId)) return;
    if(f.sev.size && !f.sev.has(i.severity)) return;
    if(f.status.size && !f.status.has(i.status)) return;
    if(f.type.size && !f.type.has(i.type)) return;
    (issuesByRow[i.rowId] = issuesByRow[i.rowId]||[]).push(i);
  });
  let finalRows = hasIssueFilter ? rows.filter(r=>issuesByRow[r.id] && issuesByRow[r.id].length) : rows;

  const sevRank = {'Критическая':0,'Высокая':1,'Средняя':2,'Низкая':3};
  const rankOf = r => { const arr=issuesByRow[r.id]; if(!arr||!arr.length) return 99; return Math.min(...arr.map(i=>sevRank[i.severity]??9)); };
  finalRows = finalRows.slice().sort((a,b)=> rankOf(a)-rankOf(b) || ((issuesByRow[b.id]||[]).length-(issuesByRow[a.id]||[]).length));

  const pageSize = 25;
  const totalPages = Math.max(1, Math.ceil(finalRows.length/pageSize));
  if(st.page>totalPages) st.page = totalPages;
  const pageRows = finalRows.slice((st.page-1)*pageSize, st.page*pageSize);
  const tw = document.getElementById(key+'_tablewrap');
  if(!tw) return;
  tw.innerHTML = pageRows.length ? `<div class="table-wrap"><table><thead><tr><th style="width:36px;"></th><th>Ключ</th><th>Язык</th><th>Папка</th><th>Исходный текст</th><th>Перевод</th><th>Проблемы</th><th>Дедлайн</th><th></th></tr></thead><tbody>
    ${pageRows.map(r=>{
      const comp = dbGet('components', r.componentId);
      const rowIssues = issuesByRow[r.id]||[];
      const primary = rowIssues[0];
      const pillsHtml = rowIssues.length
        ? rowIssues.slice(0,3).map(i=>`<span class="pill sev-${severityClass(i.severity)}" style="cursor:pointer;margin:1px 3px 1px 0;" onclick="event.stopPropagation();openIssueDetail('${i.id}')" title="${esc(i.type)}">${esc(i.type)}</span>`).join('') + (rowIssues.length>3?`<span class="hint">+${rowIssues.length-3}</span>`:'')
        : '<span class="pill st-accepted">'+icon('check',12)+'ОК</span>';
      const nearestDeadline = rowIssues.map(i=>i.deadline).find(Boolean);
      return `<tr class="clickable ${st.selected.has(r.id)?'row-selected':''} ${kbFocusId===r.id?'kb-focus':''}" data-id="${r.id}" data-kind="row" onclick="if(!event.target.closest('input,button,a,.pill')){kbFocusId='${r.id}';kbApplyFocus(false);openRowDetail('${r.id}');}">
        <td><input type="checkbox" class="${key}_chk" value="${r.id}" ${st.selected.has(r.id)?'checked':''} onchange="toggleOneIssue('${key}', '${r.id}', this.checked, this)"></td>
        <td class="mono cell-key" title="${esc(r.key||'')}">${esc(r.key||'—')}</td>
        <td>${esc(r.languageCode)}</td>
        <td>${folderBadge(comp)}</td>
        <td class="mono cell-text">${primary?renderFieldWithHighlight(r.source, primary, 'source'):highlightTokens(r.source)}</td>
        <td class="mono cell-text">${primary?renderFieldWithHighlight(r.target, primary, 'target'):highlightTokens(r.target)}</td>
        <td style="min-width:140px;">${pillsHtml}</td>
        <td class="nowrap">${nearestDeadline?formatDeadline(nearestDeadline):'<span class="hint">—</span>'}</td>
        <td class="cell-go">${icon('chevronRight',16)}</td>
      </tr>`;
    }).join('')}
  </tbody></table></div>
  <div class="pager"><span>${finalRows.length} строк, стр. ${st.page} из ${totalPages}</span>
    <button onclick="issuesPageState['${key}'].page=Math.max(1,${st.page}-1);renderRowsIssuesGeneric(issuesFixedFilters['${mountId}'],'${mountId}')" ${st.page<=1?'disabled':''}>←</button>
    <button onclick="issuesPageState['${key}'].page=Math.min(${totalPages},${st.page}+1);renderRowsIssuesGeneric(issuesFixedFilters['${mountId}'],'${mountId}')" ${st.page>=totalPages?'disabled':''}>→</button>
  </div>` : emptyState({icon:'search', compact:true, title:'Ничего не найдено', text:'Попробуй изменить фильтр или поиск.'});

  const masterCb = document.getElementById(key+'_all');
  if(masterCb) masterCb.checked = pageRows.length>0 && pageRows.every(r=>st.selected.has(r.id));
  updateSelectionCount(key);
  st._lastFilteredIds = finalRows.map(r=>r.id);
}
function updateSelectionCount(key){
  const countEl = document.getElementById(key+'_selcount');
  const barEl = document.getElementById(key+'_bulkbar');
  const st = issuesPageState[key];
  const n = st ? st.selected.size : 0;
  if(barEl) barEl.style.display = n ? 'flex' : 'none';
  if(countEl) countEl.textContent = n ? n+' выбрано' : '';
}
function toggleOneIssue(key, id, checked, cb){
  const st = issuesPageState[key];

  if(cb){ const tr = cb.closest('tr'); if(tr) tr.classList.toggle('row-selected', checked); }
}
function renderMsel(key, field, label, options){
  const st = issuesPageState[key];

  const open = st.openPanel===field;
  const panel = open ? `<div class="msel-panel" id="${key}_${field}_panel">
      ${options.length ? options.map(([v,l])=>`<label><input type="checkbox" ${sel.has(v)?'checked':''} onchange="toggleMselOption('${key}','${field}','${v}',this.checked)"> ${esc(l)}</label>`).join('') : '<div class="hint">Нет вариантов</div>'}
      <div class="msel-actions"><a href="javascript:void(0)" onclick="clearMselField('${key}','${field}')" style="font-size:12px;color:var(--text-faint);">сбросить</a><button class="btn secondary sm" style="margin-left:auto;" onclick="closeMselPanel('${key}')">Готово</button></div>
    </div>` : '';
  return `<div class="msel"><button type="button" id="${key}_${field}_btn" class="btn secondary sm ${sel.size?'msel-on':''}" onclick="toggleMselPanel('${key}','${field}')">${esc(summary)}<span class="chev">${icon('chevronDown',14)}</span></button>${panel}</div>`;
}
/* ---------- saved filters ----------
   savedViews: {id, name, quickFilter, filters:{field:[values]}, q, by, createdAt} — shared with the team through sync. */
const VIEW_FIELDS = ['proj','comp','file','lang','sev','status','type'];
function viewFromState(st, q){ const f = {}; VIEW_FIELDS.forEach(k=>{ const v = [...(st.filters[k]||[])].sort(); if(v.length) f[k] = v; }); return {quickFilter: st.quickFilter||'all', filters:f, q:(q||'').trim()}; }
function viewSignature(st, q){ const v = st.filters && st.filters.proj instanceof Set ? viewFromState(st, q) : st; const f = v.filters||{}; return JSON.stringify([v.quickFilter||'all', VIEW_FIELDS.map(k=>(f[k]||[]).slice().sort()), (v.q||'').trim().toLowerCase()]); }
function viewIsDefault(st, q){ return viewSignature(st, q)===JSON.stringify(['all', VIEW_FIELDS.map(()=>[]), '']); }
function savedViewSummary(v){
  const names = {proj:'проект', comp:'папка', file:'файл', lang:'язык', sev:'важность', status:'статус', type:'тип'};
  const parts = []; const qf = {critical:'критические', review:'требуют ревью', ai:'AI-проверенные'}[v.quickFilter]; if(qf) parts.push(qf);
  Object.entries(v.filters||{}).forEach(([k,vals])=>{ const label = k==='proj' ? vals.map(id=>dbGet('projects',id)?.name||'?') : k==='comp' ? vals.map(id=>dbGet('components',id)?.name||'?') : k==='file' ? vals.map(id=>dbGet('files',id)?.filename||'?') : vals; parts.push(names[k]+': '+label.join(', ')); });
  if(v.q) parts.push('поиск «'+v.q+'»');
  return parts.join(' · ') || 'все проблемы';
}
async function saveCurrentView(key){
  const st = issuesPageState[key]; if(!st) return;
  const qEl = document.getElementById(key+'_q');
  const v = viewFromState(st, qEl ? qEl.value : '');
  const name = await uiPrompt({title:'Сохранить фильтр', label:'Название', placeholder:'например: казахский, критичные, мои', text:esc(savedViewSummary(v))+'. Фильтр увидят все в команде, он появится рядом с быстрыми фильтрами и в палитре команд (Ctrl+K).'});
  if(!name) return;
  dbUpsert('savedViews', Object.assign({id:uid(), name, by:getMe()||null, createdAt:nowISO()}, v));
  toast('Фильтр «'+name+'» сохранён'); rerenderIssuesOrRows(key, issuesFixedFilters[key]);
}
function applySavedView(key, id){
  const v = dbGet('savedViews', id); if(!v) return;
  const st = issuesPageState[key] = issuesPageState[key] || {page:1, selected:new Set(), openPanel:null, quickFilter:'all', filters:{}};
  st.quickFilter = v.quickFilter||'all'; st.page = 1; st.selected = new Set(); st.openPanel = null;
  st.filters = {}; VIEW_FIELDS.forEach(k=>st.filters[k] = new Set((v.filters||{})[k]||[]));
  const qEl = document.getElementById(key+'_q'); if(qEl) qEl.value = v.q||'';
  if(document.getElementById(key)) rerenderIssuesOrRows(key, issuesFixedFilters[key]);
}
async function deleteSavedView(key, id){
  const v = dbGet('savedViews', id); if(!v) return;
  const snap = snapshotTables(['savedViews']);
  dbRemove('savedViews', id); toastUndo('Фильтр «'+v.name+'» удалён', snap);
  rerenderIssuesOrRows(key, issuesFixedFilters[key]);
}
function openSavedViewGlobally(id){
  const v = dbGet('savedViews', id); if(!v) return;
  applySavedView('issuesRoot', id);
  if(location.hash!=='#/issues') location.hash = '#/issues';
  setTimeout(()=>{ const qEl = document.getElementById('issuesRoot_q'); if(qEl && qEl.value!==(v.q||'')){ qEl.value = v.q||''; renderIssuesTableGeneric({}, 'issuesRoot'); } }, 60);
}
function setQuickFilter(key, mode, fixedFilter){
  const st = issuesPageState[key];
  if(!st) return;
  st.quickFilter = mode;
  st.page = 1;
  st.selected.clear();
  rerenderIssuesOrRows(key, fixedFilter);
}
function rerenderIssuesOrRows(key, fixedFilter){
  const st = issuesPageState[key];
  if(st && st.mode==='rows') renderRowsIssuesGeneric(fixedFilter, key);
  else renderIssuesTableGeneric(fixedFilter, key);
}
function toggleMselPanel(key, field){
  const st = issuesPageState[key];
  st.openPanel = (st.openPanel===field) ? null : field;
  rerenderIssuesOrRows(key, issuesFixedFilters[key]);
  if(st.openPanel){
    setTimeout(()=>{
      const panel = document.getElementById(key+'_'+field+'_panel');
      const btn = document.getElementById(key+'_'+field+'_btn');
      if(!panel || !btn) return;
      const btnRect = btn.getBoundingClientRect();
      const panelW = panel.offsetWidth, panelH = panel.offsetHeight;
      let left = btnRect.left;
      left = Math.min(left, window.innerWidth - panelW - 8);
      left = Math.max(8, left);
      let top = btnRect.bottom + 4;
      if(top + panelH > window.innerHeight - 8) top = Math.max(8, btnRect.top - panelH - 4); // flip above if no room below
      panel.style.left = left + 'px';
      panel.style.top = top + 'px';
    }, 0);
  }
}
function closeMselPanel(key){
  issuesPageState[key].openPanel = null;
  rerenderIssuesOrRows(key, issuesFixedFilters[key]);
}
function toggleMselOption(key, field, value, checked){
  const st = issuesPageState[key];
  if(checked) st.filters[field].add(value); else st.filters[field].delete(value);
  st.page = 1;
  st.selected.clear(); // otherwise items hidden by the new filter stay selected invisibly
  rerenderIssuesOrRows(key, issuesFixedFilters[key]);
}
function clearMselField(key, field){
  issuesPageState[key].filters[field].clear();
  issuesPageState[key].page = 1;
  issuesPageState[key].selected.clear();
  rerenderIssuesOrRows(key, issuesFixedFilters[key]);
}
function toggleAllIssues(key, fixedFilter){
  const master = document.getElementById(key+'_all').checked;
  const st = issuesPageState[key];
  document.querySelectorAll('.'+key+'_chk').forEach(cb=>{
    cb.checked = master;
    if(master) st.selected.add(cb.value); else st.selected.delete(cb.value);
    const tr = cb.closest('tr'); if(tr) tr.classList.toggle('row-selected', master);
  });
  updateSelectionCount(key);
}
function selectAllFiltered(key, fixedFilter){
  const st = issuesPageState[key];
  if(!st) return;
  (st._lastFilteredIds||[]).forEach(id=>st.selected.add(id));
  rerenderIssuesOrRows(key, fixedFilter);
  toast('Выбрано: '+st.selected.size);
}
function clearSelection(key, fixedFilter){
  const st = issuesPageState[key];
  if(!st) return;
  st.selected.clear();
  rerenderIssuesOrRows(key, fixedFilter);
}
function getSelectedIssueIds(key){
  const st = issuesPageState[key];
  if(!st) return [];
  if(st.mode==='rows'){
    const rowIds = st.selected;
    return dbList('issues').filter(i=>rowIds.has(i.rowId)).map(i=>i.id);
  }
  return [...st.selected];
}
// works from both the row-grouped "Строки" table (selection is already row ids) and the
// issue-grouped tables like "Все проблемы" (selection is issue ids — resolved to their rows)
function getSelectedRowIds(key){
  const st = issuesPageState[key];
  if(!st) return [];
  if(st.mode==='rows') return [...st.selected];
  return [...new Set([...st.selected].map(id=>dbGet('issues', id)?.rowId).filter(Boolean))];
}
function escapePoString(str){
  // our own po parser only unescapes \" -> " on import (leaves \n, \t etc. as literal
  // 2-char sequences, since that's already correct .po syntax) — so on export we must
  // only escape real quote/newline/tab characters, and must NOT touch existing
  // backslashes, or a round-tripped "\n" would corrupt into "\\n".
  return String(str==null?'':str).replace(/"/g,'\\"').replace(/\r?\n/g,'\\n').replace(/\t/g,'\\t');
}
function generatePoFromRows(rows){
  let out = 'msgid ""\nmsgstr ""\n"Content-Type: text/plain; charset=UTF-8\\n"\n\n';
  rows.forEach(r=>{
    if(r.key) out += 'msgctxt "'+escapePoString(r.key)+'"\n';
    out += 'msgid "'+escapePoString(r.source)+'"\n';
    if(r.targetForms){
      out += 'msgid_plural "'+escapePoString(r.sourcePlural||r.source)+'"\n';
      r.targetForms.forEach((f,i)=>{ out += 'msgstr['+i+'] "'+escapePoString(i===0 ? r.target : f)+'"\n'; });
      out += '\n';
    } else out += 'msgstr "'+escapePoString(r.target)+'"\n\n';
  });
  return out;
}
function downloadPoFile(text, filename){
  const blob = new Blob([text], {type:'text/plain;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}
function bulkExportPo(key){
  const rowIds = getSelectedRowIds(key);
  if(!rowIds.length){ toast('Выбери хотя бы одну строку'); return; }
  const rows = rowIds.map(id=>dbGet('rows', id)).filter(Boolean);
  const langs = [...new Set(rows.map(r=>r.languageCode))];
  const filename = 'export_'+(langs.length===1?langs[0]:'multi')+'_'+rows.length+'.po';
  downloadPoFile(generatePoFromRows(rows), filename);
  toast('Экспортировано в .po: '+rows.length+' строк');
}

/* ---- deadlines ---- */
function formatDeadline(d){
  if(!d) return '<span class="hint">—</span>';
  if(d.type==='asap') return '<span class="pill sev-high">как можно скорее</span>';
  if(d.type==='date' && d.date){
    const overdue = new Date(d.date) < new Date(new Date().toDateString());
    return `<span class="pill ${overdue?'sev-critical':'type'}">${overdue?'просрочено ':''}${new Date(d.date).toLocaleDateString('ru-RU')}</span>`;
  }
  return '<span class="hint">—</span>';
}
function toggleDeadlineDateVisibility(selectId, dateId){
  const sel = document.getElementById(selectId), dateEl = document.getElementById(dateId);
  if(!sel || !dateEl) return;
  dateEl.style.display = sel.value==='date' ? 'block' : 'none';
}
function saveIssueDeadline(issueId){
  const type = document.getElementById('issueDeadlineType').value;
  const date = document.getElementById('issueDeadlineDate').value;
  const i = dbGet('issues', issueId);
  i.deadline = type==='date' ? (date ? {type:'date', date} : null) : (type==='asap' ? {type:'asap'} : null);
  dbUpsert('issues', i);
  toast('Дедлайн сохранён');
  openIssueDetail(issueId);
}

/* ---- bulk: change status ---- */
function bulkChangeStatus(key){
  const ids = getSelectedIssueIds(key);
  if(!ids.length){ toast('Выбери хотя бы одну проблему'); return; }

  if(a.includes('глоссария')) return 'Глоссарий';
  if(a.includes('согласованности')) return 'Проверка согласованности';
  if(a.includes('по скриншоту')) return 'AI по скриншоту';

function rowScreens(r){

  const sameKeyRows = new Set(dbList('rows').filter(x=>x.projectId===r.projectId && (r.key ? x.key===r.key : x.source===r.source)).map(x=>x.id));
  const seen = new Set(), out = [];
  dbList('issues').forEach(i=>{

  return out;

function applyFix(issueId){

  if(oldTarget!==newTarget) r.targetHistory = (r.targetHistory||[]).concat([{ts:nowISO(), how:'fix', from:oldTarget, to:newTarget, by:reviewer||getMe()||null, comment:comment||undefined, issueType:i.type}]).slice(-ROW_HISTORY_MAX);

  if(reviewer) i.assignedTo = reviewer;
  i.history.push({ts:nowISO(), action:'Исправлено', comment, oldTarget, newTarget, reviewer: reviewer||null});

  toast('Исправление сохранено');

function splitCsvLine(line, delim){
  if(delim!==','){ return line.split(delim).map(s=>s.trim()); }
  const res=[]; let cur='', q=false;
  for(let i=0;i<line.length;i++){ const c=line[i]; if(c==='"'){ if(q&&line[i+1]==='"'){cur+='"';i++;} else q=!q; } else if(c===','&&!q){res.push(cur);cur='';} else cur+=c; }
  res.push(cur); return res.map(s=>s.trim());
}
function findColumnIndex(header, candidates){
  const lower = header.map(h=>(h==null?'':String(h)).trim().toLowerCase());
  for(const c of candidates){ const idx = lower.indexOf(c); if(idx>=0) return idx; }
  return -1;
}
// alternate to .po for the upload dropzone: a CSV/TSV with key/source/target-style columns
// (header names auto-detected across common variants), falling back to columns 1/2/3 if no
// recognizable header is found
function parseCsvEntries(text){
  const lines = text.split(/\r?\n/).filter(l=>l.trim());
  if(!lines.length) return [];
  const delim = lines[0].includes('\t') ? '\t' : (lines[0].includes(';') && !lines[0].includes(',') ? ';' : ',');
  const rows = lines.map(l=>splitCsvLine(l, delim));
  const header = rows[0];
  const keyIdx = findColumnIndex(header, ['key','ключ','id','msgctxt','название','name']);
  const srcIdx = findColumnIndex(header, ['source','ru','original','исходный','msgid','русский','src']);
  const tgtIdx = findColumnIndex(header, ['target','translation','перевод','msgstr','tgt']);
  const hasHeader = srcIdx>=0 || tgtIdx>=0;
  const dataRows = hasHeader ? rows.slice(1) : rows;
  const kI = hasHeader ? keyIdx : 0;
  const sI = hasHeader ? (srcIdx>=0?srcIdx:1) : 1;
  const tI = hasHeader ? (tgtIdx>=0?tgtIdx:2) : 2;
  return dataRows.map((r,i)=>({
    key: kI>=0 ? (r[kI]||'') : ('row'+(i+1)),
    source: r[sI]||'',
    target: r[tI]||''
  })).filter(e=>e.source || e.target);
}
// alternate to .po for the upload dropzone: either an array of {key/source/target}-ish
// objects (field names auto-detected), or a flat "key": "translated string" locale map —
// the latter has no separate source, so checks that only look at the translation
// (spacing, punctuation, rebranding, glossary) still work; ones comparing to source won't
// find anything to flag, which is the best available given the format has no source text
function parseJsonEntries(text){
  let data;
  try{ data = JSON.parse(text); }catch(e){ throw new Error('Некорректный JSON: '+e.message); }
  if(Array.isArray(data)){
    return data.map((obj,i)=>{
      const lower = {}; Object.keys(obj||{}).forEach(k=>{ lower[k.toLowerCase()]=obj[k]; });
      const pick = (cands, fallback) => { for(const c of cands){ if(lower[c]!=null) return lower[c]; } return fallback; };
      return {
        key: String(pick(['key','id','msgctxt','ключ','name'], 'row'+(i+1))),
        source: String(pick(['source','ru','original','msgid','исходный','src'], '')),
        target: String(pick(['target','translation','msgstr','перевод','tgt','value'], ''))
      };
    }).filter(e=>e.source || e.target);
  }
  if(data && typeof data==='object'){
    return Object.keys(data).map(k=>({ key:k, source:'', target: data[k]==null?'':String(data[k]) }));
  }
  return [];
}
function applyGlossaryImportRows(glossaryId, rowsMatrix, mode){
  mode = mode || 'upsert';
  if(!rowsMatrix.length){ toast('Не удалось прочитать данные'); return; }
  let arr = dbList('glossaryTerms');
  if(mode==='replace') arr = arr.filter(t=>t.glossaryId!==glossaryId);
  let start = 0;
  const header = (rowsMatrix[0]||[]).map(c=>String(c||'').trim().toLowerCase());
  if(header[0]==='term' || header[0]==='термин') start=1;
  let added=0, updated=0;
  for(let i=start;i<rowsMatrix.length;i++){
    const cells = rowsMatrix[i].map(c=>String(c===undefined?'':c).trim());
    if(!cells[0]) continue;
    const term = cells[0], approved = cells[1]||'', forbidden = (cells[2]||'').split(';').map(s=>s.trim()).filter(Boolean);
    const existing = mode==='upsert' ? arr.find(t=>t.glossaryId===glossaryId && t.term.trim().toLowerCase()===term.trim().toLowerCase()) : null;
    if(existing){
      existing.approved = approved; existing.forbidden = forbidden;
      updated++;
    } else {
      arr.push({id:uid(), glossaryId, term, approved, forbidden, comment:'', status:'Активен'});
      added++;
    }
  }
  dbSave('glossaryTerms', arr);
  toast(mode==='replace' ? ('Термины заменены: '+added) : ('Добавлено новых: '+added+', обновлено: '+updated));
  router();
}
function importGlossaryFile(glossaryId, file, mode, onDone){
  if(!file) return;
  const name = file.name.toLowerCase();
  const finish = rowsMatrix => { applyGlossaryImportRows(glossaryId, rowsMatrix, mode); if(onDone) onDone(); };
  if(name.endsWith('.csv')||name.endsWith('.tsv')||name.endsWith('.txt')){
    const reader = new FileReader();
    reader.onload = e=>{
      const lines = e.target.result.split(/\r?\n/).filter(l=>l.trim());
      const delim = name.endsWith('.tsv') ? '\t' : (lines[0]&&lines[0].includes('\t')?'\t':(lines[0]&&lines[0].includes(';')&&!lines[0].includes(',')?';':','));
      finish(lines.map(l=>splitCsvLine(l, delim)));
    };
    reader.readAsText(file, 'UTF-8');
  } else {
    const glossary = dbGet('glossaries', glossaryId);
    const langCode = glossary ? glossary.language : '';
    const finishXlsx = matrix => finish(remapSmartcatMatrix(matrix, langCode) || matrix);
    ensureXlsx().then(xlsxOk=>{
      const reader = new FileReader();
      reader.onload = async e=>{
        const buf = e.target.result;
        if(xlsxOk){
          try{
            const wb = XLSX.read(new Uint8Array(buf), {type:'array'});
            finishXlsx(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, defval:''}));
            return;
          }catch(err1){ /* fall through to the JSZip-based reader below */ }
        }
        try{
          const matrix = await parseOoxmlXlsxFallback(buf);
          finishXlsx(matrix);
        }catch(err2){
          toast('Не удалось прочитать Excel-файл. Попробуй открыть его в Excel/Google Таблицах и заново сохранить как .xlsx, либо экспортировать в .csv.');
        }
      };
      reader.readAsArrayBuffer(file);
    });
  }
}
function importGlossaryPaste(glossaryId, mode){
  const raw = document.getElementById('glossaryPasteArea').value;

/* =========================================================
   VISUAL CHECK — screenshots / video frames of the live UI
   Sessions (project + language + page) hold screenshots; problems are
   marked as boxes on a screenshot and stored as ordinary issues
   (visual:true, shotId, box in 0..1 coords) so they flow through the same
   issues table, review and export as text problems. An issue can optionally
   be linked to a .po row (rowId) so the fix lands on the right key.
   ========================================================= */
const VISUAL_TYPES = ['Обрезанный текст','Не помещается / наезжает','Не переведено','Смешение языков','Видна переменная / тег / ключ','Формат числа, даты, валюты','Склонение / множественное число','Шрифт / символы','Вёрстка','Бренд / глоссарий','Смысл / перевод','Другое'];
const SHOT_MAX_W = 1600, SHOT_MAX_H = 8000, THUMB_W = 420;
let visualState = {interval:2, busy:false};

function visualIssueCell(i){
  const sh = i.shotId ? dbGet('visualShots', i.shotId) : null;
  return `<div class="row" style="gap:10px;flex-wrap:nowrap;">${sh?`<img class="thumb-sm" src="${sh.thumb}" alt="">`:''}<div style="min-width:0;"><div>${esc(i.text)}</div>${i.highlightText?`<div class="mono hint" style="margin:2px 0 0;">«${esc(i.highlightText)}»${i.expectedText?' → «'+esc(i.expectedText)+'»':''}</div>`:''}</div></div>`;
}
function visualSessionStats(sessionId){
  const shots = dbQuery('visualShots', s=>s.sessionId===sessionId);
  const issues = dbQuery('issues', i=>i.visual && i.sessionId===sessionId);
  return {shots, issues};
}
function shotImage(shotId){ const r = dbGet('visualShotImages', shotId); return r ? r.dataUrl : ''; }
function worstSeverity(issues){
  const order = ['Критическая','Высокая','Средняя','Низкая'];
  for(const s of order) if(issues.some(i=>i.severity===s)) return s;
  return null;
}

function fmtClock(sec){ sec = Math.round(sec||0); return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0'); }

function wireShotDrop(sessionId){
  const drop = document.getElementById('shotDrop'), input = document.getElementById('shotFileInput');
  if(!drop || !input) return;
  input.onchange = ()=>{ addShotFiles(sessionId, [...input.files]); input.value=''; };
  drop.ondragover = e=>{ e.preventDefault(); drop.classList.add('drag'); };
  drop.ondragleave = ()=>drop.classList.remove('drag');
  drop.ondrop = e=>{ e.preventDefault(); drop.classList.remove('drag'); addShotFiles(sessionId, [...e.dataTransfer.files]); };
}
document.addEventListener('paste', e=>{
  const m = (location.hash||'').match(/^#\/visual\/([^/]+)/);
  if(!m || document.getElementById('shotViewer')) return;
  if(e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  const files = [...(e.clipboardData?e.clipboardData.files:[])].filter(f=>f.type.startsWith('image/'));
  if(files.length){ e.preventDefault(); addShotFiles(m[1], files, 'paste'); }
});
function setShotStatus(t){ const el = document.getElementById('shotStatus'); if(el) el.textContent = t||''; }
async function addShotFiles(sessionId, files, how){
  if(visualState.busy){ toast('Подожди — ещё обрабатываются предыдущие файлы'); return; }
  files = files.filter(f=>f.type.startsWith('image/')||f.type.startsWith('video/'));
  if(!files.length){ toast('Нужны изображения или видео'); return; }
  visualState.busy = true;
  const shots = dbList('visualShots'), images = dbList('visualShotImages');
  let order = Math.max(0, ...shots.filter(s=>s.sessionId===sessionId).map(s=>s.order||0));
  let added = 0;
  try{
    for(const f of files){
      if(f.type.startsWith('video/')){
        const frames = await extractVideoFrames(f, visualState.interval, (i,n)=>setShotStatus(`«${f.name}»: кадр ${i} из ~${n}…`));
        frames.forEach(fr=>{
          const id = uid();
          shots.push({id, sessionId, name:f.name.replace(/\.[^.]+$/,'')+' · '+fmtClock(fr.t), source:'video', frameTime:fr.t, w:fr.w, h:fr.h, thumb:fr.thumb, order:++order, createdAt:nowISO()});
          images.push({id, dataUrl:fr.dataUrl}); added++;
        });
      } else {
        setShotStatus('Обрабатываю «'+f.name+'»…');
        const img = await loadImageFromFile(f);
        const full = drawScaled(img, SHOT_MAX_W, SHOT_MAX_H);
        const id = uid();
        shots.push({id, sessionId, name: how==='paste' ? 'Вставлено '+new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}) : f.name.replace(/\.[^.]+$/,''), source:'image', w:full.width, h:full.height, thumb:drawScaled(img, THUMB_W, THUMB_W*3).toDataURL('image/webp', .8), order:++order, createdAt:nowISO()});
        images.push({id, dataUrl: full.toDataURL('image/webp', .86)}); added++;
      }
    }
  }catch(err){ console.error(err); toast('Не получилось обработать файл: '+err.message); }
  visualState.busy = false; setShotStatus('');
  if(added){ dbSave('visualShotImages', images); dbSave('visualShots', shots); toast('Добавлено скриншотов: '+added); }
  router();
}
function loadImageFromFile(file){
  return new Promise((resolve, reject)=>{
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = ()=>{ URL.revokeObjectURL(url); resolve(img); };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('это не похоже на изображение')); };
    img.src = url;
  });
}
function drawScaled(src, maxW, maxH){
  const sw = src.videoWidth || src.naturalWidth || src.width, sh = src.videoHeight || src.naturalHeight || src.height;
  const k = Math.min(1, maxW/sw, maxH/sh);
  const c = document.createElement('canvas'); c.width = Math.round(sw*k); c.height = Math.round(sh*k);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  return c;
}
// Samples a frame every `step` seconds and keeps it only if it differs enough from the last
// kept frame (compared on a tiny grayscale copy) — scrolling/idle stretches don't flood the session.
async function extractVideoFrames(file, step, onProgress){
  const url = URL.createObjectURL(file);
  const v = document.createElement('video'); v.muted = true; v.playsInline = true; v.preload = 'auto'; v.src = url;
  await new Promise((res, rej)=>{ v.onloadeddata = res; v.onerror = ()=>rej(new Error('браузер не может открыть это видео (попробуй MP4)')); });
  const duration = isFinite(v.duration) ? v.duration : 0;
  const total = Math.max(1, Math.floor(duration/step)+1);
  const tiny = document.createElement('canvas'); tiny.width = 48; tiny.height = 27; const tctx = tiny.getContext('2d', {willReadFrequently:true});
  let prev = null; const out = [];
  for(let i=0, t=0; t<=duration && out.length<150; i++, t+=step){
    v.currentTime = Math.min(t, Math.max(0, duration-0.05));
    await new Promise(res=>{ v.onseeked = res; });
    onProgress && onProgress(i+1, total);
    tctx.drawImage(v, 0, 0, 48, 27);
    const d = tctx.getImageData(0,0,48,27).data; const gray = new Float32Array(48*27);
    for(let k=0;k<gray.length;k++) gray[k] = d[k*4]*.3 + d[k*4+1]*.59 + d[k*4+2]*.11;
    let diff = 255;
    if(prev){ diff = 0; for(let k=0;k<gray.length;k++) diff += Math.abs(gray[k]-prev[k]); diff /= gray.length; }
    if(diff < 4) continue;
    prev = gray;
    const full = drawScaled(v, SHOT_MAX_W, SHOT_MAX_H);
    out.push({t, w:full.width, h:full.height, dataUrl:full.toDataURL('image/webp', .86), thumb:drawScaled(v, THUMB_W, THUMB_W*3).toDataURL('image/webp', .8)});
  }
  URL.revokeObjectURL(url);
  if(!out.length) throw new Error('не удалось достать кадры из видео');
  return out;
}

// the original-language shot shown next to this one: an explicit pick, else the one at the same position
function refShotFor(sh){
  const sess = dbGet('visualSessions', sh.sessionId);
  if(!sess || !sess.refSessionId) return null;
  const refShots = dbQuery('visualShots', x=>x.sessionId===sess.refSessionId).sort((a,b)=>(a.order||0)-(b.order||0));
  if(!refShots.length) return {list:refShots, shot:null};
  if(sh.refShotId){ const picked = refShots.find(x=>x.id===sh.refShotId); if(picked) return {list:refShots, shot:picked}; }
  const mine = dbQuery('visualShots', x=>x.sessionId===sh.sessionId).sort((a,b)=>(a.order||0)-(b.order||0));
  const idx = Math.min(mine.findIndex(x=>x.id===sh.id), refShots.length-1);
  return {list:refShots, shot:refShots[Math.max(0,idx)]};
}
function shiftRefShot(delta){

function focusViewerIssue(id){ if(!viewerState) return; viewerState.focus = viewerState.focus===id ? null : id; renderShotViewer(); }
function wireViewerDrawing(){
  const cv = document.getElementById('viewerCanvas'); if(!cv) return;
  let start = null, ghost = null;
  const pt = e=>{ const r = cv.getBoundingClientRect(); return {x:Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)), y:Math.min(1,Math.max(0,(e.clientY-r.top)/r.height))}; };
  cv.onpointerdown = e=>{
    if(e.button!==0 || e.target.closest('.vbox:not(.draft)')) return;
    e.preventDefault(); cv.setPointerCapture(e.pointerId);
    start = pt(e);
    ghost = document.createElement('div'); ghost.className = 'vbox draft'; cv.appendChild(ghost);
  };
  cv.onpointermove = e=>{
    if(!start) return; const p = pt(e);
    const b = {x:Math.min(start.x,p.x), y:Math.min(start.y,p.y), w:Math.abs(p.x-start.x), h:Math.abs(p.y-start.y)};
    Object.assign(ghost.style, {left:b.x*100+'%', top:b.y*100+'%', width:b.w*100+'%', height:b.h*100+'%'});
  };
  cv.onpointerup = e=>{
    if(!start) return; const p = pt(e); const r = cv.getBoundingClientRect();
    const b = {x:Math.min(start.x,p.x), y:Math.min(start.y,p.y), w:Math.abs(p.x-start.x), h:Math.abs(p.y-start.y)};
    start = null;
    if(b.w*r.width < 8 || b.h*r.height < 8){ ghost.remove(); return; }
    viewerState.draft = {box:b}; viewerState.focus = null;
    renderShotViewer();
    setTimeout(()=>{ const t = document.getElementById('vdText'); if(t) t.focus(); }, 30);
  };
}

// finds .po rows of the session's project+language whose text matches what's visible on screen
function findRowsByScreenText(projectId, languageCode, text, limit){
  const q = (text||'').toLowerCase().replace(/\s+/g,' ').trim();
  if(q.length < 2) return [];
  const rows = dbQuery('rows', r=>r.projectId===projectId && (r.languageCode||'').toLowerCase()===(languageCode||'').toLowerCase());
  const scored = [];
  rows.forEach(r=>{
    const t = (r.target||'').toLowerCase().replace(/\s+/g,' ').trim(), s = (r.source||'').toLowerCase().replace(/\s+/g,' ').trim();
    let score = 0;
    if(t===q) score = 100; else if(t.includes(q)) score = 80 - Math.min(40, (t.length-q.length)/4); else if(q.includes(t) && t.length>3) score = 60 - Math.min(30,(q.length-t.length)/4);
    else if(s.includes(q)) score = 40;
    if(score>0) scored.push({r, score});
  });
  return scored.sort((a,b)=>b.score-a.score).slice(0, limit||5).map(x=>x.r);
}

async function deleteShot(shotId){

  const snap = snapshotTables(['visualShots','visualShotImages','issues']);
  const sh = dbGet('visualShots', shotId);
  const siblings = dbQuery('visualShots', x=>x.sessionId===sh.sessionId).sort((a,b)=>(a.order||0)-(b.order||0));
  const idx = siblings.findIndex(x=>x.id===shotId);
  dbRemove('visualShotImages', shotId); dbRemove('visualShots', shotId);

}

async function runSessionSummary(sessionId){
  const cfg = getSettings();
  if(!cfg.aiEnabled || !cfg.aiEndpointUrl){ runVisualAI(sessionId); return; } // shows the "connect AI" explanation
  const s = dbGet('visualSessions', sessionId);
  const shots = dbQuery('visualShots', x=>x.sessionId===sessionId);
  const issues = dbQuery('issues', i=>i.visual && i.sessionId===sessionId);
  if(!issues.length){ toast('В сессии пока нет проблем — сначала разметь скриншоты или запусти ИИ-проверку'); return; }
  toast('ИИ готовит вывод по странице…');
  try{
    const res = await fetch(cfg.aiEndpointUrl, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({mode:'summary', model:cfg.aiModel||'', token:cfg.aiToken||'', language:s.languageCode, languageName:languageLabel(s.languageCode), page:s.name, shots:shots.length,
        findings: issues.map(i=>({type:i.type, severity:i.severity, text:i.text, found:i.highlightText||'', expected:i.expectedText||'', status:i.status, screen:(dbGet('visualShots', i.shotId)||{}).name||''}))})});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    s.aiSummary = {summary:data.summary||'', priorities:data.priorities||[], verdict:data.verdict||'', at:nowISO(), issueCount:issues.length};
    dbUpsert('visualSessions', s);
    toast('ИИ-вывод готов'); router();
  }catch(err){ toast('Не получилось получить вывод: '+err.message); }
}
/* ---------- shareable report ----------
   Screenshots live only in this browser, so the way to show a session to the team is a single
   self-contained HTML file: summary, then every screenshot with its numbered boxes and problems. */
function downloadVisualReport(sessionId){
  const s = dbGet('visualSessions', sessionId); if(!s) return;

  const issues = dbQuery('issues', i=>i.visual && i.sessionId===sessionId);
  const sevOrder = ['Критическая','Высокая','Средняя','Низкая'];

  const sevBg = {'Критическая':'#FDECEA','Высокая':'#FEEFE3','Средняя':'#FDF4D8','Низкая':'#F1EDF5'};
  const boxColor = {'Критическая':'#EF4444','Высокая':'#F97316','Средняя':'#EAB308','Низкая':'#A78BFA'};
  const e = esc;
  const bySev = sevOrder.map(v=>[v, issues.filter(i=>i.severity===v).length]).filter(x=>x[1]);
  const byType = {}; issues.forEach(i=>byType[i.type]=(byType[i.type]||0)+1);

    return `<section class="shot">
      <h2>${e(sh.name)}</h2>
      ${refShot && refShot.shot ? `<div class="pair"><figure><figcaption>Оригинал · ${e(languageLabel(ref.languageCode))}</figcaption><div class="canvas"><img src="${shotImage(refShot.shot.id)}" alt=""></div></figure><figure><figcaption>Перевод · ${e(languageLabel(s.languageCode))}</figcaption>${img}</figure></div>` : img}
      <ol class="issues">${si.map(i=>{ const r = i.rowId ? dbGet('rows', i.rowId) : null; return `<li>
        <div class="line">${pill(i.severity)}<span class="type">${e(i.type)}</span><span class="status">${e(i.status)}</span></div>
        <div class="text">${e(i.text)}</div>
        ${i.highlightText?(i.expectedText?`<div class="fe"><s>${e(i.highlightText)}</s> → <ins>${e(i.expectedText)}</ins></div>`:`<div class="fe">На экране: «${e(i.highlightText)}»</div>`):''}
        ${r?`<div class="key">Строка: <code>${e(r.key||r.id)}</code></div>`:''}
      </li>`; }).join('')}</ol>
    </section>`;
  };

<title>LQA · ${e(s.name)} · ${e(s.languageCode)}</title>
<style>

  const blob = new Blob([html], {type:'text/html;charset=utf-8'});

/* ---------- AI check of screenshots ----------
   Uses the same backend URL as the text AI check. Request (one screenshot per call):
     {mode:'visual', model, image:'data:image/webp;base64,…', language, languageName, page, pageUrl, glossary:[{term,approved}]}
   Expected response:
     {findings:[{type, severity, text, found, expected, box:{x,y,w,h}}]}   — box in 0..1 of the image
   The backend needs a model that accepts images. */
const VISUAL_AI_PROMPT_HINT = 'Найди проблемы локализации на скриншоте интерфейса: обрезанный или не помещающийся текст, непереведённый текст, смешение языков/алфавитов, видимые переменные/теги/ключи, неверные форматы чисел/дат/валют, склонения, битые символы, поломанная вёрстка, нарушения глоссария.';
async function runVisualAI(sessionId, shotIds){
  const s = getSettings();
  if(!s.aiEnabled || !s.aiEndpointUrl){
    openModal(`<h3>ИИ-проверка ещё не подключена</h3>
      <div class="hint" style="margin-top:8px;font-size:14px;line-height:1.6;">Когда подключишь модель, которая понимает изображения, укажи адрес backend в Настройках → «Проверка ИИ» и включи его. Платформа будет отправлять каждый скриншот и получать список проблем с координатами — они появятся рамками на скриншотах и в общей таблице проблем.</div>
      <div class="hint" style="font-size:13px;">Пока можно размечать проблемы вручную: открой скриншот и выдели место мышью.</div>
      <div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Понятно</button><button class="btn" onclick="closeModal();location.hash='#/settings'">Открыть настройки</button></div>`);
    return;
  }
  const sess = dbGet('visualSessions', sessionId);
  const shots = (shotIds ? shotIds.map(id=>dbGet('visualShots', id)) : dbQuery('visualShots', x=>x.sessionId===sessionId)).filter(Boolean);
  const glossaryIds = dbQuery('glossaries', g=>!g.projectId || g.projectId===sess.projectId).map(g=>g.id);
  const glossary = dbQuery('glossaryTerms', t=>glossaryIds.includes(t.glossaryId) && (!t.language || t.language.toLowerCase()===sess.languageCode.toLowerCase())).slice(0,300).map(t=>({term:t.term, approved:t.approved}));
  let created = 0, failed = 0, done = 0;
  toast('ИИ проверяет скриншоты: '+shots.length+'…');
  for(const sh of shots){
    setShotStatus(`ИИ: ${done+1} из ${shots.length}…`);
    try{
      const res = await fetch(s.aiEndpointUrl, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify({mode:'visual', model:s.aiModel || '', token:s.aiToken || '', instructions:VISUAL_AI_PROMPT_HINT, image:shotImage(sh.id), language:sess.languageCode, languageName:languageLabel(sess.languageCode), page:sess.name, pageUrl:sess.pageUrl||'', glossary})});
      if(!res.ok) throw new Error('HTTP '+res.status);
      const data = await res.json();
      if(data.error) throw new Error(data.error);
      const issues = dbList('issues').filter(i=>!(i.shotId===sh.id && i.status==='Новая' && (i.history||[]).length===1 && (i.history[0].action||'').includes('по скриншоту')));
      (data.findings||[]).forEach(f=>{
        const b = f.box || {};
        const box = [b.x,b.y,b.w,b.h].every(v=>typeof v==='number') ? {x:Math.max(0,Math.min(1,b.x)), y:Math.max(0,Math.min(1,b.y)), w:Math.max(.005,Math.min(1,b.w)), h:Math.max(.005,Math.min(1,b.h))} : null;
        const row = f.found ? findRowsByScreenText(sess.projectId, sess.languageCode, f.found, 1)[0] : null;
        issues.push({id:uid(), visual:true, manual:true, sessionId, shotId:sh.id, box, projectId:sess.projectId, componentId:row?row.componentId:null, rowId:row?row.id:null, languageCode:sess.languageCode,
          type: VISUAL_TYPES.includes(f.type) ? f.type : 'Другое', severity: AI_SEVERITIES.includes(f.severity) ? f.severity : 'Средняя',
          text: f.text || 'Найдено ИИ', highlightText: f.found || null, expectedText: f.expected || null, aiExplanation: f.text || null,
          status:'Новая', createdAt:nowISO(), history:[{ts:nowISO(), action:'Обнаружена (ИИ по скриншоту)'}]});
        created++;
      });
      dbSave('issues', issues);
      sh.aiCheckedAt = nowISO(); dbUpsert('visualShots', sh);
    }catch(err){ failed++; console.error(err); if(failed===1) toast('Ошибка ИИ-проверки: '+err.message); if(failed>=3) break; }
    done++;
  }
  setShotStatus('');
  toast(`ИИ-проверка завершена: ${done} скриншотов, новых проблем ${created}${failed?', ошибок '+failed:''}`);
  router();
}

/* =========================================================
   KEYBOARD REVIEW — move through the issues/strings table and decide without the mouse
   ↑/↓ or J/K select · Enter open · X tick · A accept · R reject · F false positive · ? help
   ========================================================= */
let kbFocusId = null;
let currentDetailIssueId = null;
function kbRows(){ return [...document.querySelectorAll('#content tr[data-id]')]; }
function kbApplyFocus(scroll){
  const rows = kbRows();
  rows.forEach(tr=>tr.classList.toggle('kb-focus', tr.dataset.id===kbFocusId));
  const el = rows.find(tr=>tr.dataset.id===kbFocusId);
  if(el && scroll) el.scrollIntoView({block:'nearest', behavior:'smooth'});
  return el;
}
function kbMove(delta){
  const rows = kbRows(); if(!rows.length) return null;
  let idx = rows.findIndex(tr=>tr.dataset.id===kbFocusId);
  idx = idx<0 ? (delta>0?0:rows.length-1) : Math.max(0, Math.min(rows.length-1, idx+delta));
  kbFocusId = rows[idx].dataset.id;
  return kbApplyFocus(true);
}
function kbOpen(tr){
  if(!tr) return;
  if(tr.dataset.kind==='row') openRowDetail(tr.dataset.id); else openIssueDetail(tr.dataset.id);
}
function kbNextIssueAfter(id){
  const rows = kbRows().filter(tr=>tr.dataset.kind!=='row');
  const i = rows.findIndex(tr=>tr.dataset.id===id);
  return i>=0 && rows[i+1] ? rows[i+1].dataset.id : null;
}
function kbDecide(action){
  const id = currentDetailIssueId && document.getElementById('detailPanel').classList.contains('open') ? currentDetailIssueId
    : (kbRows().find(tr=>tr.dataset.id===kbFocusId && tr.dataset.kind!=='row')||{}).dataset?.id;
  if(!id) return;
  const i = dbGet('issues', id); if(!i) return;
  const openNow = i.status==='Новая' || i.status==='На проверке';
  if(!openNow){ toast('По этой проблеме уже есть решение: '+i.status); return; }
  if(action!=='Ложное срабатывание' && i.status!=='На проверке'){ toast('Подтвердить или опровергнуть можно после «Отправить на проверку». Ложное срабатывание — клавиша F'); return; }
  const next = kbNextIssueAfter(id);
  const panelWasOpen = document.getElementById('detailPanel').classList.contains('open');
  decideIssue(id, action);
  kbFocusId = next || id;
  setTimeout(()=>{ kbApplyFocus(true); if(panelWasOpen && next) openIssueDetail(next); }, 30);
}
function kbToggleTick(){
  const tr = kbRows().find(tr=>tr.dataset.id===kbFocusId); if(!tr) return;
  const cb = tr.querySelector('input[type=checkbox]'); if(!cb) return;
  cb.checked = !cb.checked; cb.dispatchEvent(new Event('change', {bubbles:true}));
}
function showShortcutsHelp(){
  const k = (keys, what)=>`<div class="kb-line"><span>${keys.map(x=>`<kbd>${x}</kbd>`).join(' ')}</span><span>${what}</span></div>`;
  uiDialog(`<h3>Горячие клавиши</h3>
    <div class="kb-help">
      <div class="section-label" style="margin-top:6px;">Таблица проблем и строк</div>
      ${k(['↑','↓'],'выбрать строку (или J / K)')}${k(['Enter'],'открыть карточку')}${k(['X'],'отметить галочкой')}
      <div class="section-label">Решение по проблеме</div>
      ${k(['A'],'подтвердить (для проблем «На проверке»)')}${k(['R'],'опровергнуть')}${k(['F'],'ложное срабатывание')}
      <div class="hint" style="margin:2px 0 0;">После решения сразу открывается следующая проблема.</div>
      <div class="section-label">Везде</div>
      ${k(['⌘','K'],'поиск (Ctrl+K в Windows)')}${k(['Esc'],'закрыть окно или карточку')}${k(['?'],'эта подсказка')}
      <div class="section-label">Просмотр скриншота</div>
      ${k(['←','→'],'соседний скриншот')}${k(['C'],'сравнить с оригиналом')}
    </div>
    <div class="modal-actions"><button class="btn secondary" data-tour>Показать тур по платформе</button><button class="btn" data-ok>Понятно</button></div>`, (root, close)=>{ root.querySelector('[data-ok]').onclick = ()=>close(true); root.querySelector('[data-tour]').onclick = ()=>{ close(true); startTour(); }; });
}
document.addEventListener('keydown', e=>{
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  const t = e.target || {};
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName||'') || t.isContentEditable) return;
  if(tourStep>=0){ if(e.key==='Escape') endTour(); else if(e.key==='ArrowRight'||e.key==='Enter'){ tourStep++; renderTour(); } else if(e.key==='ArrowLeft' && tourStep>0){ tourStep--; renderTour(); } return; }
  if(document.getElementById('dialogRoot')?.children.length || document.getElementById('shotViewer') || document.getElementById('modalRoot').children.length) return;
  const panelOpen = document.getElementById('detailPanel').classList.contains('open');
  const k = e.key, lower = (k||'').toLowerCase();
  if(k==='?'){ e.preventDefault(); showShortcutsHelp(); return; }
  if(k==='Escape' && panelOpen){ closeDetailPanel(); return; }
  if(!kbRows().length && !panelOpen) return;
  // letters also work in Russian layout (a=ф, r=к, f=а, x=ч, j=о, k=л)
  const is = (en, ru)=> lower===en || lower===ru;
  if(k==='ArrowDown' || is('j','о')){ e.preventDefault(); const tr = kbMove(1); if(panelOpen && tr && tr.dataset.kind!=='row') openIssueDetail(tr.dataset.id); return; }
  if(k==='ArrowUp' || is('k','л')){ e.preventDefault(); const tr = kbMove(-1); if(panelOpen && tr && tr.dataset.kind!=='row') openIssueDetail(tr.dataset.id); return; }
  if(k==='Enter' && !panelOpen){ const tr = kbApplyFocus(false); if(tr){ e.preventDefault(); kbOpen(tr); } return; }
  if(is('x','ч')){ e.preventDefault(); kbToggleTick(); return; }
  if(is('a','ф')){ e.preventDefault(); kbDecide('Подтвердить'); return; }
  if(is('r','к')){ e.preventDefault(); kbDecide('Опровергнуть'); return; }
  if(is('f','а')){ e.preventDefault(); kbDecide('Ложное срабатывание'); return; }
});
function kbHintHtml(){
  return `<div class="kb-hint"><span><kbd>↑</kbd><kbd>↓</kbd> выбрать</span><span><kbd>Enter</kbd> открыть</span><span><kbd>F</kbd> ложное срабатывание</span><span><kbd>A</kbd>/<kbd>R</kbd> подтвердить / опровергнуть</span><a href="javascript:void(0)" onclick="showShortcutsHelp()">все клавиши <kbd>?</kbd></a></div>`;
}

/* =========================================================
   MY TASKS — "who am I" is a per-browser choice; the page gathers what's on me
   ========================================================= */
const ME_KEY = 'lqa_me';
function getMe(){ try{ return localStorage.getItem(ME_KEY) || ''; }catch(e){ return ''; } }
function sameName(a, b){ return (a||'').trim().toLowerCase() === (b||'').trim().toLowerCase() && !!(a||'').trim(); }
function allPeople(){
  const set = new Set([...MANAGERS, ...EDITORS, ...Object.values(EDITORS_BY_LANGUAGE).flat()]);
  dbList('issues').forEach(i=>{ if(i.assignedTo) set.add(i.assignedTo); });
  return [...set].sort((a,b)=>a.localeCompare(b,'ru'));
}
function initialsOf(name){ const p = (name||'').trim().split(/\s+/); return ((p[0]||'')[0]||'') + ((p[1]||'')[0]||''); }
function renderMeAvatar(){
  const el = document.getElementById('meAvatar'); if(!el) return;
  const me = getMe();
  el.textContent = me ? initialsOf(me).toUpperCase() : '?';
  el.title = me ? me+' — сменить' : 'Кто ты? Выбери себя, чтобы видеть свои задачи';
  el.style.background = me ? `linear-gradient(135deg,${folderColor(me)},${folderColor(me+'x')})` : '';
}
const ROLE_KEY = 'lqa_role';
function getRole(){ try{ return localStorage.getItem(ROLE_KEY) || ''; }catch(e){ return ''; } }
function peopleByRole(){
  const editorsByLang = Object.entries(EDITORS_BY_LANGUAGE).map(([code, list])=>({label:'Редакторы · '+languageLabel(code), names:list}));
  return {
    manager: [{label:'Менеджеры', names:MANAGERS}],
    editor: [{label:'Редакторы', names:EDITORS}].concat(editorsByLang),
  };
}
function roleOf(name){
  if(MANAGERS.some(m=>sameName(m, name))) return 'manager';
  if(EDITORS.concat(Object.values(EDITORS_BY_LANGUAGE).flat()).some(m=>sameName(m, name))) return 'editor';
  return 'other';
}
const ROLE_LABELS = {manager:'Менеджер', editor:'Редактор', other:'Другое'};
function openWhoAmI(){
  const me = getMe();
  let role = getRole() || (me ? roleOf(me) : 'manager');
  const groups = peopleByRole();
  const listHtml = (r, q)=>{
    if(r==='other') return `<label class="field" style="margin-top:4px;">Имя<input type="text" id="meOther" value="${esc(me && roleOf(me)==='other'?me:'')}" placeholder="Как тебя подписывать"></label>`;
    const ql = (q||'').trim().toLowerCase();
    return groups[r].map(g=>{ const names = g.names.filter(n=>!ql || n.toLowerCase().includes(ql)); if(!names.length) return '';
      return `<div class="section-label" style="margin:12px 0 6px;">${esc(g.label)}</div><div class="people">${names.map(n=>`<button type="button" class="person ${sameName(n,me)?'on':''}" data-name="${esc(n)}"><span class="bubble-ava" style="background:${folderColor(n)}">${esc(initialsOf(n).toUpperCase())}</span>${esc(n)}</button>`).join('')}</div>`; }).join('') || '<div class="hint">Никого не нашлось</div>';
  };
  uiDialog(`<h3>Кто ты?</h3><div class="dialog-text">Нужно только этому браузеру: по имени платформа соберёт твои задачи и подпишет комментарии.</div>

function isOverdue(d){ return d && d.type==='date' && d.date && new Date(d.date) < new Date(new Date().toDateString()); }

}

/* =========================================================
   FILE VERSIONS — a re-upload of the same file (project + folder + language + name) replaces the
   previous version. Problems are matched by a fingerprint, so decisions survive: a false positive
   stays a false positive, an open problem keeps its assignee, deadline, age and history.
   ========================================================= */
function previousVersionOf(projectId, componentId, languageCode, filename){
  return dbList('files').filter(f=>f.projectId===projectId && f.componentId===componentId && f.languageCode===languageCode && f.filename===filename && !f.supersededBy)
    .sort((a,b)=>new Date(b.uploadedAt)-new Date(a.uploadedAt))[0] || null;
}
function rowIdentity(r){ return (r.key||'')+'\u0001'+(r.key ? '' : r.source||''); }
function issueFingerprint(i, row){ return rowIdentity(row)+'\u0001'+i.type+'\u0001'+(i.highlightText||''); }
function rowsQuality(rowIds){
  const set = new Set(rowIds); if(!set.size) return null;
  const bad = new Set(dbList('issues').filter(i=>isOpenIssue(i) && set.has(i.rowId)).map(i=>i.rowId));
  return 1 - bad.size/set.size;
}
function reconcileVersions(pairs){
  const out = {};
  if(!pairs.length) return out;
  const rowsById = {}; dbList('rows').forEach(r=>rowsById[r.id]=r);
  let issues = dbList('issues');
  const dropRows = new Set(), dropIssues = new Set(), rowUpdates = {};
  pairs.forEach(({prev, next})=>{
    const prevRows = dbList('rows').filter(r=>r.fileId===prev.id), nextRows = dbList('rows').filter(r=>r.fileId===next.id);
    const prevRowIds = new Set(prevRows.map(r=>r.id)), nextRowIds = new Set(nextRows.map(r=>r.id));
    const nextByIdentity = {}; nextRows.forEach(r=>nextByIdentity[rowIdentity(r)] = r);
    const prevAuto = issues.filter(i=>prevRowIds.has(i.rowId) && !i.visual && !i.manual);
    const prevByFp = {}; prevAuto.forEach(i=>{ prevByFp[issueFingerprint(i, rowsById[i.rowId])] = i; });
    const seen = new Set();
    const st = {fixed:0, added:0, kept:0, carriedDecisions:0, regressions:0, old:0};
    issues.forEach(i=>{
      if(!nextRowIds.has(i.rowId) || i.visual || i.manual) return;
      const fp = issueFingerprint(i, rowsById[i.rowId]);
      const old = prevByFp[fp];
      if(!old){ st.added++; return; }
      seen.add(fp); st.kept++;
      const note = {ts:nowISO()};
      if(old.status==='Ложное срабатывание' || old.status==='Отклонена'){
        i.status = old.status; st.carriedDecisions++;
        i.history = (old.history||[]).concat([Object.assign(note, {action:'Решение «'+old.status+'» перенесено с прошлой версии файла'})]);
      } else if(old.status==='Принята' || old.status==='Принята после исправления'){
        st.regressions++;
        i.history = (old.history||[]).concat([Object.assign(note, {action:'Снова найдена в новой версии файла (раньше: «'+old.status+'»)'})]);
      } else {
        i.status = old.status; i.assignedTo = old.assignedTo || null; i.deadline = old.deadline || null; i.createdAt = old.createdAt;
        i.history = (old.history||[]).concat([Object.assign(note, {action:'Повторяется в новой версии файла'})]);
        if(Date.now() - +new Date(old.createdAt) > 14*864e5) st.old++;
      }
    });
    prevAuto.forEach(i=>{ if(!seen.has(issueFingerprint(i, rowsById[i.rowId])) && isOpenIssue(i)) st.fixed++; });
    // manual and screenshot problems follow their string to the new version (copies, so an undo snapshot stays intact)
    issues = issues.map(i=>{
      if(!prevRowIds.has(i.rowId)) return i;
      if(i.visual || i.manual){ const nr = nextByIdentity[rowIdentity(rowsById[i.rowId])]; return Object.assign({}, i, {rowId: nr ? nr.id : null}, nr ? {componentId:nr.componentId} : {}); }
      dropIssues.add(i.id); return i;
    });
    // string history: the new row inherits the old row's history, plus an entry when the text changed
    const prevByIdentity = {}; prevRows.forEach(r=>prevByIdentity[rowIdentity(r)] = r);
    nextRows.forEach(nr=>{
      const pr = prevByIdentity[rowIdentity(nr)]; if(!pr) return;
      let hist = (pr.targetHistory||[]).slice();
      if(pr.target!==nr.target || pr.source!==nr.source) hist.push({ts:next.uploadedAt||nowISO(), how:'upload', from:pr.target, to:nr.target, sourceFrom: pr.source!==nr.source ? pr.source : undefined, file:next.filename, prevFile:prev.filename, by:next.uploadedBy||null});
      if(hist.length){ rowUpdates[nr.id] = Object.assign({}, rowsById[nr.id]||nr, {targetHistory: hist.slice(-ROW_HISTORY_MAX), firstSeenAt: pr.firstSeenAt||prev.uploadedAt||null}); }
      else if(pr.firstSeenAt || prev.uploadedAt) rowUpdates[nr.id] = Object.assign({}, rowsById[nr.id]||nr, {firstSeenAt: pr.firstSeenAt||prev.uploadedAt});
    });
    prevRowIds.forEach(id=>dropRows.add(id));
    dbUpsert('files', Object.assign({}, prev, {supersededBy: next.id}));
    const key = next.componentId+'|'+next.languageCode;
    const acc = out[key] = out[key] || {fixed:0, added:0, kept:0, carriedDecisions:0, regressions:0, old:0, files:[]};
    Object.keys(st).forEach(k=>acc[k]+=st[k]); acc.files.push(next.filename);
  });
  dbSave('issues', issues.filter(i=>!dropIssues.has(i.id)));
  dbSave('rows', dbList('rows').filter(r=>!dropRows.has(r.id)).map(r=>rowUpdates[r.id]||r));
  return out;
}
function versionSummaryText(d){
  const parts = [];
  if(d.fixed) parts.push('исправлено '+d.fixed);
  if(d.added) parts.push('новых '+d.added);
  if(d.kept) parts.push('осталось '+d.kept+(d.old?' (из них '+d.old+' дольше 2 недель)':''));
  if(d.carriedDecisions) parts.push('решений перенесено '+d.carriedDecisions);
  if(d.regressions) parts.push('вернулись после «принята» '+d.regressions);
  return parts.join(' · ') || 'без изменений';
}
function runChangeHtml(r){
  const d = r.versionDiff; if(!d) return '<span class="hint" style="margin:0;">первая версия</span>';
  return `<span class="chg">${d.fixed?`<span class="chg-fix" title="исправлено">−${d.fixed}</span>`:''}${d.added?`<span class="chg-new" title="новых">+${d.added}</span>`:''}<span class="chg-keep" title="осталось">${d.kept}</span>${d.carriedDecisions?`<span class="hint" style="margin:0;" title="решений перенесено">↻${d.carriedDecisions}</span>`:''}</span>`;
}
// quality over time per language from run records (only runs that stored a quality value)
function qualityTrendChart(runs){
  const byLang = {};
  runs.filter(r=>typeof r.quality==='number').sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt)).forEach(r=>{ (byLang[r.languageCode] = byLang[r.languageCode]||[]).push(r); });
  const langs = Object.keys(byLang).filter(l=>byLang[l].length);
  if(!langs.length) return '';
  const all = runs.filter(r=>typeof r.quality==='number');
  const t0 = Math.min(...all.map(r=>+new Date(r.createdAt))), t1 = Math.max(...all.map(r=>+new Date(r.createdAt)));
  const W = 1000, H = 220, pl = 40, pr = 12, pt = 10, pb = 12;
  const minQ = Math.max(0, Math.floor(Math.min(...all.map(r=>r.quality))*10)/10 - .05);
  const x = t=> t1===t0 ? pl+(W-pl-pr)/2 : pl + (t-t0)/(t1-t0)*(W-pl-pr);
  const y = q=> pt + (1-(q-minQ)/(1-minQ))*(H-pt-pb);
  const palette = ['#9A139E','#2563EB','#059669','#D97706','#DC2626','#7C3AED','#0891B2','#DB2777'];
  const grid = [0,.25,.5,.75,1].map(k=>{ const q = minQ + (1-minQ)*k; return `<line x1="${pl}" x2="${W-pr}" y1="${y(q)}" y2="${y(q)}" stroke="var(--border)"/><text x="${pl-6}" y="${y(q)+4}" text-anchor="end" font-size="10" fill="var(--text-faint)">${Math.round(q*100)}%</text>`; }).join('');
  const lines = langs.map((l,n)=>{ const c = palette[n%palette.length]; const pts = byLang[l].map(r=>[x(+new Date(r.createdAt)), y(r.quality)]);
    return `<polyline points="${pts.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="${c}"><title>${esc(languageLabel(l))}</title></circle>`).join('')}`; }).join('');
  const legend = langs.map((l,n)=>`<span><i style="background:${palette[n%palette.length]}"></i>${languageFlag(l)} ${esc(l)} ${Math.round(byLang[l][byLang[l].length-1].quality*100)}%</span>`).join('');
  return `<div class="card"><h3>Качество по языкам во времени</h3><div class="hint" style="margin:-8px 0 10px;">Доля строк без открытых проблем после каждой загрузки</div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;">${grid}${lines}</svg><div class="trend-legend">${legend}</div></div>`;
}

/* =========================================================
   TRANSLATION MEMORY — how the same source text is already translated into the same language.
   A variant counts as "approved" when it came from an accepted fix or its string has no open
   problems; approved variants are offered first.
   ========================================================= */
function normText(t){ return String(t||'').replace(/\s+/g,' ').trim().toLowerCase(); }
function tmVariants(source, languageCode, excludeRowId){
  const src = normText(source); if(!src) return [];
  const openRows = new Set(dbList('issues').filter(i=>isOpenIssue(i) && i.rowId).map(i=>i.rowId));
  const fixedTargets = new Set();
  dbList('issues').forEach(i=>{ if(i.status==='Принята после исправления') (i.history||[]).forEach(h=>{ if(h.newTarget) fixedTargets.add(normText(h.newTarget)); }); });
  const by = {};
  dbList('rows').forEach(r=>{
    if(r.id===excludeRowId || r.languageCode!==languageCode || normText(r.source)!==src || !String(r.target||'').trim()) return;
    const k = normText(r.target);
    const v = by[k] = by[k] || {text:r.target, count:0, clean:0, fixed:fixedTargets.has(k), keys:new Set()};
    v.count++; if(!openRows.has(r.id)) v.clean++; if(r.key) v.keys.add(r.key);
  });
  return Object.values(by).map(v=>Object.assign(v, {approved: v.fixed || v.clean>0}))
    .sort((a,b)=> (b.fixed-a.fixed) || (b.approved-a.approved) || b.count-a.count);
}
function tmSuggestionsHtml(r, targetInputId){
  const vars = tmVariants(r.source, r.languageCode, r.id).filter(v=>normText(v.text)!==normText(r.target));
  if(!vars.length) return '';
  return `<div class="tm"><div class="hint" style="margin:0 0 6px;">Как этот текст переведён в других местах (${esc(r.languageCode)}):</div>
    ${vars.slice(0,5).map(v=>`<button type="button" class="tm-item" data-v="${esc(v.text)}" onclick="document.getElementById('${targetInputId}').value=this.dataset.v">
      <span class="mono">${esc(v.text)}</span><span class="tm-meta">${v.fixed?'<b style="color:var(--ok)">исправлено и принято</b> · ':v.approved?'<span style="color:var(--ok)">без проблем</span> · ':''}${v.count} ${plural(v.count,'раз','раза','раз')}</span></button>`).join('')}</div>`;
}
function tmRowHtml(r){
  const vars = tmVariants(r.source, r.languageCode, null);
  if(vars.length<2) return '';
  return `<div><div class="hint">Этот исходный текст переведён на ${esc(r.languageCode)} по-разному · ${vars.length} ${plural(vars.length,'вариант','варианта','вариантов')}</div>
    <div class="plural-forms">${vars.slice(0,6).map(v=>`<div><span>${v.count}</span><div class="mono">${esc(v.text)}${v.approved?' <span style="color:var(--ok);font-family:Inter,sans-serif;font-size:12px;">✓</span>':''}</div></div>`).join('')}</div></div>`;
}

/* ---------- glossary candidates ----------
   Short source phrases that are translated in several different ways within one language are
   exactly what a glossary should pin down. */
function glossaryCandidates(languageCode){
  const inGlossary = new Set();
  const gIds = new Set(dbList('glossaries').filter(g=>!g.language || g.language===languageCode).map(g=>g.id));
  dbList('glossaryTerms').forEach(t=>{ if(gIds.has(t.glossaryId)) inGlossary.add(normText(t.term)); });
  const dismissed = new Set((getSettings().glossaryDismissed||[]).filter(x=>x.lang===languageCode).map(x=>x.term));
  const by = {};
  dbList('rows').forEach(r=>{
    if(r.languageCode!==languageCode) return;
    const src = normText(visibleText(r.source));
    if(!src || src.length>40 || src.split(' ').length>4 || !/\p{L}{3}/u.test(src) || !String(r.target||'').trim()) return;
    if(inGlossary.has(src) || dismissed.has(src)) return;
    const g = by[src] = by[src] || {term:r.source.trim(), key:src, rows:0, variants:{}};
    g.rows++; const t = normText(r.target); g.variants[t] = g.variants[t] || {text:r.target.trim(), count:0}; g.variants[t].count++;
  });
  return Object.values(by).filter(g=>g.rows>=2 && Object.keys(g.variants).length>=2)
    .map(g=>Object.assign(g, {list:Object.values(g.variants).sort((a,b)=>b.count-a.count)}))
    .sort((a,b)=> b.list.length-a.list.length || b.rows-a.rows).slice(0,40);
}
let glossaryCandLang = null;
function glossaryCandidatesHtml(){
  const langs = [...new Set(dbList('rows').map(r=>r.languageCode).filter(Boolean))];
  if(!langs.length) return '';
  const counts = {}; langs.forEach(l=>counts[l] = glossaryCandidates(l).length);
  const withAny = langs.filter(l=>counts[l]).sort((a,b)=>counts[b]-counts[a]);
  if(!withAny.length) return '';
  if(!glossaryCandLang || !counts[glossaryCandLang]) glossaryCandLang = withAny[0];
  const list = glossaryCandidates(glossaryCandLang);
  return `<div class="card" style="margin-top:24px;">
    <div class="row between" style="align-items:flex-start;"><div><h3 style="margin-bottom:4px;">Кандидаты в глоссарий</h3><div class="hint" style="margin:0;">Короткие фразы, которые в одном языке переведены по-разному. Выбери правильный вариант — он станет термином, и дальше проверка будет следить за ним.</div></div></div>
    <div class="subtabbar" style="margin:14px 0 12px;flex-wrap:wrap;">${withAny.map(l=>`<button class="subtabbtn ${l===glossaryCandLang?'active':''}" onclick="glossaryCandLang='${esc(l)}';router()">${languageFlag(l)} ${esc(l)} · ${counts[l]}</button>`).join('')}</div>
    <div class="table-wrap"><table><thead><tr><th>Исходный текст</th><th>Варианты перевода</th><th></th></tr></thead><tbody>

let tourStep = -1;
function startTour(){ tourStep = 0; renderTour(); }
function endTour(){
  tourStep = -1; try{ localStorage.setItem(TOUR_KEY, '1'); }catch(e){}
  const r = document.getElementById('tourRoot'); if(r) r.remove();
  if(window.innerWidth<=900) toggleNav(false);
}
function renderTour(){
  const step = TOUR_STEPS[tourStep]; if(!step){ endTour(); return; }
  let root = document.getElementById('tourRoot');
  if(!root){ root = document.createElement('div'); root.id = 'tourRoot'; document.body.appendChild(root); }
  const onSidebar = step.sel && step.sel.startsWith('.side-link');
  if(window.innerWidth<=900){
    const wasOpen = document.body.classList.contains('nav-open');
    toggleNav(!!onSidebar);
    // the drawer slides in; measure the target once it has arrived
    if(!!onSidebar !== wasOpen && !renderTour._waiting){ renderTour._waiting = true; root.innerHTML = '<div class="tour-dim"></div>'; setTimeout(()=>{ renderTour._waiting = false; renderTour(); }, 300); return; }
  }
  const el = step.sel ? document.querySelector(step.sel) : null;
  const r = el ? el.getBoundingClientRect() : null;
  const pad = 6;
  const spot = r ? `<div class="tour-spot" style="left:${r.left-pad}px;top:${r.top-pad}px;width:${r.width+pad*2}px;height:${r.height+pad*2}px;"></div>` : '<div class="tour-dim"></div>';
  let pos = 'left:50%;top:50%;transform:translate(-50%,-50%);';
  if(r && innerWidth<=600) pos = 'left:12px;right:12px;bottom:12px;width:auto;';
  else if(r){
    const w = 340, h = 210, right = r.right + 16, below = r.bottom + 14;
    if(right + w < innerWidth) pos = `left:${right}px;top:${Math.max(12, Math.min(innerHeight-h-12, r.top-10))}px;`;
    else pos = `left:${Math.max(12, Math.min(innerWidth-w-12, r.right-w))}px;top:${Math.min(innerHeight-h-12, below)}px;`;
  }
  root.innerHTML = `${spot}<div class="tour-card" style="${pos}" role="dialog" aria-live="polite">
    <div class="tour-count">${tourStep+1} из ${TOUR_STEPS.length}</div>
    <h3>${esc(step.title)}</h3><p>${esc(step.text)}</p>
    <div class="row between" style="margin-top:14px;flex-wrap:nowrap;">
      <button class="btn ghost sm" onclick="endTour()">Пропустить</button>
      <div class="row" style="flex-wrap:nowrap;">${tourStep?`<button class="btn secondary sm" onclick="tourStep--;renderTour()">Назад</button>`:''}<button class="btn sm" onclick="tourStep++;renderTour()">${tourStep===TOUR_STEPS.length-1?'Готово':'Дальше'}</button></div>
    </div></div>`;
}
window.addEventListener('resize', ()=>{ if(tourStep>=0) renderTour(); });
function maybeStartTour(){
  let done = false; try{ done = !!localStorage.getItem(TOUR_KEY); }catch(e){ done = true; }

}

function exportIssuesToCsv(issues){
  if(!issues.length){ toast('Нечего экспортировать'); return; }
  let csv = 'id,source,target,project,language,component,type,severity,confidence,explanation,suggestion,status,comment\n';
  const esc2 = s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';
  issues.forEach(i=>{
    const r = dbGet('rows', i.rowId); const p = dbGet('projects', i.projectId); const c = dbGet('components', i.componentId);
    const lastComment = (i.history||[]).slice().reverse().find(h=>h.comment)?.comment || '';
    csv += [esc2(i.id), esc2(r?r.source:''), esc2(r?r.target:''), esc2(p?p.name:''), esc2(i.languageCode), esc2(c?c.name:''), esc2(i.type), esc2(i.severity), esc2(i.aiConfidence), esc2(i.aiExplanation), esc2(i.aiSuggestion), esc2(i.status), esc2(lastComment)].join(',')+'\n';

  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='lqa_issues.csv'; a.click(); URL.revokeObjectURL(url);
}
function exportIssuesToXlsx(issues){
  if(!issues.length){ toast('Нечего экспортировать'); return; }
  ensureXlsx().then(ok=>{
    if(!ok){ toast('Библиотека Excel не загрузилась — используй CSV вместо этого.'); return; }
    const data = issues.map(i=>{
      const r = dbGet('rows', i.rowId); const p = dbGet('projects', i.projectId); const c = dbGet('components', i.componentId);
      return {ID:i.id, Исходный_текст:r?r.source:'', Перевод:r?r.target:'', Проект:p?p.name:'', Язык:i.languageCode, Папка:c?c.name:'', Тип:i.type, Важность:i.severity, Уверенность_ИИ:i.aiConfidence, Объяснение:i.aiExplanation, Предложение:i.aiSuggestion, Статус:i.status};

/* ---------- pseudo-localization ----------
   Swaps letters for look-alike accented ones, pads the string and brackets it, while leaving
   placeholders, tags and \n escapes untouched — so the build keeps working. */
const PSEUDO_EXPANSION = 1.35;
const PSEUDO_MAP = {a:'å',b:'ƀ',c:'ç',d:'ď',e:'é',f:'ƒ',g:'ğ',h:'ĥ',i:'ï',j:'ĵ',k:'ķ',l:'ĺ',m:'ɱ',n:'ñ',o:'ő',p:'þ',q:'ǫ',r:'ŕ',s:'š',t:'ţ',u:'ű',v:'ṽ',w:'ŵ',x:'ẋ',y:'ý',z:'ž',
  A:'Å',B:'Ɓ',C:'Ç',D:'Ď',E:'É',F:'Ƒ',G:'Ğ',H:'Ĥ',I:'Ï',J:'Ĵ',K:'Ķ',L:'Ĺ',M:'Ṁ',N:'Ñ',O:'Ő',P:'Þ',Q:'Ǫ',R:'Ŕ',S:'Š',T:'Ţ',U:'Ű',V:'Ṽ',W:'Ŵ',X:'Ẋ',Y:'Ý',Z:'Ž',
  а:'å',б:'ƀ',в:'ŵ',г:'ğ',д:'ď',е:'é',ё:'ë',ж:'ž',з:'ƶ',и:'ï',й:'ĭ',к:'ķ',л:'ĺ',м:'ɱ',н:'ñ',о:'ő',п:'þ',р:'ŕ',с:'ç',т:'ţ',у:'ű',ф:'ƒ',х:'ẋ',ц:'ċ',ч:'č',ш:'š',щ:'ŝ',ы:'ÿ',э:'ê',ю:'û',я:'ǎ',
  А:'Å',Б:'Ɓ',В:'Ŵ',Г:'Ğ',Д:'Ď',Е:'É',Ё:'Ë',Ж:'Ž',З:'Ƶ',И:'Ï',Й:'Ĭ',К:'Ķ',Л:'Ĺ',М:'Ṁ',Н:'Ñ',О:'Ő',П:'Þ',Р:'Ŕ',С:'Ç',Т:'Ţ',У:'Ű',Ф:'Ƒ',Х:'Ẋ',Ц:'Ċ',Ч:'Č',Ш:'Š',Щ:'Ŝ',Ы:'Ÿ',Э:'Ê',Ю:'Û',Я:'Ǎ'};
function pseudoLocalize(str){
  if(!str) return str;
  const protectedRe = new RegExp('('+[VAR_RE.source, TAG_RE.source, BREAK_RE.source, '\\{[^{}]*\\}', '&[a-zA-Z#0-9]+;'].join('|')+')', 'g');
  let letters = 0;
  const body = String(str).split(protectedRe).filter(x=>x!==undefined).map(part=>{
    if(protectedRe.test(part)){ protectedRe.lastIndex = 0; return part; }
    protectedRe.lastIndex = 0;
    return part.replace(/./g, ch=>{ if(PSEUDO_MAP[ch]){ letters++; return PSEUDO_MAP[ch]; } return ch; });
  }).join('');
  const pad = Math.max(2, Math.round(letters*(PSEUDO_EXPANSION-1)));
  return '['+body+' '+'~'.repeat(pad)+']';
}
function pseudoFolderOptions(projectId){
  return '<option value="">Все папки</option>' + dbQuery('components', c=>c.projectId===projectId).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
}
function downloadPseudoPo(){
  const projectId = document.getElementById('psProject').value, folderId = document.getElementById('psFolder').value;
  const seen = new Set(), rows = [];
  dbQuery('rows', r=>r.projectId===projectId && (!folderId || r.componentId===folderId)).forEach(r=>{
    const k = (r.key||'')+'\u0000'+r.source;
    if(seen.has(k)) return; seen.add(k);
    const out = {key:r.key, source:r.source, target:pseudoLocalize(r.source)};
    if(r.targetForms){ out.sourcePlural = r.sourcePlural; out.targetForms = r.targetForms.map((_,i)=>pseudoLocalize(i===0 ? r.source : (r.sourcePlural||r.source))); }
    rows.push(out);
  });
  if(!rows.length){ toast('В этой папке пока нет строк — сначала загрузи .po'); return; }
  const p = dbGet('projects', projectId), c = folderId ? dbGet('components', folderId) : null;
  downloadPoFile(generatePoFromRows(rows), 'pseudo_'+((p?p.name:'project')+(c?'_'+c.name:'')).replace(/[^\p{L}\p{N}]+/gu,'_')+'.po');
  toast('Псевдолокализация: '+rows.length+' строк');
}

// Saves the form first, then asks the backend who it is — shows provider/model or the exact error.
async function testAiBackend(){
  saveAiSettingsForm();
  const s = getSettings(), out = document.getElementById('aiPingStatus');
  if(!s.aiEndpointUrl){ out.textContent = 'Сначала вставь адрес backend'; return; }
  out.style.color = 'var(--text-faint)'; out.textContent = 'Проверяю…';
  try{
    const res = await fetch(s.aiEndpointUrl, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({mode:'ping', model:s.aiModel||'', token:s.aiToken||''})});
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    out.style.color = 'var(--ok)'; out.textContent = '✓ Работает: ' + (data.provider==='anthropic'?'Claude':data.provider==='openai'?'OpenAI':data.provider) + ', модель ' + data.model;
  }catch(err){
    out.style.color = 'var(--crit)';
    out.textContent = '✕ ' + (err.message && err.message.includes('Failed to fetch') ? 'Не удалось достучаться — проверь адрес и что доступ к Web App открыт для «Все»' : err.message);
  }
}
