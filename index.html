<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LQA — платформа проверки локализации</title>
<!-- xlsx (SheetJS) is loaded lazily on first use — see ensureXlsx() — so a blocked/stale CDN doesn't affect page load, and a newer build gets a real chance to run instead of an old cached one. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   DESIGN TOKENS
   Type scale: 12 · 13 · 14 · 16 · 20 · 26   Radii: 8 · 12 · 16
   ========================================================= */
:root{
  --bg:#F7F5FB; --bg-2:#F0ECF6; --surface:#FFFFFF; --surface-2:#FAF8FD; --input-bg:#FFFFFF;
  --border:#ECE7F3; --border-strong:#DDD4EA;
  --text:#1F1729; --text-soft:#5B4F68; --text-faint:#8E829C;
  --brand-pink:#D6169E; --brand-purple:#4A1B96; --brand-violet:#7C1FC9;
  --brand-grad:linear-gradient(135deg,#C4169F 0%,#7C1FC9 55%,#4A1B96 100%);
  --side-bg:#2A1150; --side-bg-2:#3A1672; --side-text:rgba(255,255,255,.66); --side-text-active:#FFFFFF;
  --primary:#9A139E; --primary-bg:#F6EAF7; --primary-dark:#6E1090; --focus:rgba(154,19,158,.22);
  --crit:#D92D20; --crit-bg:#FDECEA;
  --high:#C2410C; --high-bg:#FEEFE3;
  --med:#A15C07; --med-bg:#FDF4D8;
  --low:#5B4F68; --low-bg:#F1EDF5;
  --ok:#15803D; --ok-bg:#E3F6EA;
  --purple:#7C1FC9; --purple-bg:#F1E8FB;
  --mark-bg:#F6EAF7; --mark-text:#6E1090;
  --r-sm:8px; --r-md:12px; --r-lg:16px;
  --shadow-sm:0 1px 2px rgba(31,23,41,.05);
  --shadow-md:0 4px 16px rgba(31,23,41,.07), 0 1px 3px rgba(31,23,41,.05);
  --shadow-lg:0 20px 50px rgba(42,17,80,.18), 0 4px 12px rgba(42,17,80,.08);
  --glass-bg:rgba(255,255,255,.78); --glass-border:rgba(236,231,243,.9);
  --overlay:rgba(24,12,40,.36);
  --ease:cubic-bezier(.2,.8,.3,1);
}
:root[data-theme="dark"]{
  --bg:#130D1D; --bg-2:#1D1529; --surface:#1B1426; --surface-2:#211930; --input-bg:#171021;
  --border:#2D2340; --border-strong:#3C2F54;
  --text:#F2ECF8; --text-soft:#C2B3D6; --text-faint:#8C7DA3;
  --side-bg:#170D28; --side-bg-2:#22113D;
  --primary:#D07AD4; --primary-bg:#33203F; --primary-dark:#F0BDF2; --focus:rgba(208,122,212,.28);
  --crit:#F87171; --crit-bg:#3A1A1D;
  --high:#FB923C; --high-bg:#3A2213;
  --med:#FBBF24; --med-bg:#362A12;
  --low:#B7A8CC; --low-bg:#2A2238;
  --ok:#4ADE80; --ok-bg:#15301F;
  --purple:#C4A1F5; --purple-bg:#2C2045;
  --mark-bg:#3A2447; --mark-text:#F0BDF2;
  --shadow-sm:0 1px 2px rgba(0,0,0,.35);
  --shadow-md:0 4px 16px rgba(0,0,0,.35);
  --shadow-lg:0 20px 50px rgba(0,0,0,.55);
  --glass-bg:rgba(19,13,29,.78); --glass-border:rgba(255,255,255,.06);
  --overlay:rgba(0,0,0,.55);
  color-scheme:dark;
}

/* ---- base ---- */
*{box-sizing:border-box;}
html,body{margin:0;min-height:100%;}
body{background:var(--bg);color:var(--text);font:14px/1.5 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01";}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:13px;}
a{color:inherit;}
button{font-family:inherit;}
::selection{background:var(--primary-bg);color:var(--primary-dark);}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;}
.link{color:var(--primary);text-decoration:none;font-weight:500;font-size:13px;}
.link:hover{text-decoration:underline;}

/* ---- shell ---- */
.shell{display:flex;min-height:100vh;}
.sidebar{width:240px;flex:0 0 240px;background:linear-gradient(180deg,var(--side-bg-2) 0%,var(--side-bg) 100%);color:var(--side-text);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;overflow-x:hidden;z-index:40;}
.side-brand{padding:20px 18px 18px;}
.side-brand-row{display:flex;align-items:center;gap:10px;}
.side-logo{width:34px;height:34px;border-radius:10px;background:var(--brand-grad);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 14px rgba(214,22,158,.35);}
.side-logo-text{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:17px;color:#fff;letter-spacing:.01em;line-height:1.1;}
.side-tagline{font-size:12px;color:rgba(255,255,255,.5);line-height:1.3;}
.side-nav{flex:1;padding:4px 12px 12px;}
.side-group-label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.34);padding:18px 10px 6px;}
.side-group-label:first-child{padding-top:4px;}
.side-link{position:relative;display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:var(--r-sm);color:var(--side-text);text-decoration:none;font-size:14px;font-weight:500;cursor:pointer;margin-bottom:2px;transition:background .15s ease,color .15s ease;}
.side-link:hover{background:rgba(255,255,255,.06);color:#fff;}
.side-link.active{background:rgba(255,255,255,.1);color:#fff;}
.side-link.active::before{content:'';position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:linear-gradient(180deg,#F05BC4,#B06CF5);}
.side-link .ic{width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;opacity:.9;}
.side-badge-count{margin-left:auto;background:rgba(255,255,255,.14);color:#fff;font-size:12px;font-weight:600;padding:0 7px;min-width:22px;height:20px;line-height:20px;text-align:center;border-radius:99px;}
.side-foot{padding:14px 16px 16px;border-top:1px solid rgba(255,255,255,.08);}
.theme-toggle{display:flex;gap:2px;background:rgba(255,255,255,.06);border-radius:10px;padding:3px;}
.theme-toggle button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:none;border:none;color:rgba(255,255,255,.6);font-size:12px;font-weight:500;height:30px;border-radius:8px;cursor:pointer;transition:background .15s ease,color .15s ease;}
.theme-toggle button:hover{color:#fff;}
.theme-toggle button.active{background:rgba(255,255,255,.14);color:#fff;}
.side-overlay{display:none;}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{height:60px;flex:0 0 60px;background:var(--glass-bg);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);border-bottom:1px solid var(--glass-border);display:flex;align-items:center;gap:12px;padding:0 28px;position:sticky;top:0;z-index:20;}
.top-ic.menu-btn{display:none;}
.crumbs{font-size:13px;color:var(--text-faint);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.crumbs a{color:var(--text-faint);text-decoration:none;}
.crumbs a:hover{color:var(--text);}
.crumbs b{color:var(--text);font-weight:600;}
.crumbs .sep{margin:0 6px;opacity:.5;}
.top-search{position:relative;width:300px;}
.top-search .s-ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-faint);pointer-events:none;display:flex;}
.top-search input[type=text]{width:100%;height:36px;border:1px solid var(--border);border-radius:var(--r-sm);padding:0 52px 0 34px;font-size:13px;background:var(--surface-2);color:var(--text);transition:box-shadow .15s ease,border-color .15s ease,background .15s ease;}
.top-search input[type=text]:hover{border-color:var(--border-strong);}
.top-search input[type=text]:focus{outline:none;border-color:var(--primary);background:var(--surface);box-shadow:0 0 0 3px var(--focus);}
.kbd-hint{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:11px;font-weight:600;color:var(--text-faint);background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:1px 6px;pointer-events:none;}
.top-ic{position:relative;width:36px;height:36px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-soft);background:none;border:none;transition:background .15s ease,color .15s ease;flex-shrink:0;}
.top-ic:hover{background:var(--bg-2);color:var(--text);}
.top-ic .dot{position:absolute;top:7px;right:8px;width:8px;height:8px;background:var(--crit);border-radius:50%;display:none;box-shadow:0 0 0 2px var(--surface);}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--brand-grad);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0;}

.content{padding:28px 32px 64px;flex:1;width:100%;max-width:1480px;margin:0 auto;animation:pageIn .25s var(--ease);}
@keyframes pageIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:24px;flex-wrap:wrap;}
.page-title{font-size:26px;font-weight:700;margin:0 0 4px;letter-spacing:-.02em;line-height:1.2;}
.page-sub{color:var(--text-soft);font-size:14px;}
.section-label{font-size:12px;font-weight:600;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;margin:24px 0 10px;}

/* ---- project hero: brand gradient, no photo, readable in both themes ---- */
.project-hero{position:relative;background:var(--brand-grad);color:#fff;border-radius:var(--r-lg);padding:24px 28px;margin-bottom:20px;overflow:hidden;box-shadow:0 10px 30px rgba(124,31,201,.22);}
.project-hero::before{content:'';position:absolute;right:-80px;top:-120px;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 65%);pointer-events:none;}
.project-hero::after{content:'';position:absolute;right:160px;bottom:-140px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(255,120,210,.28),transparent 65%);pointer-events:none;}
.project-hero > *{position:relative;z-index:1;}
.project-hero .page-head{margin:0;align-items:flex-start;}
.project-hero .page-title{color:#fff;}
.project-hero .page-sub{color:rgba(255,255,255,.8);}
.hero-avatar{width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,.18);box-shadow:inset 0 0 0 1px rgba(255,255,255,.3);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;flex-shrink:0;backdrop-filter:blur(6px);}
.hero-chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:99px;background:rgba(255,255,255,.14);color:#fff;font-size:12px;font-weight:500;cursor:pointer;border:1px solid rgba(255,255,255,.2);transition:background .15s ease;text-decoration:none;}
.hero-chip:hover{background:rgba(255,255,255,.24);}
.hero-chip i{width:7px;height:7px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 1.5px rgba(255,255,255,.7);}
.btn.on-dark{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.28);box-shadow:none;backdrop-filter:blur(6px);}
.btn.on-dark:hover{background:rgba(255,255,255,.26);filter:none;box-shadow:none;}

/* ---- generic components ---- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:20px;margin-bottom:16px;box-shadow:var(--shadow-sm);}
.card h3{font-size:16px;margin:0 0 14px;font-weight:600;letter-spacing:-.01em;}
.card.clickable{cursor:pointer;transition:box-shadow .2s ease,border-color .2s ease,transform .2s var(--ease);}
.card.clickable:hover{border-color:var(--border-strong);box-shadow:var(--shadow-md);transform:translateY(-2px);}
.grid{display:grid;gap:16px;}
.grid-4{grid-template-columns:repeat(4,minmax(0,1fr));}
.grid-3{grid-template-columns:repeat(3,minmax(0,1fr));}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr));}
@media(max-width:1180px){.grid-4{grid-template-columns:repeat(2,minmax(0,1fr));}.grid-3{grid-template-columns:repeat(2,minmax(0,1fr));}}

.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:16px 18px;box-shadow:var(--shadow-sm);position:relative;}
.kpi .num{font-size:26px;font-weight:700;line-height:1.15;letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
.kpi .lbl{color:var(--text-soft);font-size:13px;margin-top:4px;}
.kpi.crit .num{color:var(--crit);} .kpi.high .num{color:var(--high);} .kpi.ok .num{color:var(--ok);}
.kpi.crit{box-shadow:inset 3px 0 0 var(--crit),var(--shadow-sm);} .kpi.high{box-shadow:inset 3px 0 0 var(--high),var(--shadow-sm);}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;background:var(--brand-grad);color:#fff;border:1px solid transparent;border-radius:var(--r-sm);padding:0 16px;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap;box-shadow:0 2px 8px rgba(154,19,158,.25);transition:box-shadow .15s ease,transform .1s ease,filter .15s ease,background .15s ease;}
.btn:hover{filter:brightness(1.07);box-shadow:0 4px 14px rgba(154,19,158,.32);}
.btn:active{transform:translateY(1px);}
.btn.secondary{background:var(--surface);color:var(--text);border-color:var(--border-strong);box-shadow:var(--shadow-sm);}
.btn.secondary:hover{background:var(--bg-2);filter:none;}
.btn.ghost{background:none;color:var(--primary);border-color:transparent;box-shadow:none;padding:0 8px;}
.btn.ghost:hover{background:var(--primary-bg);filter:none;box-shadow:none;}
.btn.danger{background:var(--surface);color:var(--crit);border-color:color-mix(in srgb,var(--crit) 35%,transparent);box-shadow:none;}
.btn.danger:hover{background:var(--crit-bg);filter:none;box-shadow:none;}
.btn.sm{height:30px;padding:0 12px;font-size:13px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.row.between{justify-content:space-between;}

label.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--text-soft);font-weight:500;}
input[type=text],input[type=number],input[type=date],input[type=url],input[type=file],select,textarea{
  border:1px solid var(--border-strong);border-radius:var(--r-sm);padding:0 12px;height:36px;font-size:14px;background:var(--input-bg);color:var(--text);font-family:inherit;transition:border-color .15s ease,box-shadow .15s ease;
}
input[type=file]{padding:6px 10px;height:auto;}
textarea{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:13px;padding:10px 12px;height:auto;min-height:80px;line-height:1.5;}
input:hover,select:hover,textarea:hover{border-color:color-mix(in srgb,var(--primary) 30%,var(--border-strong));}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--focus);}
input[type=checkbox],input[type=radio]{accent-color:var(--primary);width:16px;height:16px;cursor:pointer;vertical-align:-3px;}

.tabbar{display:flex;gap:2px;margin-bottom:20px;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;}
.tabbtn{position:relative;background:none;border:none;padding:10px 14px;font-size:14px;font-weight:500;color:var(--text-faint);cursor:pointer;white-space:nowrap;transition:color .15s ease;}
.tabbtn:hover{color:var(--text);}
.tabbtn.active{color:var(--text);font-weight:600;}
.tabbtn.active::after{content:'';position:absolute;left:10px;right:10px;bottom:-1px;height:2px;border-radius:2px;background:var(--brand-grad);}
.subtabbar{display:inline-flex;gap:2px;margin:-4px 0 18px;padding:3px;background:var(--bg-2);border-radius:10px;}
.subtabbtn{background:none;border:none;height:30px;padding:0 14px;font-size:13px;font-weight:500;color:var(--text-soft);cursor:pointer;border-radius:8px;transition:background .15s ease,color .15s ease;}
.subtabbtn:hover{color:var(--text);}
.subtabbtn.active{background:var(--surface);color:var(--text);font-weight:600;box-shadow:var(--shadow-sm);}

.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border-strong);color:var(--text-soft);font-size:13px;font-weight:500;height:32px;padding:0 12px;border-radius:99px;cursor:pointer;margin-right:6px;transition:background .15s ease,border-color .15s ease,color .15s ease;}
.chip:hover{border-color:var(--primary);color:var(--text);}
.chip-active{background:var(--primary-bg);border-color:var(--primary);color:var(--primary-dark);font-weight:600;}
.chip-count{background:var(--bg-2);color:var(--text-soft);border-radius:99px;padding:0 7px;font-size:12px;font-weight:600;line-height:18px;}
.chip-active .chip-count{background:color-mix(in srgb,var(--primary) 18%,transparent);color:var(--primary-dark);}

table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;}
th{text-align:left;color:var(--text-faint);font-size:12px;font-weight:600;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface-2);position:sticky;top:0;z-index:1;}
td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle;transition:background .1s ease;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:var(--surface-2);}
tr.clickable{cursor:pointer;}
tr.row-selected td{background:var(--primary-bg)!important;}
td.nowrap,th.nowrap{white-space:nowrap;}
td.cell-text{min-width:200px;max-width:320px;word-break:break-word;line-height:1.45;}
td.cell-key{max-width:170px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-soft);}
td.cell-go{width:36px;padding-left:0;color:var(--text-faint);text-align:right;}
tr.clickable:hover td.cell-go{color:var(--primary);}
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);overflow:auto;box-shadow:var(--shadow-sm);}
.card .table-wrap{box-shadow:none;}

.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:99px;font-size:12px;font-weight:500;white-space:nowrap;line-height:1;}
.pill.sev-critical,.pill.sev-high,.pill.sev-medium,.pill.sev-low{padding-left:8px;}
.pill.sev-critical::before,.pill.sev-high::before,.pill.sev-medium::before,.pill.sev-low::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0;}
.pill.sev-critical{background:var(--crit-bg);color:var(--crit);}
.pill.sev-high{background:var(--high-bg);color:var(--high);}
.pill.sev-medium{background:var(--med-bg);color:var(--med);}
.pill.sev-low{background:var(--low-bg);color:var(--low);}
.pill.sev-ok{background:var(--ok-bg);color:var(--ok);}
.pill.st-new{background:var(--primary-bg);color:var(--primary-dark);}
.pill.st-review{background:var(--purple-bg);color:var(--purple);}
.pill.st-accepted{background:var(--ok-bg);color:var(--ok);}
.pill.st-rejected{background:var(--low-bg);color:var(--text-soft);}
.pill.st-fp{background:var(--mark-bg);color:var(--mark-text);}
.pill.type{background:transparent;color:var(--text-soft);border:1px solid var(--border-strong);}

.badge{display:inline-flex;align-items:center;gap:4px;background:var(--primary-bg);color:var(--primary-dark);border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600;}
.msel{position:relative;display:inline-block;}
.msel > .btn.secondary{color:var(--text-soft);font-weight:500;}
.msel > .btn.secondary .chev{opacity:.55;margin-left:-2px;}
.msel > .btn.msel-on{background:var(--primary-bg);border-color:var(--primary);color:var(--primary-dark);font-weight:600;}
.msel-panel{position:fixed;z-index:200;background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--r-md);box-shadow:var(--shadow-lg);padding:8px;min-width:220px;max-width:min(320px, calc(100vw - 16px));max-height:min(300px, calc(100vh - 16px));overflow:auto;animation:popIn .14s var(--ease);}
@keyframes popIn{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}
.msel-panel label{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 8px;border-radius:6px;white-space:nowrap;cursor:pointer;}
.msel-panel label:hover{background:var(--bg-2);}
.msel-panel label input{flex-shrink:0;}
.msel-actions{display:flex;align-items:center;gap:10px;margin-top:6px;padding:8px 4px 2px;border-top:1px solid var(--border);}

/* ---- empty states: the only place illustrations live ---- */
.empty{text-align:center;color:var(--text-faint);padding:40px 20px;font-size:14px;}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:4px;font-weight:600;}
.empty-state{display:flex;flex-direction:column;align-items:center;text-align:center;padding:48px 20px;color:var(--text-soft);font-size:14px;}
.empty-state img{width:200px;max-width:70%;border-radius:var(--r-lg);margin-bottom:20px;box-shadow:0 8px 28px rgba(124,31,201,.14);}
.empty-state .es-ic{width:48px;height:48px;border-radius:14px;background:var(--primary-bg);color:var(--primary);display:flex;align-items:center;justify-content:center;margin-bottom:14px;}
.empty-state b{display:block;color:var(--text);font-size:16px;font-weight:600;margin-bottom:4px;}
.empty-state .es-text{margin:0 0 18px;max-width:440px;line-height:1.55;}
.empty-state .es-text:last-child{margin-bottom:0;}
.es-steps{text-align:left;margin:4px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;}
.empty-state.compact{padding:28px 16px;}
.empty-state.compact img{width:140px;margin-bottom:14px;}
:root[data-theme="dark"] .empty-state img,:root[data-theme="dark"] .illustration{filter:brightness(.82) saturate(.9);box-shadow:0 8px 28px rgba(0,0,0,.4);}
.hint{font-size:13px;color:var(--text-faint);line-height:1.5;margin-top:8px;}

.drop{display:flex;flex-direction:column;align-items:center;border:1.5px dashed var(--border-strong);border-radius:var(--r-md);padding:28px 24px;text-align:center;background:var(--surface-2);cursor:pointer;transition:border-color .15s ease,background .15s ease;}
.drop:hover,.drop.drag{border-color:var(--primary);background:var(--primary-bg);}
.drop img{width:120px;border-radius:var(--r-md);margin-bottom:14px;box-shadow:0 6px 18px rgba(124,31,201,.12);}
.drop strong{display:block;font-size:14px;font-weight:600;margin-bottom:4px;color:var(--text);}
.drop span{color:var(--text-faint);font-size:13px;max-width:620px;line-height:1.5;}
input[type=file].hidden-input{display:none;}

.pager{display:flex;gap:6px;align-items:center;justify-content:flex-end;padding:12px 4px;font-size:13px;color:var(--text-soft);}
.pager span{margin-right:6px;}
.pager button{background:var(--surface);color:var(--text);border:1px solid var(--border-strong);border-radius:var(--r-sm);width:32px;height:30px;cursor:pointer;font-size:13px;transition:background .15s ease;}
.pager button:hover:not(:disabled){background:var(--bg-2);}
.pager button:disabled{opacity:.4;cursor:not-allowed;}

/* modal */
.modal-bg{position:fixed;inset:0;background:var(--overlay);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:100;animation:fadeIn .15s ease;padding:16px;}
.modal{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:24px 26px;width:540px;max-width:100%;max-height:88vh;overflow:auto;box-shadow:var(--shadow-lg);animation:modalIn .2s var(--ease);}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes modalIn{from{opacity:0;transform:translateY(8px) scale(.98);}to{opacity:1;transform:none;}}
.modal h3{margin:0 0 4px;font-size:18px;font-weight:600;letter-spacing:-.01em;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;}
.detail-panel{position:fixed;top:0;right:0;bottom:0;width:480px;max-width:100vw;background:var(--surface);box-shadow:var(--shadow-lg);z-index:300;transform:translateX(100%);transition:transform .28s var(--ease);overflow-y:auto;border-left:1px solid var(--border);}
.detail-panel.open{transform:translateX(0);}
.detail-panel-inner{padding:24px;}
.detail-panel-overlay{position:fixed;inset:0;background:var(--overlay);z-index:299;opacity:0;pointer-events:none;transition:opacity .2s ease;}
.detail-panel-overlay.open{opacity:1;pointer-events:auto;}
.detail-panel-close{position:absolute;top:18px;right:18px;width:32px;height:32px;background:var(--bg-2);border:none;border-radius:50%;font-size:16px;line-height:1;color:var(--text-soft);cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;transition:background .15s ease,color .15s ease;}
.detail-panel-close:hover{background:var(--primary-bg);color:var(--primary-dark);}

/* toast */
.toasts{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:400;}
.toast{background:#1F1729;color:#fff;padding:12px 16px;border-radius:10px;font-size:13px;box-shadow:var(--shadow-lg);max-width:360px;border-left:3px solid var(--brand-pink);animation:toastIn .25s var(--ease);}
:root[data-theme="dark"] .toast{background:#2D2340;}
@keyframes toastIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

.bars{display:flex;flex-direction:column;gap:10px;}
.bar-row{display:grid;grid-template-columns:minmax(90px,160px) 1fr 44px;gap:12px;align-items:center;font-size:13px;}
.bar-row > span:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--text-soft);}
.bar-track{background:var(--bg-2);border-radius:99px;height:8px;overflow:hidden;}
.bar-fill{height:100%;border-radius:99px;}

.mark{background:var(--mark-bg);color:var(--mark-text);border-radius:3px;padding:0 2px;}
.issue-hl-crit{background:var(--crit-bg);color:var(--crit);font-weight:600;border-radius:3px;padding:0 3px;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--crit) 35%,transparent);}
.issue-hl-high{background:var(--high-bg);color:var(--high);font-weight:600;border-radius:3px;padding:0 3px;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--high) 30%,transparent);}
.issue-hl-med{background:var(--med-bg);color:var(--med);font-weight:600;border-radius:3px;padding:0 3px;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--med) 30%,transparent);}
.issue-hl-low{background:var(--low-bg);color:var(--low);font-weight:600;border-radius:3px;padding:0 3px;}
.found-expected{display:flex;align-items:center;gap:8px;font-family:"IBM Plex Mono",monospace;font-size:13px;background:var(--bg-2);border-radius:var(--r-sm);padding:8px 12px;margin-top:4px;}
.found-expected b{color:var(--crit);font-weight:600;}
.found-expected .arrow{color:var(--text-faint);}
.found-expected .to{color:var(--ok);font-weight:600;}
.checklist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 24px;}
.checkrow{display:flex;align-items:center;gap:10px;font-size:14px;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer;}
.lang-group{display:flex;flex-wrap:wrap;gap:8px 18px;margin-bottom:4px;}
.lang-check{display:flex;align-items:center;gap:6px;font-size:14px;white-space:nowrap;cursor:pointer;}
.lang-check input:disabled{opacity:.5;}

/* project cards */
.proj-card{display:flex;flex-direction:column;gap:14px;padding:18px 20px;margin:0;}
.proj-card-head{display:flex;gap:12px;align-items:flex-start;}
.proj-ava{width:40px;height:40px;border-radius:11px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;}
.proj-card-title{font-size:16px;font-weight:600;margin:0;line-height:1.3;letter-spacing:-.01em;}
.proj-card-desc{font-size:13px;color:var(--text-faint);margin-top:2px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.proj-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-top:14px;border-top:1px solid var(--border);}
.proj-stats div{font-size:12px;color:var(--text-faint);}
.proj-stats b{display:block;font-size:16px;color:var(--text);font-weight:600;font-variant-numeric:tabular-nums;}
.proj-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--text-faint);}
.dots{display:flex;gap:4px;align-items:center;}
.dots i{width:8px;height:8px;border-radius:50%;display:inline-block;}
.proj-card-new{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:180px;border:1.5px dashed var(--border-strong);border-radius:var(--r-md);color:var(--text-soft);font-weight:500;cursor:pointer;background:transparent;transition:border-color .15s ease,color .15s ease,background .15s ease;font-size:14px;}
.proj-card-new:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-bg);}

.onboard{display:grid;grid-template-columns:1fr 280px;max-width:820px;padding:0;overflow:hidden;}
.onboard-body{padding:24px 28px;}
.onboard-art{background:linear-gradient(135deg,#F3E8FB,#FBE7F3);display:flex;align-items:center;justify-content:center;padding:20px;}
.onboard-art img{width:100%;border-radius:var(--r-md);box-shadow:0 8px 24px rgba(124,31,201,.16);}
:root[data-theme="dark"] .onboard-art{background:linear-gradient(135deg,#2A1B3F,#351A36);}
.step{display:flex;align-items:center;gap:12px;font-size:14px;}
.step-n{width:24px;height:24px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--primary-bg);color:var(--primary-dark);}
.step.done{color:var(--text-faint);}
.step.done .step-n{background:var(--ok-bg);color:var(--ok);}

.danger-zone{border-color:color-mix(in srgb,var(--crit) 30%,var(--border));}
.danger-zone h3{color:var(--crit);}

/* ---- visual check ---- */
.drop.drop-compact{flex-direction:row;gap:14px;padding:14px 18px;justify-content:flex-start;text-align:left;}
.drop.drop-compact strong{margin:0;}
.vs-mosaic{height:140px;background:var(--bg-2);display:flex;gap:2px;overflow:hidden;align-items:stretch;justify-content:center;color:var(--text-faint);}
.vs-mosaic > span{display:flex;align-items:center;}
.vs-mosaic img{flex:1;min-width:0;object-fit:cover;object-position:top;}
.shot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;}
.shot-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;cursor:pointer;transition:box-shadow .2s ease,transform .2s var(--ease),border-color .2s ease;}
.shot-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);border-color:var(--border-strong);}
.shot-thumb{position:relative;aspect-ratio:16/10;background:var(--bg-2);overflow:hidden;}
.shot-thumb img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;}
.shot-count{position:absolute;top:8px;right:8px;box-shadow:var(--shadow-sm);}
.shot-ai{position:absolute;top:8px;left:8px;width:22px;height:22px;border-radius:50%;background:var(--brand-grad);color:#fff;display:flex;align-items:center;justify-content:center;}
.shot-meta{padding:8px 12px;font-size:13px;display:flex;justify-content:space-between;gap:8px;}
.shot-meta > span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.thumb-sm{width:64px;height:40px;object-fit:cover;object-position:top;border-radius:6px;border:1px solid var(--border);flex-shrink:0;}
.shot-crop{position:relative;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--border);background:var(--bg-2);}
.vbox{position:absolute;border:2px solid var(--primary);border-radius:4px;box-shadow:0 0 0 9999px rgba(0,0,0,0);background:color-mix(in srgb,var(--primary) 10%,transparent);}
.vbox.sev-critical{border-color:#EF4444;background:rgba(239,68,68,.1);} .vbox.sev-high{border-color:#F97316;background:rgba(249,115,22,.1);}
.vbox.sev-medium{border-color:#EAB308;background:rgba(234,179,8,.1);} .vbox.sev-low{border-color:#A78BFA;background:rgba(167,139,250,.12);}
.vbox > span{position:absolute;top:-11px;left:-11px;width:22px;height:22px;border-radius:50%;background:#1F1729;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px #fff;}
.vbox.draft{border-style:dashed;border-color:#fff;background:rgba(214,22,158,.18);box-shadow:0 0 0 1px rgba(0,0,0,.4);}
.vbox.focus{box-shadow:0 0 0 9999px rgba(10,5,20,.45);z-index:2;}
body.viewer-open{overflow:hidden;}
.viewer{position:fixed;inset:0;z-index:350;background:#120B1C;color:#fff;display:flex;flex-direction:column;animation:fadeIn .15s ease;}
.viewer-top{height:56px;flex:0 0 56px;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid rgba(255,255,255,.08);}
.viewer-top .top-ic:hover{background:rgba(255,255,255,.08);}
.viewer-body{flex:1;min-height:0;display:flex;}
.viewer-stage{flex:1;min-width:0;overflow:auto;padding:24px;display:flex;justify-content:center;align-items:flex-start;}
.viewer-canvas{position:relative;display:inline-block;cursor:crosshair;user-select:none;touch-action:none;max-width:100%;box-shadow:0 10px 40px rgba(0,0,0,.5);border-radius:4px;}
.viewer-canvas img{display:block;max-width:100%;height:auto;border-radius:4px;pointer-events:none;}
.viewer-canvas .vbox:not(.draft){cursor:pointer;}
.viewer-side{width:380px;flex:0 0 380px;background:var(--surface);color:var(--text);overflow-y:auto;padding:18px;border-left:1px solid var(--border);}
.v-issue{border:1px solid var(--border);border-radius:var(--r-md);padding:10px 12px;margin-bottom:10px;cursor:pointer;transition:border-color .15s ease,background .15s ease;}
.v-issue:hover{border-color:var(--border-strong);}
.v-issue.focus{border-color:var(--primary);background:var(--primary-bg);}
.v-num{width:22px;height:22px;border-radius:50%;background:#1F1729;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.v-row{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--text);}
.v-row:hover{background:var(--bg-2);}
.v-row input{margin-top:2px;flex-shrink:0;}
@media(max-width:900px){ .viewer-body{flex-direction:column;} .viewer-side{width:auto;flex:0 0 auto;max-height:45vh;border-left:none;border-top:1px solid var(--border);} .viewer-stage{padding:12px;} }

/* ---- responsive ---- */
@media(max-width:900px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;height:100%;transform:translateX(-100%);transition:transform .25s var(--ease);box-shadow:var(--shadow-lg);width:264px;}
  body.nav-open .sidebar{transform:none;}
  .side-overlay{display:block;position:fixed;inset:0;background:var(--overlay);z-index:35;opacity:0;pointer-events:none;transition:opacity .2s ease;}
  body.nav-open .side-overlay{opacity:1;pointer-events:auto;}
  .top-ic.menu-btn{display:flex;}
  .topbar{padding:0 12px 0 8px;}
  .top-search{display:none;}
  .content{padding:20px 16px 48px;}
  .page-title{font-size:22px;}
  .checklist,.grid-4,.grid-3,.grid-2{grid-template-columns:minmax(0,1fr);}
  .onboard{grid-template-columns:1fr;}
  .onboard-art{order:-1;padding:16px;}
  .onboard-art img{max-width:260px;}
  .project-hero{padding:20px;}
  .modal{padding:20px;}
}
@media(max-width:560px){ .grid-4{grid-template-columns:repeat(2,minmax(0,1fr));} .kpi .num{font-size:22px;} .page-head{align-items:flex-start;} }
@media(prefers-reduced-motion:reduce){ *,*::before,*::after{animation:none!important;transition:none!important;} }
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="side-brand">
      <div class="side-brand-row">
        <span class="side-logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l7.5 3.6v6.2c0 4.6-3.2 7.9-7.5 9.2-4.3-1.3-7.5-4.6-7.5-9.2V6.1L12 2.5z"/><path d="M8.7 12.2l2.2 2.2 4.4-4.6"/></svg></span>
        <div>
          <div class="side-logo-text">LQA Hub</div>
          <div class="side-tagline">Проверка локализации</div>
        </div>
      </div>
    </div>
    <nav class="side-nav" id="sideNav"></nav>
    <div class="side-foot">
      <div class="theme-toggle" id="themeToggle">
        <button type="button" data-mode="light" onclick="setTheme('light')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Светлая</button>
        <button type="button" data-mode="dark" onclick="setTheme('dark')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>Тёмная</button>
      </div>
    </div>
  </aside>
  <div class="side-overlay" onclick="toggleNav(false)"></div>
  <div class="main">
    <header class="topbar">
      <button type="button" class="top-ic menu-btn" title="Меню" onclick="toggleNav()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <div class="crumbs" id="crumbs"></div>
      <div class="top-search">
        <span class="s-ic"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></span>
        <input type="text" id="globalSearch" placeholder="Поиск строк и проблем" onkeydown="if(event.key==='Enter')doGlobalSearch()">
        <span class="kbd-hint">⌘K</span>
      </div>
      <button type="button" class="top-ic" title="Уведомления" onclick="toggleNotifCenter()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="dot" id="notifDot"></span></button>
      <div class="avatar" title="Wildberries">WB</div>
    </header>
    <main class="content" id="content"></main>
  </div>
</div>
<div id="modalRoot"></div>
<div id="detailPanelOverlay" class="detail-panel-overlay" onclick="closeDetailPanel()"></div>
<div id="detailPanel" class="detail-panel"><div class="detail-panel-inner" id="detailPanelBody"></div></div>
<div class="toasts" id="toasts"></div>

<script>
/* =========================================================
   STORE — localStorage-backed, table-generic, backend-ready
   ========================================================= */
// Illustrations (user-provided WB pack), cropped to their clean area and re-encoded as WebP so the

    if(!blockText.trim()) return;
    const lines = blockText.split('\n');
    const isObsolete = lines.some(l=>l.trim().startsWith('#~'));
    const p = tokenizePoBlock(lines);
    const isHeader = p.msgidIdx>=0 && p.msgid==='' && !p.msgctxt;
    if(p.msgidIdx>=0 && p.msgstrIdx>=0 && !isObsolete && !isHeader){
      entries.push({key:p.msgctxt||'', source:p.msgid, target:p.msgstr});
    }
  });
  return entries;
}

function yieldToUI(){ return new Promise(resolve=>setTimeout(resolve, 0)); }
async function runTechnicalCheckOnRows(rowIds, override, onProgress){
  const s = Object.assign({}, getSettings(), override||{});
  const issues = dbList('issues').filter(i=>!rowIds.includes(i.rowId) || i.manual); // keep manual issues, drop old auto issues for these rows
  const allRows = dbList('rows');
  const rowsById = {}; allRows.forEach(r=>{ rowsById[r.id]=r; });
  const CHUNK = 1500;
  for(let start=0; start<rowIds.length; start+=CHUNK){
    const chunk = rowIds.slice(start, start+CHUNK);
    chunk.forEach(rowId=>{
      const r = rowsById[rowId];
      if(!r) return;
      const src = r.source||'', tgt = r.target||'';
      const srcTrim = src.trim(), tgtTrim = tgt.trim();
      const push = (type, severity, text, extra) => issues.push(Object.assign({
        id: uid(), rowId: r.id, projectId:r.projectId, componentId:r.componentId, languageCode:r.languageCode,
        type, severity, text, status:'Новая', createdAt: nowISO(), history:[{ts:nowISO(),action:'Обнаружена (техническая проверка)'}],
        aiExplanation:null, aiSuggestion:null, aiConfidence:null,
        highlightField:null, highlightText:null, expectedText:null, confidence:'high', matchType:null
      }, extra||{}));

      if(s.checkUntranslated){
        if(!tgtTrim && srcTrim) push('Не переведено','Критическая','Пустой перевод');
        else if(tgtTrim && srcTrim && tgtTrim===srcTrim && looksLikeTranslatableText(srcTrim)) push('Не переведено','Высокая','Перевод совпадает с исходным текстом');
      }
      if(s.checkVars){
        const {missing, extra} = diffMultiset(extractAll(src,VAR_RE), extractAll(tgt,VAR_RE));
        if(missing.length) push('Переменные','Критическая','Потеряна переменная: '+missing.join(', '), {highlightField:'source', highlightText:missing[0]});
        if(extra.length) push('Переменные','Критическая','Лишняя переменная: '+extra.join(', '), {highlightField:'target', highlightText:extra[0]});
        if(!missing.length && !extra.length){
          const so=extractAll(src,VAR_RE), to=extractAll(tgt,VAR_RE);
          if(so.length>1 && so.join('|')!==to.join('|')) push('Переменные','Средняя','Порядок переменных отличается от исходного');
        }
      }
      if(s.checkTags){
        const {missing, extra} = diffMultiset(extractTagsNormalized(src), extractTagsNormalized(tgt));
        if(missing.length) push('Разметка','Критическая','Потерян тег: '+missing.join(', '), {highlightField:'source', highlightText: findRawTagText(src, missing[0]) || missing[0]});
        if(extra.length) push('Разметка','Критическая','Лишний тег: '+extra.join(', '), {highlightField:'target', highlightText: findRawTagText(tgt, extra[0]) || extra[0]});
      }
      if(s.checkBreaks){
        const {missing, extra} = diffMultiset(extractAll(src,BREAK_RE), extractAll(tgt,BREAK_RE));
        if(missing.length) push('Перенос строки','Высокая','Потерян перенос строки', {highlightField:'source', highlightText:missing[0]});
        if(extra.length) push('Перенос строки','Высокая','Лишний перенос строки', {highlightField:'target', highlightText:extra[0]});
      }
      if(s.checkSpaces){
        let m;
        if(m = tgt.match(/^\s+/)) push('Пробелы','Низкая','Пробел в начале строки', {highlightField:'target', highlightText:m[0]});
        if(tgt.length && (m = tgt.match(/\s+$/))) push('Пробелы','Низкая','Пробел в конце строки', {highlightField:'target', highlightText:m[0]});
        if(m = tgt.match(/ {2,}/)) push('Пробелы','Низкая','Двойной пробел', {highlightField:'target', highlightText:m[0]});
      }
      if(s.checkPunct){
        let m;
        if(m = tgt.match(/ [.,!?;:]/)) push('Пунктуация','Средняя','Пробел перед знаком препинания', {highlightField:'target', highlightText:m[0]});
        if(m = tgt.match(/([!?,;:])\1+/)) push('Пунктуация','Средняя','Повторяющийся знак препинания', {highlightField:'target', highlightText:m[0]});
        if(m = tgt.match(/\.{4,}/)) push('Пунктуация','Средняя','Слишком много точек подряд', {highlightField:'target', highlightText:m[0]});
      }
      if(s.checkLength && srcTrim.length>=3 && tgtTrim.length>0){
        const ratio = tgtTrim.length/srcTrim.length;
        if(ratio > (s.lengthRatio||1.6)) push('Длина','Средняя','Перевод заметно длиннее исходного (×'+ratio.toFixed(2)+') — может не влезть в интерфейс');
      }
      if(s.checkRebranding && REBRAND_LANGUAGES.includes((r.languageCode||'').toLowerCase())){
        const found = findRebrandingTerms(tgt);
        if(found.length) push('Ребрендинг','Высокая','В переводе остались старые упоминания бренда, должно быть N11: '+found.map(f=>f.matched).join(', '),
          {highlightField:'target', highlightText:found[0].matched, expectedText:'N11', matchType:'rebrand', confidence:'high'});
      }
    });
    if(onProgress) onProgress(Math.min(start+CHUNK, rowIds.length), rowIds.length, 'tech');
    if(start+CHUNK < rowIds.length) await yieldToUI(); // let the tab repaint/respond between chunks instead of freezing solid
  }
  dbSave('issues', issues);
}

function runConsistencyCheck(projectId, override){
  const s = Object.assign({}, getSettings(), override||{});
  if(!s.checkConsistency) return;
  let issues = dbList('issues').filter(i=>!(i.projectId===projectId && i.type==='Согласованность'));
  const rows = dbQuery('rows', r=>r.projectId===projectId);
  const componentsById = {}; dbList('components').forEach(c=>{ componentsById[c.id]=c; });
  const groups = {};
  rows.forEach(r=>{
    const src=(r.source||'').trim(); if(!src) return;
    const gkey = r.languageCode+'||'+src.toLowerCase();
    (groups[gkey] = groups[gkey]||[]).push(r);
  });
  Object.values(groups).forEach(group=>{
    const byComponent = {};
    group.forEach(r=>{ (byComponent[r.componentId] = byComponent[r.componentId]||[]).push(r); });
    const componentIds = Object.keys(byComponent);
    if(componentIds.length < 2) return;
    const targets = new Set(group.map(r=>(r.target||'').trim()).filter(Boolean));
    if(targets.size < 2) return;
    group.forEach(r=>{
      if(!(r.target||'').trim()) return;
      const others = componentIds.filter(c=>c!==r.componentId)
        .map(c=>{
          const comp = componentsById[c];
          const txts = [...new Set(byComponent[c].map(x=>(x.target||'').trim()).filter(Boolean))];
          return (comp?comp.name:c) + ': «' + txts.join(' / ') + '»';
        }).join('; ');
      issues.push({
        id: uid(), rowId:r.id, projectId:r.projectId, componentId:r.componentId, languageCode:r.languageCode,
        type:'Согласованность', severity:'Средняя', text:'Возможное расхождение переводов. Другие папки — '+others,
        status:'Новая', createdAt:nowISO(), history:[{ts:nowISO(),action:'Обнаружена (проверка согласованности)'}],
        aiExplanation:null, aiSuggestion:null, aiConfidence:null
      });
    });
  });
  dbSave('issues', issues);
}

function levenshtein(a, b){
  const m=a.length, n=b.length;
  if(m===0) return n; if(n===0) return m;
  let prev = new Array(n+1); for(let j=0;j<=n;j++) prev[j]=j;
  for(let i=1;i<=m;i++){
    const cur=[i];
    for(let j=1;j<=n;j++) cur[j] = a[i-1]===b[j-1] ? prev[j-1] : 1+Math.min(prev[j-1], prev[j], cur[j-1]);
    prev=cur;
  }
  return prev[n];
}
function extractWordsWithPositions(str){
  const words=[]; const re=/[\p{L}\p{N}]+/gu; let m;
  while((m=re.exec(str))!==null) words.push({word:m[0], start:m.index});
  return words;
}
function containsApprovedForm(tgtLower, approvedLower){
  // Staged, cautious matching so a normal grammatical form (case, number, suffix
  // chains in agglutinative languages) is never treated as a glossary violation:
  //   1. exact/case-insensitive substring at a clean word boundary before it —
  //      this also covers "approved + suffix" (e.g. тапсырыс -> тапсырыстардың)
  //   2. a shorter stem of the approved term at a clean boundary — covers the
  //      word losing characters only at the tail
  //   3. whole-word edit-distance fallback — covers internal changes (vowel
  //      harmony, softened consonants) a plain substring search can't see;
  //      only reached when 1–2 found nothing, and always low-confidence
  //   4. nothing found at all — confident miss
  if(!approvedLower) return {matched:true, confidence:'exact', matchedText:null};
  const isLetter = ch => ch!==undefined && /[\p{L}\p{N}]/u.test(ch);
  const idx = tgtLower.indexOf(approvedLower);
  if(idx>=0){
    const before = idx>0 ? tgtLower[idx-1] : undefined;
    if(!isLetter(before)) return {matched:true, confidence:'exact', matchedText: approvedLower, matchStart: idx};
  }
  const minLen = Math.max(3, Math.ceil(approvedLower.length * 0.7));
  for(let len = approvedLower.length - 1; len >= minLen; len--){
    const stem = approvedLower.slice(0, len);
    const sIdx = tgtLower.indexOf(stem);
    if(sIdx>=0){
      const before = sIdx>0 ? tgtLower[sIdx-1] : undefined;
      if(!isLetter(before)) return {matched:true, confidence:'heuristic', matchedText: stem, matchStart: sIdx};
    }
  }
  if(approvedLower.length>=4){
    const words = extractWordsWithPositions(tgtLower);
    const maxDist = approvedLower.length<=6 ? 1 : 2;
    for(const w of words){
      if(Math.abs(w.word.length - approvedLower.length) > 2) continue;
      if(levenshtein(w.word, approvedLower) <= maxDist) return {matched:true, confidence:'heuristic', matchedText: w.word, matchStart: w.start};
    }
  }
  return {matched:false, confidence:'none', matchedText:null};
}
function crossPlatformGlossaryExamples(allRows, languageCode, componentId, termLower, approvedLower, componentsById){
  if(!approvedLower) return [];
  const seen = new Set(), examples = [];
  for(let i=0;i<allRows.length && examples.length<3;i++){
    const r = allRows[i];
    if(r.componentId===componentId || r.languageCode!==languageCode) continue;
    const src = (r.source||'').toLowerCase();
    if(!src.includes(termLower)) continue;
    const tgt = (r.target||'').toLowerCase();
    const check = containsApprovedForm(tgt, approvedLower);
    if(!check.matched || check.confidence!=='exact') continue; // only confident matches count as cross-platform proof
    const comp = componentsById[r.componentId];
    const label = comp ? comp.name : r.componentId;
    if(seen.has(label)) continue;
    seen.add(label);
    examples.push({component: label, target: r.target});
  }
  return examples;
}
function findCaseInsensitiveMatch(str, needle){
  if(!str || !needle) return null;
  const idx = str.toLowerCase().indexOf(needle.toLowerCase());
  if(idx<0) return null;
  return {index: idx, matched: str.slice(idx, idx+needle.length)};
}
async function runGlossaryCheck(projectId, override, onProgress){
  const s = Object.assign({}, getSettings(), override||{});
  if(!s.checkGlossary) return;
  let issues = dbList('issues').filter(i=>!(i.projectId===projectId && i.type==='Терминология'));
  const glossaries = dbQuery('glossaries', g=>!g.projectId || g.projectId===projectId);
  const glossaryIds = glossaries.map(g=>g.id);
  const glossaryLangById = {}; glossaries.forEach(g=>{ glossaryLangById[g.id] = g.language || ''; });
  const rawTerms = dbQuery('glossaryTerms', t=>glossaryIds.includes(t.glossaryId));
  if(!rawTerms.length){ dbSave('issues', issues); return; }
  // precompute lowercase fields once — these were previously recomputed on every single row, the dominant cost with a large glossary
  const terms = rawTerms.filter(t=>t.term).map(t=>({
    term: t.term, approved: t.approved||'', glossaryId: t.glossaryId,
    termLower: t.term.toLowerCase(), approvedLower: (t.approved||'').toLowerCase(),
    forbidden: t.forbidden||[], forbiddenLower: (t.forbidden||[]).map(f=>(f||'').toLowerCase()),
    language: t.language || ''
  }));
  const rows = dbQuery('rows', r=>r.projectId===projectId);
  const componentsById = {}; dbList('components').forEach(c=>{ componentsById[c.id]=c; });
  const CHUNK = 800;
  for(let start=0; start<rows.length; start+=CHUNK){
    const chunk = rows.slice(start, start+CHUNK);
    chunk.forEach(r=>{
      const srcLower = (r.source||'').toLowerCase(), tgtLower=(r.target||'').toLowerCase();
      if(!srcLower) return;
      terms.forEach(term=>{
        const termLang = glossaryLangById[term.glossaryId] || term.language;
        if(termLang && r.languageCode && termLang.toLowerCase()!==r.languageCode.toLowerCase()) return;
        if(!srcLower.includes(term.termLower)) return;

        const forbiddenIdx = term.forbiddenLower.findIndex(f=>f && tgtLower.includes(f));
        const approvedCheck = term.approvedLower ? containsApprovedForm(tgtLower, term.approvedLower) : {matched:true, confidence:'exact'};
        const isExact = approvedCheck.matched && approvedCheck.confidence==='exact';
        if(forbiddenIdx<0 && isExact) return; // clean — nothing to report, skip the cross-platform scan entirely

        const crossExamples = crossPlatformGlossaryExamples(rows, r.languageCode, r.componentId, term.termLower, term.approvedLower, componentsById);
        const crossNote = crossExamples.length ? ' Расхождение между папками — верно переведено в: ' + crossExamples.map(e=>e.component+' («'+e.target+'»)').join('; ') + '.' : '';
        const crossSuggestion = crossExamples.length ? crossExamples[0].target : null;
        const srcHit = findCaseInsensitiveMatch(r.source, term.term);

        if(forbiddenIdx>=0){
          const tgtHit = findCaseInsensitiveMatch(r.target, term.forbidden[forbiddenIdx]);
          issues.push({id:uid(), rowId:r.id, projectId:r.projectId, componentId:r.componentId, languageCode:r.languageCode,
            type:'Терминология', severity: crossExamples.length ? 'Критическая' : 'Высокая',
            text:'Термин «'+term.term+'»: найден запрещённый вариант «'+term.forbidden[forbiddenIdx]+'», ожидался «'+term.approved+'».'+crossNote,
            status:'Новая', createdAt:nowISO(), history:[{ts:nowISO(),action:'Обнаружена (проверка глоссария)'}],
            aiExplanation:null, aiSuggestion:null, aiConfidence:null, crossPlatformSuggestion: crossSuggestion,
            highlightField: tgtHit?'target':null, highlightText: tgtHit?tgtHit.matched:null, expectedText: term.approved, matchType:'forbidden', confidence:'high'});
        } else if(approvedCheck.confidence==='heuristic'){
          const foundForm = extractWordAt(r.target, approvedCheck.matchStart) || approvedCheck.matchedText;
          issues.push({id:uid(), rowId:r.id, projectId:r.projectId, componentId:r.componentId, languageCode:r.languageCode,
            type:'Терминология', severity:'Средняя',
            text:'Возможное несоответствие: найдена форма «'+foundForm+'», базовый термин — «'+term.approved+'». Возможно, это допустимая грамматическая форма.'+crossNote,
            status:'Новая', createdAt:nowISO(), history:[{ts:nowISO(),action:'Обнаружена (проверка глоссария)'}],
            aiExplanation:null, aiSuggestion:null, aiConfidence:null, crossPlatformSuggestion: crossSuggestion,
            highlightField: 'target', highlightText: foundForm, expectedText: term.approved, matchType:'heuristic', confidence:'medium'});
        } else {
          issues.push({id:uid(), rowId:r.id, projectId:r.projectId, componentId:r.componentId, languageCode:r.languageCode,
            type:'Терминология', severity: crossExamples.length ? 'Критическая' : 'Высокая',
            text:'Термин «'+term.term+'»: одобренный перевод «'+term.approved+'» не найден в переводе.'+crossNote,
            status:'Новая', createdAt:nowISO(), history:[{ts:nowISO(),action:'Обнаружена (проверка глоссария)'}],
            aiExplanation:null, aiSuggestion:null, aiConfidence:null, crossPlatformSuggestion: crossSuggestion,
            highlightField: srcHit?'source':null, highlightText: srcHit?srcHit.matched:null, expectedText: term.approved, matchType:'missing', confidence:'high'});
        }
      });
    });
    if(onProgress) onProgress(Math.min(start+CHUNK, rows.length), rows.length, 'glossary');
    if(start+CHUNK < rows.length) await yieldToUI();
  }
  dbSave('issues', issues);
}

function collectGlossaryForRow(row){

async function callAiEndpoint(items){
  const s = getSettings();
  if(!s.aiEndpointUrl) throw new Error('В Настройках не указан адрес backend (Apps Script Web App URL)');
  const res = await fetch(s.aiEndpointUrl, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'}, // text/plain avoids a CORS preflight that Apps Script doesn't handle
    body: JSON.stringify({model: s.aiModel || 'gpt-4o-mini', items})
  });
  if(!res.ok) throw new Error('Backend ответил с ошибкой: HTTP ' + res.status);
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  return data.results || [];
}
async function runAIReviewForRows(rowIds){

  const batchSize = s.aiBatchSize || 15;

  toast('Запускаю ИИ-проверку: '+rows.length+' строк…');
  for(let i=0;i<rows.length;i+=batchSize){
    const batch = rows.slice(i, i+batchSize);
    const items = batch.map(r=>{
      const comp = dbGet('components', r.componentId);
      return {id:r.id, source:r.source, target:r.target, language:r.languageCode, component:comp?comp.name:'', context:r.key||'', glossary:collectGlossaryForRow(r)};
    });
    try{
      const results = await callAiEndpoint(items);
      const issuesArr = dbList('issues');
      results.forEach(res=>{
        checked++;
        if(res.error){ failed++; return; }
        if(!res.has_issue) return;
        const r = batch.find(b=>b.id===res.id);
        if(!r) return;
        const severity = AI_SEVERITIES.includes(res.severity) ? res.severity : 'Средняя';
        const type = AI_TYPES.includes(res.type) ? res.type : 'Смысл';
        issuesArr.push({
          id:uid(), rowId:r.id, projectId:r.projectId, componentId:r.componentId, languageCode:r.languageCode,
          type, severity, text: res.explanation || 'Найдена смысловая проблема',
          status:'Новая', createdAt:nowISO(), history:[{ts:nowISO(), action:'Обнаружена (проверка ИИ)'}],
          aiExplanation: res.explanation || null, aiSuggestion: res.suggestion || null,
          aiConfidence: typeof res.confidence==='number' ? res.confidence : null
        });
        created++;
      });
      dbSave('issues', issuesArr);
    }catch(err){
      failed += batch.length;
      toast('Ошибка ИИ-проверки: ' + err.message);
      console.error(err);
      break;
    }
  }
  toast('ИИ-проверка завершена: проверено '+checked+', новых проблем '+created+(failed?', ошибок '+failed:''));
  router();
}
async function bulkRunAI(key){
  const ids = getSelectedIssueIds(key);
  if(!ids.length){ toast('Выбери хотя бы одну проблему'); return; }
  const rowIds = [...new Set(ids.map(id=>dbGet('issues', id)?.rowId).filter(Boolean))];
  await runAIReviewForRows(rowIds);
}

function donutChart(dataObj, colorMap, size){
  size = size || 132;
  const entries = Object.entries(dataObj).filter(([,v])=>v>0);
  const total = entries.reduce((s,[,v])=>s+v,0);
  if(!total) return '<div class="empty" style="padding:28px 0;font-size:13px;">Пока нет данных</div>';
  let acc = 0;
  const stops = entries.map(([k,v])=>{
    const start = acc/total*360; acc += v; const end = acc/total*360;
    return `${colorMap[k]||'var(--primary)'} ${start}deg ${end}deg`;
  }).join(', ');
  const legend = entries.map(([k,v])=>`<div class="row" style="gap:8px;font-size:13px;margin-bottom:6px;flex-wrap:nowrap;"><span style="width:8px;height:8px;border-radius:50%;background:${colorMap[k]||'var(--primary)'};flex-shrink:0;"></span><span style="color:var(--text-soft);flex:1;">${esc(k)}</span><b style="font-weight:600;font-variant-numeric:tabular-nums;">${v}</b></div>`).join('');
  return `<div class="row" style="gap:24px;flex-wrap:nowrap;">
    <div style="position:relative;width:${size}px;height:${size}px;border-radius:50%;background:conic-gradient(${stops});flex-shrink:0;">
      <div style="position:absolute;inset:18px;border-radius:50%;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;"><b style="font-size:22px;font-weight:700;line-height:1;">${total}</b><span style="font-size:12px;color:var(--text-faint);margin-top:2px;">всего</span></div>
    </div>
    <div style="flex:1;min-width:0;">${legend}</div>
  </div>`;
}
function weeklyTrendBars(issues){
  const days = [];
  for(let i=6;i>=0;i--){ const d = new Date(); d.setDate(d.getDate()-i); days.push(d); }
  const counts = days.map(d=>{
    const key = d.toDateString();
    return issues.filter(i=>new Date(i.createdAt).toDateString()===key).length;
  });
  const max = Math.max(1, ...counts);
  return `<div class="row" style="align-items:flex-end;gap:8px;height:132px;flex-wrap:nowrap;">
    ${days.map((d,i)=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;">
      <div style="font-size:12px;color:var(--text-soft);font-variant-numeric:tabular-nums;">${counts[i]||''}</div>
      <div style="width:100%;max-width:28px;height:${Math.max(4,counts[i]/max*80)}px;background:${counts[i]?'var(--brand-grad)':'var(--bg-2)'};border-radius:6px;"></div>
      <div style="font-size:12px;color:var(--text-faint);">${d.toLocaleDateString('ru-RU',{weekday:'short'})}</div>
    </div>`).join('')}
  </div>`;
}

function plural(n, one, few, many){
  const m10 = n%10, m100 = n%100;
  if(m10===1 && m100!==11) return one;
  if(m10>=2 && m10<=4 && (m100<10 || m100>=20)) return few;
  return many;
}

function saveProject(id){

function deleteProject(id){

  dbSave('components', dbList('components').filter(c=>c.projectId!==id));
  dbSave('rows', dbList('rows').filter(r=>r.projectId!==id));
  dbSave('issues', dbList('issues').filter(i=>i.projectId!==id));
  dbSave('files', dbList('files').filter(f=>f.projectId!==id));
  dbSave('runs', dbList('runs').filter(r=>r.projectId!==id));
  dbSave('glossaries', dbList('glossaries').filter(g=>g.projectId!==id));
  const sessIds = new Set(dbQuery('visualSessions', v=>v.projectId===id).map(v=>v.id));
  const shotIds = new Set(dbQuery('visualShots', v=>sessIds.has(v.sessionId)).map(v=>v.id));

  dbSave('visualSessions', dbList('visualSessions').filter(x=>!sessIds.has(x.id)));

}

// Small real trend line for a KPI card — counts real issues per day over the last 7
// days (not a fabricated percentage), so it never claims a number that isn't backed by data.
function last7DayCounts(items, tsField){
  const days = [];
  for(let i=6;i>=0;i--){ const d = new Date(); d.setDate(d.getDate()-i); days.push(d.toDateString()); }
  return days.map(ds => items.filter(x=>new Date(x[tsField]).toDateString()===ds).length);
}
function miniSparkline(counts, color){
  const max = Math.max(1, ...counts);
  const w = 64, h = 22;
  const step = counts.length>1 ? w/(counts.length-1) : 0;
  const points = counts.map((c,i)=>`${(i*step).toFixed(1)},${(h-2-(c/max*(h-4))).toFixed(1)}`).join(' ');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block;overflow:visible;"><polyline points="${points}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".75"/></svg>`;
}
function timeAgo(ts){
  if(!ts) return '';
  const diff = Date.now()-ts;
  const min = Math.floor(diff/60000);
  if(min<1) return 'только что';
  if(min<60) return min+' мин назад';
  const hr = Math.floor(min/60);
  if(hr<24) return hr+' ч назад';
  const days = Math.floor(hr/24);
  if(days<30) return days+' дн назад';
  return fmtDate(new Date(ts).toISOString());
}

function editorsForLanguage(languageCode){

function editorsForLanguages(languageCodes){
  const uniq = [...new Set((languageCodes||[]).map(c=>(c||'').toLowerCase()))];
  if(uniq.length<=1) return editorsForLanguage(uniq[0]);
  const set = new Set();
  uniq.forEach(c=>editorsForLanguage(c).forEach(n=>set.add(n)));

  const p = dbGet('projects', projectId);

  document.querySelectorAll('.lang-check input[type=checkbox]:checked:not(:disabled)').forEach(cb=>{

function inferLanguageFromFilename(filename, languages){
  const lower = filename.toLowerCase();
  const sorted = [...(languages||[])].sort((a,b)=>b.code.length-a.code.length); // longer codes first (en-shtat before en)
  for(const l of sorted){
    const code = l.code.toLowerCase();
    const re = new RegExp('(^|[^a-z0-9])'+code.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'($|[^a-z0-9])', 'i');
    if(re.test(lower)) return l.code;
  }
  return '';
}
async function extractPoFilesFromZip(file){
  const ok = await ensureJSZip();
  if(!ok) throw new Error('JSZip не загрузился — проверь интернет/сеть');
  const buf = await file.arrayBuffer();
  const zip = await JSZip.loadAsync(buf);
  const entries = [];
  for(const path of Object.keys(zip.files)){
    const entry = zip.files[path];
    if(entry.dir || !/\.po$/i.test(path)) continue;
    const content = await entry.async('string');
    entries.push({name: path.split('/').pop(), content, fullPath: path});
  }
  return entries;
}
// Guesses which project folder (component) a zip entry belongs to, so a zip that bundles
// several platforms/sections (e.g. a Weblate export with one subfolder per component) can
// be split automatically instead of dumping everything into one folder.
//   1. the entry's own subfolder inside the zip, if it matches an existing component name
//   2. an existing component's name found as a substring of the filename
//   3. otherwise: the subfolder name as a suggested NEW component (still needs confirming),
//      or nothing
function inferComponentFromPath(fullPath, filename, components){
  const parts = fullPath.split('/').filter(Boolean);
  if(parts.length > 1){
    const folderName = parts[parts.length-2];
    const match = components.find(c=>c.name.toLowerCase()===folderName.toLowerCase());
    return match ? {componentId: match.id, newName: null} : {componentId: null, newName: folderName};
  }
  const lower = filename.toLowerCase();
  const sorted = [...components].sort((a,b)=>b.name.length-a.name.length); // longest first: wb-web-astro before wb-web
  for(const c of sorted){ if(lower.includes(c.name.toLowerCase())) return {componentId: c.id, newName: null}; }
  return {componentId: null, newName: null};
}

async function addFolderPendingFiles(fileList){
  const defaultLang = document.getElementById('folderUploadLanguage') ? document.getElementById('folderUploadLanguage').value : '';
  const languages = folderPendingCtx ? folderPendingCtx.languages : [];
  let added = 0;
  for(const f of fileList){
    const lower = f.name.toLowerCase();
    if(lower.endsWith('.po') || lower.endsWith('.json') || lower.endsWith('.csv') || lower.endsWith('.tsv')){
      folderPendingFiles.push({id:uid(), name:f.name, languageCode: inferLanguageFromFilename(f.name, languages) || defaultLang, source:f});
      added++;
    } else if(lower.endsWith('.zip')){
      try{
        const entries = await extractPoFilesFromZip(f);
        if(!entries.length){ toast('В архиве «'+f.name+'» не нашлось .po файлов'); continue; }
        entries.forEach(en=>{
          folderPendingFiles.push({id:uid(), name:en.name, languageCode: inferLanguageFromFilename(en.name, languages) || defaultLang, source:en.content});
          added++;
        });
      }catch(err){ toast('Не удалось прочитать архив «'+f.name+'»: '+err.message); }
    }
  }
  if(!added){ toast('Выбери .po, .json, .csv файл или .zip с несколькими .po'); return; }
  renderFolderPendingFiles();
}

async function handleFolderPoFiles(projectId, componentId, items){
  const uploadedBy = document.getElementById('folderUploadManager') ? document.getElementById('folderUploadManager').value : '';

  if(!items.length){ toast('Выбери .po файл'); return; }
  const status = document.getElementById('folderUploadStatus');

  const byLanguage = {}; // for a per-language run summary when a zip mixes several languages
  for(const item of items){
    status.textContent = 'Разбираю ' + item.name + '…';
    const text = typeof item.source === 'string' ? item.source : await item.source.text();
    const languageCode = item.languageCode;
    let entries;
    try{ entries = parseTranslationFile(item.name, text); }
    catch(err){ toast('Не удалось прочитать «'+item.name+'»: '+err.message); continue; }
    const fileRec = {id:uid(), projectId, componentId, languageCode, filename:item.name, uploadedAt:nowISO(), rowCount:entries.length, uploadedBy};
    dbUpsert('files', fileRec);
    const rowsArr = dbList('rows');
    const newIdsForThisFile = [];
    entries.forEach(en=>{
      const row = {id:uid(), projectId, componentId, languageCode, fileId:fileRec.id, key:en.key, source:en.source, target:en.target};
      rowsArr.push(row);
      allNewRowIds.push(row.id);
      newIdsForThisFile.push(row.id);
    });
    dbSave('rows', rowsArr);
    (byLanguage[languageCode] = byLanguage[languageCode]||[]).push(...newIdsForThisFile);
    toast('Файл «'+item.name+'» успешно загружен');
  }
  status.textContent = 'Запускаю проверку…';
  await runFullCheckForProject(projectId, allNewRowIds, checkOverride, (done,total,stage)=>{
    status.textContent = (stage==='tech' ? 'Техническая проверка: ' : 'Проверка глоссария: ') + done + ' / ' + total;
  });
  Object.entries(byLanguage).forEach(([languageCode, rowIds])=>{
    const issues = dbQuery('issues', i=>rowIds.includes(i.rowId));
    dbUpsert('runs', {id:uid(), projectId, componentId, languageCode, fileId:null, rowCount:rowIds.length, issueCount:issues.length, createdAt:nowISO(), runBy:uploadedBy});
  });
  const allIssues = dbQuery('issues', i=>allNewRowIds.includes(i.rowId));
  toast('Проверка завершена');

  location.hash = '#/project/'+projectId+'/folder/'+componentId+'/strings';
}

async function addProjectPendingFiles(fileList){
  const defaultLang = document.getElementById('uploadLanguage') ? document.getElementById('uploadLanguage').value : '';
  const defaultComp = document.getElementById('uploadComponent') ? document.getElementById('uploadComponent').value : '';
  const languages = window._projectPendingLanguages || [];
  const components = dbQuery('components', c=>c.projectId===projectPendingProjectId);
  let added = 0, autoSplit = 0;
  for(const f of fileList){
    const lower = f.name.toLowerCase();
    if(lower.endsWith('.po') || lower.endsWith('.json') || lower.endsWith('.csv') || lower.endsWith('.tsv')){
      projectPendingFiles.push({id:uid(), name:f.name, languageCode: inferLanguageFromFilename(f.name, languages) || defaultLang, componentId: defaultComp, source:f});
      added++;
    } else if(lower.endsWith('.zip')){

        const entries = await extractPoFilesFromZip(f);
        if(!entries.length){ toast('В архиве «'+f.name+'» не нашлось .po файлов'); continue; }
        entries.forEach(en=>{
          const hint = inferComponentFromPath(en.fullPath, en.name, components);
          const componentId = hint.componentId || (hint.newName ? '__new__:'+hint.newName : defaultComp);
          if(hint.componentId || hint.newName) autoSplit++;
          projectPendingFiles.push({id:uid(), name:en.name, languageCode: inferLanguageFromFilename(en.name, languages) || defaultLang, componentId, source:en.content});
          added++;
        });
      }catch(err){ toast('Не удалось прочитать архив «'+f.name+'»: '+err.message); }
    }
  }
  if(!added){ toast('Выбери .po, .json, .csv файл или .zip с несколькими .po'); return; }
  if(autoSplit) toast('По структуре архива подобраны папки для '+autoSplit+' файлов — проверь и поправь при необходимости');
  renderProjectPendingFiles();
}

async function uploadProjectPendingFiles(){
  if(!projectPendingProjectId || !projectPendingFiles.length) return;
  if(projectPendingFiles.some(f=>!f.languageCode)){ toast('У некоторых файлов не выбран язык'); return; }
  if(projectPendingFiles.some(f=>!f.componentId)){ toast('У некоторых файлов не выбрана папка'); return; }
  const projectId = projectPendingProjectId;
  const items = projectPendingFiles.slice();
  projectPendingFiles = [];
  renderProjectPendingFiles();
  await handlePoFiles(projectId, items);
}
async function handlePoFiles(projectId, items){
  const uploadedBy = document.getElementById('uploadManager') ? document.getElementById('uploadManager').value : '';
  const checkOverride = document.getElementById('projChkUntranslated') ? readCheckSettingsOverride('projChk') : null;
  if(!items.length){ toast('Выбери файл'); return; }
  const status = document.getElementById('uploadStatus');
  const newComponentIds = {}; // memoize "__new__:name" -> real created component id, so the same suggested name across several files in one batch reuses one folder
  const resolveComponentId = (raw) => {
    if(!raw || !raw.startsWith('__new__:')) return raw;
    const name = raw.slice('__new__:'.length);
    if(newComponentIds[name]) return newComponentIds[name];
    const comp = {id:uid(), projectId, name, createdAt:nowISO()};
    dbUpsert('components', comp);
    newComponentIds[name] = comp.id;
    return comp.id;
  };
  let allNewRowIds = [];
  const byGroup = {}; // "componentId|languageCode" -> rowIds, for per-group run records
  for(const item of items){
    status.textContent = 'Разбираю ' + item.name + '…';
    const text = typeof item.source === 'string' ? item.source : await item.source.text();
    const componentId = resolveComponentId(item.componentId);
    const languageCode = item.languageCode;
    let entries;
    try{ entries = parseTranslationFile(item.name, text); }
    catch(err){ toast('Не удалось прочитать «'+item.name+'»: '+err.message); continue; }
    const fileRec = {id:uid(), projectId, componentId, languageCode, filename:item.name, uploadedAt:nowISO(), rowCount:entries.length, uploadedBy};
    dbUpsert('files', fileRec);
    const rowsArr = dbList('rows');
    const newIdsForThisFile = [];
    entries.forEach(en=>{
      const row = {id:uid(), projectId, componentId, languageCode, fileId:fileRec.id, key:en.key, source:en.source, target:en.target};
      rowsArr.push(row);
      allNewRowIds.push(row.id);
      newIdsForThisFile.push(row.id);
    });
    dbSave('rows', rowsArr);
    const groupKey = componentId+'|'+languageCode;
    (byGroup[groupKey] = byGroup[groupKey]||{componentId, languageCode, rowIds:[]}).rowIds.push(...newIdsForThisFile);
    toast('Файл «'+item.name+'» успешно загружен');
  }
  status.textContent = 'Запускаю проверку…';
  await runFullCheckForProject(projectId, allNewRowIds, checkOverride, (done,total,stage)=>{
    status.textContent = (stage==='tech' ? 'Техническая проверка: ' : 'Проверка глоссария: ') + done + ' / ' + total;
  });
  Object.values(byGroup).forEach(({componentId, languageCode, rowIds})=>{
    const issues = dbQuery('issues', i=>rowIds.includes(i.rowId));
    dbUpsert('runs', {id:uid(), projectId, componentId, languageCode, fileId:null, rowCount:rowIds.length, issueCount:issues.length, createdAt:nowISO(), runBy:uploadedBy});
  });
  const allIssues = dbQuery('issues', i=>allNewRowIds.includes(i.rowId));
  toast('Проверка завершена');
  if(allIssues.some(i=>i.severity==='Критическая')) toast('Найдены критические проблемы');
  status.textContent = '';
  presetStringsTypeFilterFromOverride('projTabStrings', checkOverride);
  location.hash = '#/project/'+projectId+'/content/strings';
}
async function rerunFileCheck(fileId){
  const file = dbGet('files', fileId);
  const rowIds = dbQuery('rows', r=>r.fileId===fileId).map(r=>r.id);
  toast('Перезапускаю проверку…');
  await runFullCheckForProject(file.projectId, rowIds);
  const issues = dbQuery('issues', i=>rowIds.includes(i.rowId));
  dbUpsert('runs', {id:uid(), projectId:file.projectId, componentId:file.componentId, languageCode:file.languageCode, fileId, rowCount:rowIds.length, issueCount:issues.length, createdAt:nowISO()});
  toast('Проверка перезапущена');
  router();
}

function severityClass(s){ return {'Критическая':'critical','Высокая':'high','Средняя':'medium','Низкая':'low'}[s] || 'low'; }
function statusClass(s){ return {'Новая':'st-new','На проверке':'st-review','Принята':'st-accepted','Принята после исправления':'st-accepted','Отклонена':'st-rejected','Ложное срабатывание':'st-fp'}[s] || 'st-new'; }

let runsPageState = {};
function paginateArray(arr, key, pageSize){
  runsPageState[key] = runsPageState[key] || 1;
  const totalPages = Math.max(1, Math.ceil(arr.length/pageSize));
  if(runsPageState[key] > totalPages) runsPageState[key] = totalPages;
  const page = runsPageState[key];
  return { slice: arr.slice((page-1)*pageSize, page*pageSize), page, totalPages };
}
function pagerHtml(key, page, totalPages, total, renderCallExpr){
  return `<div class="pager"><span>${total} шт., стр. ${page} из ${totalPages}</span>
    <button onclick="runsPageState['${key}']=Math.max(1,${page}-1);${renderCallExpr}" ${page<=1?'disabled':''}>←</button>
    <button onclick="runsPageState['${key}']=Math.min(${totalPages},${page}+1);${renderCallExpr}" ${page>=totalPages?'disabled':''}>→</button>
  </div>`;
}
function renderProjectChecks(p){
  return `<div id="projTabChecks"></div>`;
}
function renderProjectChecksTable(projectId){

  if(q) rows = rows.filter(r=>(r.source||'').toLowerCase().includes(q) || (r.target||'').toLowerCase().includes(q) || (r.key||'').toLowerCase().includes(q));

  const rowIdSet = new Set(rows.map(r=>r.id));
  const hasIssueFilter = f.sev.size>0 || f.status.size>0 || f.type.size>0;
  const issuesByRow = {};
  dbList('issues').forEach(i=>{
    if(!rowIdSet.has(i.rowId)) return;

    if(f.status.size && !f.status.has(i.status)) return;
    if(f.type.size && !f.type.has(i.type)) return;
    (issuesByRow[i.rowId] = issuesByRow[i.rowId]||[]).push(i);
  });
  let finalRows = hasIssueFilter ? rows.filter(r=>issuesByRow[r.id] && issuesByRow[r.id].length) : rows;

  const sevRank = {'Критическая':0,'Высокая':1,'Средняя':2,'Низкая':3};
  const rankOf = r => { const arr=issuesByRow[r.id]; if(!arr||!arr.length) return 99; return Math.min(...arr.map(i=>sevRank[i.severity]??9)); };
  finalRows = finalRows.slice().sort((a,b)=> rankOf(a)-rankOf(b) || ((issuesByRow[b.id]||[]).length-(issuesByRow[a.id]||[]).length));

  const pageSize = 25;
  const totalPages = Math.max(1, Math.ceil(finalRows.length/pageSize));

  const tw = document.getElementById(key+'_tablewrap');
  if(!tw) return;
  tw.innerHTML = pageRows.length ? `<div class="table-wrap"><table><thead><tr><th style="width:36px;"></th><th>Ключ</th><th>Язык</th><th>Папка</th><th>Исходный текст</th><th>Перевод</th><th>Проблемы</th><th>Дедлайн</th><th></th></tr></thead><tbody>

      const comp = dbGet('components', r.componentId);

      const nearestDeadline = rowIssues.map(i=>i.deadline).find(Boolean);
      return `<tr class="clickable ${st.selected.has(r.id)?'row-selected':''}" onclick="if(!event.target.closest('input,button,a,.pill'))openRowDetail('${r.id}')">
        <td><input type="checkbox" class="${key}_chk" value="${r.id}" ${st.selected.has(r.id)?'checked':''} onchange="toggleOneIssue('${key}', '${r.id}', this.checked, this)"></td>
        <td class="mono cell-key" title="${esc(r.key||'')}">${esc(r.key||'—')}</td>
        <td>${esc(r.languageCode)}</td>
        <td>${folderBadge(comp)}</td>
        <td class="mono cell-text">${primary?renderFieldWithHighlight(r.source, primary, 'source'):highlightTokens(r.source)}</td>
        <td class="mono cell-text">${primary?renderFieldWithHighlight(r.target, primary, 'target'):highlightTokens(r.target)}</td>
        <td style="min-width:140px;">${pillsHtml}</td>
        <td class="nowrap">${nearestDeadline?formatDeadline(nearestDeadline):'<span class="hint">—</span>'}</td>
        <td class="cell-go">${icon('chevronRight',16)}</td>
      </tr>`;
    }).join('')}
  </tbody></table></div>
  <div class="pager"><span>${finalRows.length} строк, стр. ${st.page} из ${totalPages}</span>
    <button onclick="issuesPageState['${key}'].page=Math.max(1,${st.page}-1);renderRowsIssuesGeneric(issuesFixedFilters['${mountId}'],'${mountId}')" ${st.page<=1?'disabled':''}>←</button>
    <button onclick="issuesPageState['${key}'].page=Math.min(${totalPages},${st.page}+1);renderRowsIssuesGeneric(issuesFixedFilters['${mountId}'],'${mountId}')" ${st.page>=totalPages?'disabled':''}>→</button>
  </div>` : emptyState({icon:'search', compact:true, title:'Ничего не найдено', text:'Попробуй изменить фильтр или поиск.'});

  const masterCb = document.getElementById(key+'_all');
  if(masterCb) masterCb.checked = pageRows.length>0 && pageRows.every(r=>st.selected.has(r.id));
  updateSelectionCount(key);
  st._lastFilteredIds = finalRows.map(r=>r.id);
}

    </div>` : '';
  return `<div class="msel"><button type="button" id="${key}_${field}_btn" class="btn secondary sm ${sel.size?'msel-on':''}" onclick="toggleMselPanel('${key}','${field}')">${esc(summary)}<span class="chev">${icon('chevronDown',14)}</span></button>${panel}</div>`;
