<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LQA — платформа проверки локализации</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3A1672">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- xlsx (SheetJS) is loaded lazily on first use — see ensureXlsx() — so a blocked/stale CDN doesn't affect page load, and a newer build gets a real chance to run instead of an old cached one. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   DESIGN TOKENS
   Type scale: 12 · 13 · 14 · 16 · 20 · 26   Radii: 8 · 12 · 16
   ========================================================= */
:root{
  --bg:#F7F5FB; --bg-2:#F0ECF6; --surface:#FFFFFF; --surface-2:#FAF8FD; --input-bg:#FFFFFF;
  --border:#ECE7F3; --border-strong:#DDD4EA;
  --text:#1F1729; --text-soft:#5B4F68; --text-faint:#8E829C;
  --brand-pink:#D6169E; --brand-purple:#4A1B96; --brand-violet:#7C1FC9;
  --brand-grad:linear-gradient(135deg,#C4169F 0%,#7C1FC9 55%,#4A1B96 100%);
  --side-bg:#2A1150; --side-bg-2:#3A1672; --side-text:rgba(255,255,255,.66); --side-text-active:#FFFFFF;
  --primary:#9A139E; --primary-bg:#F6EAF7; --primary-dark:#6E1090; --focus:rgba(154,19,158,.22);
  --crit:#D92D20; --crit-bg:#FDECEA;
  --high:#C2410C; --high-bg:#FEEFE3;
  --med:#A15C07; --med-bg:#FDF4D8;
  --low:#5B4F68; --low-bg:#F1EDF5;
  --ok:#15803D; --ok-bg:#E3F6EA;
  --purple:#7C1FC9; --purple-bg:#F1E8FB;
  --mark-bg:#F6EAF7; --mark-text:#6E1090;
  --r-sm:8px; --r-md:12px; --r-lg:16px;
  --shadow-sm:0 1px 2px rgba(31,23,41,.05);
  --shadow-md:0 4px 16px rgba(31,23,41,.07), 0 1px 3px rgba(31,23,41,.05);
  --shadow-lg:0 20px 50px rgba(42,17,80,.18), 0 4px 12px rgba(42,17,80,.08);
  --glass-bg:rgba(255,255,255,.78); --glass-border:rgba(236,231,243,.9);
  --overlay:rgba(24,12,40,.36);
  --ease:cubic-bezier(.2,.8,.3,1);
}
:root[data-theme="dark"]{
  --bg:#130D1D; --bg-2:#1D1529; --surface:#1B1426; --surface-2:#211930; --input-bg:#171021;
  --border:#2D2340; --border-strong:#3C2F54;
  --text:#F2ECF8; --text-soft:#C2B3D6; --text-faint:#8C7DA3;
  --side-bg:#170D28; --side-bg-2:#22113D;
  --primary:#D07AD4; --primary-bg:#33203F; --primary-dark:#F0BDF2; --focus:rgba(208,122,212,.28);
  --crit:#F87171; --crit-bg:#3A1A1D;
  --high:#FB923C; --high-bg:#3A2213;
  --med:#FBBF24; --med-bg:#362A12;
  --low:#B7A8CC; --low-bg:#2A2238;
  --ok:#4ADE80; --ok-bg:#15301F;
  --purple:#C4A1F5; --purple-bg:#2C2045;
  --mark-bg:#3A2447; --mark-text:#F0BDF2;
  --shadow-sm:0 1px 2px rgba(0,0,0,.35);
  --shadow-md:0 4px 16px rgba(0,0,0,.35);
  --shadow-lg:0 20px 50px rgba(0,0,0,.55);
  --glass-bg:rgba(19,13,29,.78); --glass-border:rgba(255,255,255,.06);
  --overlay:rgba(0,0,0,.55);
  color-scheme:dark;
}

/* ---- base ---- */
*{box-sizing:border-box;}
html,body{margin:0;min-height:100%;}
body{background:var(--bg);color:var(--text);font:14px/1.5 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01";}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:13px;}
a{color:inherit;}
button{font-family:inherit;}
::selection{background:var(--primary-bg);color:var(--primary-dark);}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;}
.link{color:var(--primary);text-decoration:none;font-weight:500;font-size:13px;}
.link:hover{text-decoration:underline;}

/* ---- shell ---- */
.shell{display:flex;min-height:100vh;}
.sidebar{width:240px;flex:0 0 240px;background:linear-gradient(180deg,var(--side-bg-2) 0%,var(--side-bg) 100%);color:var(--side-text);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;overflow-x:hidden;z-index:40;}
.side-brand{padding:20px 18px 18px;}
.side-brand-row{display:flex;align-items:center;gap:10px;}
.side-logo{width:34px;height:34px;border-radius:10px;background:var(--brand-grad);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 14px rgba(214,22,158,.35);}
.side-logo-text{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:17px;color:#fff;letter-spacing:.01em;line-height:1.1;}
.side-tagline{font-size:12px;color:rgba(255,255,255,.5);line-height:1.3;}
.side-nav{flex:1;padding:4px 12px 12px;}
.side-group-label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.34);padding:18px 10px 6px;}
.side-group-label:first-child{padding-top:4px;}
.side-link{position:relative;display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:var(--r-sm);color:var(--side-text);text-decoration:none;font-size:14px;font-weight:500;cursor:pointer;margin-bottom:2px;transition:background .15s ease,color .15s ease;}
.side-link:hover{background:rgba(255,255,255,.06);color:#fff;}
.side-link.active{background:rgba(255,255,255,.1);color:#fff;}
.side-link.active::before{content:'';position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:linear-gradient(180deg,#F05BC4,#B06CF5);}
.side-link .ic{width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;opacity:.9;}
.side-badge-count{margin-left:auto;background:rgba(255,255,255,.14);color:#fff;font-size:12px;font-weight:600;padding:0 7px;min-width:22px;height:20px;line-height:20px;text-align:center;border-radius:99px;}
.side-foot{padding:14px 16px 16px;border-top:1px solid rgba(255,255,255,.08);}
.theme-toggle{display:flex;gap:2px;background:rgba(255,255,255,.06);border-radius:10px;padding:3px;}
.theme-toggle button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:none;border:none;color:rgba(255,255,255,.6);font-size:12px;font-weight:500;height:30px;border-radius:8px;cursor:pointer;transition:background .15s ease,color .15s ease;}
.theme-toggle button:hover{color:#fff;}
.theme-toggle button.active{background:rgba(255,255,255,.14);color:#fff;}
.side-overlay{display:none;}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{height:60px;flex:0 0 60px;background:var(--glass-bg);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);border-bottom:1px solid var(--glass-border);display:flex;align-items:center;gap:12px;padding:0 28px;position:sticky;top:0;z-index:20;}
.top-ic.menu-btn{display:none;}
.crumbs{font-size:13px;color:var(--text-faint);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.crumbs a{color:var(--text-faint);text-decoration:none;}
.crumbs a:hover{color:var(--text);}
.crumbs b{color:var(--text);font-weight:600;}
.crumbs .sep{margin:0 6px;opacity:.5;}
.top-search{position:relative;width:300px;}
.top-ic.mob-search{display:none;}
.top-search .s-ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-faint);pointer-events:none;display:flex;}
.top-search input[type=text]{width:100%;height:36px;border:1px solid var(--border);border-radius:var(--r-sm);padding:0 52px 0 34px;font-size:13px;background:var(--surface-2);color:var(--text);transition:box-shadow .15s ease,border-color .15s ease,background .15s ease;}
.top-search input[type=text]:hover{border-color:var(--border-strong);}
.top-search input[type=text]:focus{outline:none;border-color:var(--primary);background:var(--surface);box-shadow:0 0 0 3px var(--focus);}
.kbd-hint{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:11px;font-weight:600;color:var(--text-faint);background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:1px 6px;pointer-events:none;}
.top-ic{position:relative;width:36px;height:36px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-soft);background:none;border:none;transition:background .15s ease,color .15s ease;flex-shrink:0;}
.top-ic:hover{background:var(--bg-2);color:var(--text);}
.top-ic .dot{position:absolute;top:7px;right:8px;width:8px;height:8px;background:var(--crit);border-radius:50%;display:none;box-shadow:0 0 0 2px var(--surface);}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--brand-grad);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0;}

.content{padding:28px 32px 64px;flex:1;width:100%;max-width:1480px;margin:0 auto;view-transition-name:page;}
.content.page-enter{animation:pageIn .3s var(--ease);}
@keyframes pageIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:24px;flex-wrap:wrap;}
.page-title{font-size:26px;font-weight:700;margin:0 0 4px;letter-spacing:-.02em;line-height:1.2;}
.page-sub{color:var(--text-soft);font-size:14px;}
.section-label{font-size:12px;font-weight:600;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;margin:24px 0 10px;}

/* ---- project hero: brand gradient, no photo, readable in both themes ---- */
.project-hero{position:relative;background:var(--brand-grad);color:#fff;border-radius:var(--r-lg);padding:24px 28px;margin-bottom:20px;overflow:hidden;box-shadow:0 10px 30px rgba(124,31,201,.22);}
.project-hero::before{content:'';position:absolute;right:-80px;top:-120px;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 65%);pointer-events:none;}
.project-hero::after{content:'';position:absolute;right:160px;bottom:-140px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(255,120,210,.28),transparent 65%);pointer-events:none;}
.project-hero > *{position:relative;z-index:1;}
.project-hero .page-head{margin:0;align-items:flex-start;}
.project-hero .page-title{color:#fff;}
.project-hero .page-sub{color:rgba(255,255,255,.8);}
.hero-avatar{width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,.18);box-shadow:inset 0 0 0 1px rgba(255,255,255,.3);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;flex-shrink:0;backdrop-filter:blur(6px);}
.hero-chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:99px;background:rgba(255,255,255,.14);color:#fff;font-size:12px;font-weight:500;cursor:pointer;border:1px solid rgba(255,255,255,.2);transition:background .15s ease;text-decoration:none;}
.hero-chip:hover{background:rgba(255,255,255,.24);}
.hero-chip i{width:7px;height:7px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 1.5px rgba(255,255,255,.7);}
.btn.on-dark{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.28);box-shadow:none;backdrop-filter:blur(6px);}
.btn.on-dark:hover{background:rgba(255,255,255,.26);filter:none;box-shadow:none;}

/* ---- generic components ---- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:20px;margin-bottom:16px;box-shadow:var(--shadow-sm);}
.card h3{font-size:16px;margin:0 0 14px;font-weight:600;letter-spacing:-.01em;}
.card.clickable{cursor:pointer;transition:box-shadow .2s ease,border-color .2s ease,transform .2s var(--ease);}
.card.clickable:hover{border-color:var(--border-strong);box-shadow:var(--shadow-md);transform:translateY(-2px);}
.grid{display:grid;gap:16px;}
.grid-4{grid-template-columns:repeat(4,minmax(0,1fr));}
.grid-3{grid-template-columns:repeat(3,minmax(0,1fr));}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr));}
@media(max-width:1180px){.grid-4{grid-template-columns:repeat(2,minmax(0,1fr));}.grid-3{grid-template-columns:repeat(2,minmax(0,1fr));}}

.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:16px 18px;box-shadow:var(--shadow-sm);position:relative;}
.kpi .num{font-size:26px;font-weight:700;line-height:1.15;letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
.kpi .lbl{color:var(--text-soft);font-size:13px;margin-top:4px;}
.kpi.crit .num{color:var(--crit);} .kpi.high .num{color:var(--high);} .kpi.ok .num{color:var(--ok);}
.kpi.crit{box-shadow:inset 3px 0 0 var(--crit),var(--shadow-sm);} .kpi.high{box-shadow:inset 3px 0 0 var(--high),var(--shadow-sm);}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;background:var(--brand-grad);color:#fff;border:1px solid transparent;border-radius:var(--r-sm);padding:0 16px;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap;box-shadow:0 2px 8px rgba(154,19,158,.25);transition:box-shadow .15s ease,transform .1s ease,filter .15s ease,background .15s ease;}
.btn:hover{filter:brightness(1.07);box-shadow:0 4px 14px rgba(154,19,158,.32);}
.btn:active{transform:translateY(1px);}
.btn.secondary{background:var(--surface);color:var(--text);border-color:var(--border-strong);box-shadow:var(--shadow-sm);}
.btn.secondary:hover{background:var(--bg-2);filter:none;}
.btn.ghost{background:none;color:var(--primary);border-color:transparent;box-shadow:none;padding:0 8px;}
.btn.ghost:hover{background:var(--primary-bg);filter:none;box-shadow:none;}
.btn.danger{background:var(--surface);color:var(--crit);border-color:color-mix(in srgb,var(--crit) 35%,transparent);box-shadow:none;}
.btn.danger:hover{background:var(--crit-bg);filter:none;box-shadow:none;}
.btn.sm{height:30px;padding:0 12px;font-size:13px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.row.between{justify-content:space-between;}

label.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--text-soft);font-weight:500;}
input[type=text],input[type=number],input[type=date],input[type=url],input[type=file],select,textarea{
  border:1px solid var(--border-strong);border-radius:var(--r-sm);padding:0 12px;height:36px;font-size:14px;background:var(--input-bg);color:var(--text);font-family:inherit;transition:border-color .15s ease,box-shadow .15s ease;
}
input[type=file]{padding:6px 10px;height:auto;}
textarea{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:13px;padding:10px 12px;height:auto;min-height:80px;line-height:1.5;}
input:hover,select:hover,textarea:hover{border-color:color-mix(in srgb,var(--primary) 30%,var(--border-strong));}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--focus);}
input[type=checkbox],input[type=radio]{accent-color:var(--primary);width:16px;height:16px;cursor:pointer;vertical-align:-3px;}

.tabbar{display:flex;gap:2px;margin-bottom:20px;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;}
.tabbtn{position:relative;background:none;border:none;padding:10px 14px;font-size:14px;font-weight:500;color:var(--text-faint);cursor:pointer;white-space:nowrap;transition:color .15s ease;}
.tabbtn:hover{color:var(--text);}
.tabbtn.active{color:var(--text);font-weight:600;}
.tabbtn.active::after{content:'';position:absolute;left:10px;right:10px;bottom:-1px;height:2px;border-radius:2px;background:var(--brand-grad);}
.subtabbar{display:inline-flex;gap:2px;margin:-4px 0 18px;padding:3px;background:var(--bg-2);border-radius:10px;}
.subtabbtn{background:none;border:none;height:30px;padding:0 14px;font-size:13px;font-weight:500;color:var(--text-soft);cursor:pointer;border-radius:8px;transition:background .15s ease,color .15s ease;}
.subtabbtn:hover{color:var(--text);}
.subtabbtn.active{background:var(--surface);color:var(--text);font-weight:600;box-shadow:var(--shadow-sm);}

.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border-strong);color:var(--text-soft);font-size:13px;font-weight:500;height:32px;padding:0 12px;border-radius:99px;cursor:pointer;margin-right:6px;transition:background .15s ease,border-color .15s ease,color .15s ease;}
.chip:hover{border-color:var(--primary);color:var(--text);}
.chip-sep{width:1px;height:22px;background:var(--border-strong);margin:0 10px 0 4px;}
.chip-view{padding:0 4px 0 0;gap:0;}
.chip-view>button{background:none;border:none;color:inherit;font:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:5px;height:100%;padding:0 6px 0 12px;}
.chip-view .chip-x{padding:0 6px;opacity:.5;}
.chip-view .chip-x:hover{opacity:1;color:var(--crit);}
.chip-view svg{flex-shrink:0;}
.chip-save{border-style:dashed;color:var(--text-faint);}
.cmdk-bg{position:fixed;inset:0;background:var(--overlay);backdrop-filter:blur(3px);z-index:500;display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px;animation:fadeIn .12s ease;}
.cmdk{width:100%;max-width:620px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);overflow:hidden;display:flex;flex-direction:column;max-height:70vh;animation:cmdkIn .16s cubic-bezier(.2,.8,.3,1);}
@keyframes cmdkIn{from{opacity:0;transform:translateY(-8px) scale(.985);}to{opacity:1;transform:none;}}
.cmdk-in{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border);color:var(--text-faint);}
.cmdk-in input{flex:1;border:none;outline:none;background:none;font-size:16px;color:var(--text);padding:0;box-shadow:none;min-width:0;}
.cmdk-list{overflow-y:auto;padding:6px;}
.cmdk-group{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);padding:10px 10px 4px;}
.cmdk-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;cursor:pointer;min-width:0;}
.cmdk-item.sel{background:var(--primary-bg);}
.cmdk-item.sel .cmdk-ic{color:var(--primary);}
.cmdk-ic{color:var(--text-faint);display:flex;flex-shrink:0;}
.cmdk-label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;font-size:14px;}
.cmdk-hint{margin-left:auto;padding-left:10px;font-size:12px;color:var(--text-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%;flex-shrink:1;}
.cmdk-esc{font-size:11px;font-weight:600;border:1px solid var(--border-strong);border-radius:6px;padding:2px 6px;color:var(--text-faint);}
.cmdk-empty{padding:26px;text-align:center;color:var(--text-faint);}
.cmdk-foot{display:flex;gap:16px;padding:9px 16px;border-top:1px solid var(--border);font-size:12px;color:var(--text-faint);}
.cmdk-foot b{font-weight:600;color:var(--text-soft);}
@media (max-width:640px){ .cmdk-bg{padding-top:10px;} .cmdk-foot{display:none;} }
.chip-active{background:var(--primary-bg);border-color:var(--primary);color:var(--primary-dark);font-weight:600;}
.chip-count{background:var(--bg-2);color:var(--text-soft);border-radius:99px;padding:0 7px;font-size:12px;font-weight:600;line-height:18px;}
.chip-active .chip-count{background:color-mix(in srgb,var(--primary) 18%,transparent);color:var(--primary-dark);}

table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;}
th{text-align:left;color:var(--text-faint);font-size:12px;font-weight:600;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface-2);position:sticky;top:0;z-index:1;}
td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle;transition:background .1s ease;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:var(--surface-2);}
tr.clickable{cursor:pointer;}
tr.row-selected td{background:var(--primary-bg)!important;}
td.nowrap,th.nowrap{white-space:nowrap;}
td.cell-text{min-width:200px;max-width:320px;word-break:break-word;line-height:1.45;}
td.cell-key{max-width:170px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-soft);}
td.cell-go{width:36px;padding-left:0;color:var(--text-faint);text-align:right;}
tr.clickable:hover td.cell-go{color:var(--primary);}
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);overflow:auto;box-shadow:var(--shadow-sm);}
.card .table-wrap{box-shadow:none;}

.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:99px;font-size:12px;font-weight:500;white-space:nowrap;line-height:1;}
.pill.sev-critical,.pill.sev-high,.pill.sev-medium,.pill.sev-low{padding-left:8px;}
.pill.sev-critical::before,.pill.sev-high::before,.pill.sev-medium::before,.pill.sev-low::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0;}
.pill.sev-critical{background:var(--crit-bg);color:var(--crit);}
.pill.sev-high{background:var(--high-bg);color:var(--high);}
.pill.sev-medium{background:var(--med-bg);color:var(--med);}
.pill.sev-low{background:var(--low-bg);color:var(--low);}
.pill.sev-ok{background:var(--ok-bg);color:var(--ok);}
.pill.st-new{background:var(--primary-bg);color:var(--primary-dark);}
.pill.st-review{background:var(--purple-bg);color:var(--purple);}
.pill.st-accepted{background:var(--ok-bg);color:var(--ok);}
.pill.st-rejected{background:var(--low-bg);color:var(--text-soft);}
.pill.st-fp{background:var(--mark-bg);color:var(--mark-text);}
.pill.type{background:transparent;color:var(--text-soft);border:1px solid var(--border-strong);}

.badge{display:inline-flex;align-items:center;gap:4px;background:var(--primary-bg);color:var(--primary-dark);border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600;}
.msel{position:relative;display:inline-block;}
.msel > .btn.secondary{color:var(--text-soft);font-weight:500;}
.msel > .btn.secondary .chev{opacity:.55;margin-left:-2px;}
.msel > .btn.msel-on{background:var(--primary-bg);border-color:var(--primary);color:var(--primary-dark);font-weight:600;}
.msel-panel{position:fixed;z-index:200;background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--r-md);box-shadow:var(--shadow-lg);padding:8px;min-width:220px;max-width:min(320px, calc(100vw - 16px));max-height:min(300px, calc(100vh - 16px));overflow:auto;animation:popIn .14s var(--ease);}
@keyframes popIn{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}
.msel-panel label{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 8px;border-radius:6px;white-space:nowrap;cursor:pointer;}
.msel-panel label:hover{background:var(--bg-2);}
.msel-panel label input{flex-shrink:0;}
.msel-actions{display:flex;align-items:center;gap:10px;margin-top:6px;padding:8px 4px 2px;border-top:1px solid var(--border);}

/* ---- empty states: the only place illustrations live ---- */
.empty{text-align:center;color:var(--text-faint);padding:40px 20px;font-size:14px;}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:4px;font-weight:600;}
.empty-state{display:flex;flex-direction:column;align-items:center;text-align:center;padding:48px 20px;color:var(--text-soft);font-size:14px;}
.empty-state img{width:200px;max-width:70%;border-radius:var(--r-lg);margin-bottom:20px;box-shadow:0 8px 28px rgba(124,31,201,.14);}
.empty-state .es-ic{width:48px;height:48px;border-radius:14px;background:var(--primary-bg);color:var(--primary);display:flex;align-items:center;justify-content:center;margin-bottom:14px;}
.empty-state b{display:block;color:var(--text);font-size:16px;font-weight:600;margin-bottom:4px;}
.empty-state .es-text{margin:0 0 18px;max-width:440px;line-height:1.55;}
.empty-state .es-text:last-child{margin-bottom:0;}
.es-steps{text-align:left;margin:4px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;}
.empty-state.compact{padding:28px 16px;}
.empty-state.compact img{width:140px;margin-bottom:14px;}
:root[data-theme="dark"] .empty-state img,:root[data-theme="dark"] .illustration{filter:brightness(.82) saturate(.9);box-shadow:0 8px 28px rgba(0,0,0,.4);}
.hint{font-size:13px;color:var(--text-faint);line-height:1.5;margin-top:8px;}

.drop{display:flex;flex-direction:column;align-items:center;border:1.5px dashed var(--border-strong);border-radius:var(--r-md);padding:28px 24px;text-align:center;background:var(--surface-2);cursor:pointer;transition:border-color .15s ease,background .15s ease;}
.drop:hover,.drop.drag{border-color:var(--primary);background:var(--primary-bg);}
.drop img{width:120px;border-radius:var(--r-md);margin-bottom:14px;box-shadow:0 6px 18px rgba(124,31,201,.12);}
.drop strong{display:block;font-size:14px;font-weight:600;margin-bottom:4px;color:var(--text);}
.drop span{color:var(--text-faint);font-size:13px;max-width:620px;line-height:1.5;}
input[type=file].hidden-input{display:none;}

.pager{display:flex;gap:6px;align-items:center;justify-content:flex-end;padding:12px 4px;font-size:13px;color:var(--text-soft);}
.pager span{margin-right:6px;}
.pager button{background:var(--surface);color:var(--text);border:1px solid var(--border-strong);border-radius:var(--r-sm);width:32px;height:30px;cursor:pointer;font-size:13px;transition:background .15s ease;}
.pager button:hover:not(:disabled){background:var(--bg-2);}
.pager button:disabled{opacity:.4;cursor:not-allowed;}

/* modal */
.modal-bg{position:fixed;inset:0;background:var(--overlay);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:360;animation:fadeIn .15s ease;padding:16px;}
.modal{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:24px 26px;width:540px;max-width:100%;max-height:88vh;overflow:auto;box-shadow:var(--shadow-lg);animation:modalIn .2s var(--ease);}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes modalIn{from{opacity:0;transform:translateY(8px) scale(.98);}to{opacity:1;transform:none;}}
.modal h3{margin:0 0 4px;font-size:18px;font-weight:600;letter-spacing:-.01em;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;}
.detail-panel{position:fixed;top:0;right:0;bottom:0;width:480px;max-width:100vw;background:var(--surface);box-shadow:var(--shadow-lg);z-index:300;transform:translateX(100%);transition:transform .28s var(--ease);overflow-y:auto;border-left:1px solid var(--border);}
.detail-panel.open{transform:translateX(0);}
.detail-panel-inner{padding:24px;}
.detail-panel-overlay{position:fixed;inset:0;background:var(--overlay);z-index:299;opacity:0;pointer-events:none;transition:opacity .2s ease;}
.detail-panel-overlay.open{opacity:1;pointer-events:auto;}
.detail-panel-close{position:absolute;top:18px;right:18px;width:32px;height:32px;background:var(--bg-2);border:none;border-radius:50%;font-size:16px;line-height:1;color:var(--text-soft);cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;transition:background .15s ease,color .15s ease;}
.detail-panel-close:hover{background:var(--primary-bg);color:var(--primary-dark);}

/* toast */
.toasts{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:400;}
.toast{background:#1F1729;color:#fff;padding:12px 16px;border-radius:10px;font-size:13px;box-shadow:var(--shadow-lg);max-width:360px;border-left:3px solid var(--brand-pink);animation:toastIn .25s var(--ease);}
:root[data-theme="dark"] .toast{background:#2D2340;}
@keyframes toastIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

.bars{display:flex;flex-direction:column;gap:10px;}
.bar-row{display:grid;grid-template-columns:minmax(90px,160px) 1fr 44px;gap:12px;align-items:center;font-size:13px;}
.bar-row > span:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--text-soft);}
.bar-track{background:var(--bg-2);border-radius:99px;height:8px;overflow:hidden;}
.bar-fill{height:100%;border-radius:99px;}

.mark{background:var(--mark-bg);color:var(--mark-text);border-radius:3px;padding:0 2px;}
.issue-hl-crit{background:var(--crit-bg);color:var(--crit);font-weight:600;border-radius:3px;padding:0 3px;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--crit) 35%,transparent);}
.issue-hl-high{background:var(--high-bg);color:var(--high);font-weight:600;border-radius:3px;padding:0 3px;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--high) 30%,transparent);}
.issue-hl-med{background:var(--med-bg);color:var(--med);font-weight:600;border-radius:3px;padding:0 3px;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--med) 30%,transparent);}
.issue-hl-low{background:var(--low-bg);color:var(--low);font-weight:600;border-radius:3px;padding:0 3px;}
.found-expected{display:flex;align-items:center;gap:8px;font-family:"IBM Plex Mono",monospace;font-size:13px;background:var(--bg-2);border-radius:var(--r-sm);padding:8px 12px;margin-top:4px;}
.found-expected b{color:var(--crit);font-weight:600;}
.found-expected .arrow{color:var(--text-faint);}
.found-expected .to{color:var(--ok);font-weight:600;}
.checklist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 24px;}
.checkrow{display:flex;align-items:center;gap:10px;font-size:14px;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer;}
.lang-group{display:flex;flex-wrap:wrap;gap:8px 18px;margin-bottom:4px;}
.lang-check{display:flex;align-items:center;gap:6px;font-size:14px;white-space:nowrap;cursor:pointer;}
.lang-check input:disabled{opacity:.5;}

/* project cards */
.proj-card{display:flex;flex-direction:column;gap:14px;padding:18px 20px;margin:0;}
.proj-card-head{display:flex;gap:12px;align-items:flex-start;}
.proj-ava{width:40px;height:40px;border-radius:11px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;}
.proj-card-title{font-size:16px;font-weight:600;margin:0;line-height:1.3;letter-spacing:-.01em;}
.proj-card-desc{font-size:13px;color:var(--text-faint);margin-top:2px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.proj-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-top:14px;border-top:1px solid var(--border);}
.proj-stats div{font-size:12px;color:var(--text-faint);}
.proj-stats b{display:block;font-size:16px;color:var(--text);font-weight:600;font-variant-numeric:tabular-nums;}
.proj-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--text-faint);}
.dots{display:flex;gap:4px;align-items:center;}
.dots i{width:8px;height:8px;border-radius:50%;display:inline-block;}
.proj-card-new{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:180px;border:1.5px dashed var(--border-strong);border-radius:var(--r-md);color:var(--text-soft);font-weight:500;cursor:pointer;background:transparent;transition:border-color .15s ease,color .15s ease,background .15s ease;font-size:14px;}
.proj-card-new:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-bg);}

.onboard{display:grid;grid-template-columns:1fr 280px;max-width:820px;padding:0;overflow:hidden;}
.onboard-body{padding:24px 28px;}
.onboard-art{background:linear-gradient(135deg,#F3E8FB,#FBE7F3);display:flex;align-items:center;justify-content:center;padding:20px;}
.onboard-art img{width:100%;border-radius:var(--r-md);box-shadow:0 8px 24px rgba(124,31,201,.16);}
:root[data-theme="dark"] .onboard-art{background:linear-gradient(135deg,#2A1B3F,#351A36);}
.step{display:flex;align-items:center;gap:12px;font-size:14px;}
.step-n{width:24px;height:24px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--primary-bg);color:var(--primary-dark);}
.step.done{color:var(--text-faint);}
.step.done .step-n{background:var(--ok-bg);color:var(--ok);}

.danger-zone{border-color:color-mix(in srgb,var(--crit) 30%,var(--border));}
.danger-zone h3{color:var(--crit);}

/* ---- visual check ---- */
.drop.drop-compact{flex-direction:row;gap:14px;padding:14px 18px;justify-content:flex-start;text-align:left;}
.drop.drop-compact strong{margin:0;}
.vs-mosaic{height:140px;background:var(--bg-2);display:flex;gap:2px;overflow:hidden;align-items:stretch;justify-content:center;color:var(--text-faint);}
.vs-mosaic > span{display:flex;align-items:center;}
.vs-mosaic img{flex:1;min-width:0;object-fit:cover;object-position:top;}
.shot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;}
.shot-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;cursor:pointer;transition:box-shadow .2s ease,transform .2s var(--ease),border-color .2s ease;}
.shot-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);border-color:var(--border-strong);}
.shot-thumb{position:relative;aspect-ratio:16/10;background:var(--bg-2);overflow:hidden;}
.shot-thumb img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;}
.shot-count{position:absolute;top:8px;right:8px;box-shadow:var(--shadow-sm);}
.shot-ai{position:absolute;top:8px;left:8px;width:22px;height:22px;border-radius:50%;background:var(--brand-grad);color:#fff;display:flex;align-items:center;justify-content:center;}
.shot-meta{padding:8px 12px;font-size:13px;display:flex;justify-content:space-between;gap:8px;}
.shot-meta > span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.thumb-sm{width:64px;height:40px;object-fit:cover;object-position:top;border-radius:6px;border:1px solid var(--border);flex-shrink:0;}
.shot-crop{position:relative;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--border);background:var(--bg-2);}
.vbox{position:absolute;border:2px solid var(--primary);border-radius:4px;box-shadow:0 0 0 9999px rgba(0,0,0,0);background:color-mix(in srgb,var(--primary) 10%,transparent);}
.vbox.sev-critical{border-color:#EF4444;background:rgba(239,68,68,.1);} .vbox.sev-high{border-color:#F97316;background:rgba(249,115,22,.1);}
.vbox.sev-medium{border-color:#EAB308;background:rgba(234,179,8,.1);} .vbox.sev-low{border-color:#A78BFA;background:rgba(167,139,250,.12);}
.vbox > span{position:absolute;top:-11px;left:-11px;width:22px;height:22px;border-radius:50%;background:#1F1729;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px #fff;}
.vbox.draft{border-style:dashed;border-color:#fff;background:rgba(214,22,158,.18);box-shadow:0 0 0 1px rgba(0,0,0,.4);}
.vbox.focus{box-shadow:0 0 0 3px rgba(255,255,255,.95),0 0 0 7px rgba(214,22,158,.55),0 0 24px rgba(214,22,158,.6);z-index:2;}
body.viewer-open{overflow:hidden;}
.viewer{position:fixed;inset:0;z-index:350;background:#120B1C;color:#fff;display:flex;flex-direction:column;animation:fadeIn .15s ease;}
.viewer-top{height:56px;flex:0 0 56px;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid rgba(255,255,255,.08);}
.viewer-top .top-ic:hover{background:rgba(255,255,255,.08);}
.viewer-body{flex:1;min-height:0;display:flex;}
.viewer-stage{flex:1;min-width:0;overflow:auto;padding:24px;display:flex;justify-content:center;align-items:flex-start;}
.viewer-canvas{position:relative;display:inline-block;cursor:crosshair;user-select:none;touch-action:none;max-width:100%;box-shadow:0 10px 40px rgba(0,0,0,.5);border-radius:4px;}
.viewer-canvas img{display:block;max-width:100%;height:auto;border-radius:4px;pointer-events:none;}
.viewer-canvas .vbox:not(.draft){cursor:pointer;}
.viewer-side{width:380px;flex:0 0 380px;background:var(--surface);color:var(--text);overflow-y:auto;padding:18px;border-left:1px solid var(--border);}
.v-issue{border:1px solid var(--border);border-radius:var(--r-md);padding:10px 12px;margin-bottom:10px;cursor:pointer;transition:border-color .15s ease,background .15s ease;}
.v-issue:hover{border-color:var(--border-strong);}
.v-issue.focus{border-color:var(--primary);background:var(--primary-bg);}
.v-num{width:22px;height:22px;border-radius:50%;background:#1F1729;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.v-row{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--text);}
.v-row:hover{background:var(--bg-2);}
.v-row input{margin-top:2px;flex-shrink:0;}
@media(max-width:900px){ .viewer-body{flex-direction:column;} .viewer-side{width:auto;flex:0 0 auto;max-height:45vh;border-left:none;border-top:1px solid var(--border);} .viewer-stage{padding:12px;} }

/* compare mode */
.btn.on-dark.is-on{background:rgba(255,255,255,.3);border-color:rgba(255,255,255,.5);}
.viewer-stage.compare{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;justify-content:stretch;}
.compare-pane{min-width:0;display:flex;flex-direction:column;gap:8px;}
.compare-pane .viewer-canvas{display:block;}
.viewer-canvas.ref{cursor:default;opacity:.95;}
.compare-label{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:600;color:rgba(255,255,255,.7);text-transform:uppercase;letter-spacing:.05em;height:26px;}
.compare-nav{display:flex;align-items:center;gap:6px;text-transform:none;letter-spacing:0;font-weight:500;}
.compare-nav button{background:rgba(255,255,255,.1);border:none;color:#fff;width:24px;height:24px;border-radius:6px;cursor:pointer;font-size:15px;line-height:1;}
.compare-nav button:hover{background:rgba(255,255,255,.2);}
.compare-empty{border:1.5px dashed rgba(255,255,255,.2);border-radius:8px;padding:40px 20px;text-align:center;color:rgba(255,255,255,.6);font-size:13px;}
@media(max-width:900px){ .viewer-stage.compare{grid-template-columns:1fr;} }
/* dialogs + toasts with actions */
.dialog-bg{position:fixed;inset:0;z-index:500;background:var(--overlay);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .15s ease;}
.dialog{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);width:440px;max-width:100%;padding:24px;animation:modalIn .2s var(--ease);}
.dialog h3{margin:0 0 6px;font-size:18px;font-weight:600;letter-spacing:-.01em;}
.dialog-text{color:var(--text-soft);font-size:14px;line-height:1.55;}
.dialog-ic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:14px;background:var(--primary-bg);color:var(--primary);}
.dialog-ic.danger{background:var(--crit-bg);color:var(--crit);}
.btn.danger-solid{background:var(--crit);color:#fff;box-shadow:0 2px 8px color-mix(in srgb,var(--crit) 35%,transparent);}
.btn.danger-solid:hover{filter:brightness(1.08);}
.toast{display:flex;align-items:center;gap:14px;}
.toast.out{animation:toastOut .22s ease forwards;}
@keyframes toastOut{to{opacity:0;transform:translateY(6px);}}
.toast-action{background:rgba(255,255,255,.14);color:#fff;border:none;border-radius:6px;height:28px;padding:0 10px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;margin-left:auto;}
.toast-action:hover{background:rgba(255,255,255,.26);}
.plural-forms{display:flex;flex-direction:column;gap:4px;margin-top:4px;}
.plural-forms > div{display:flex;gap:8px;align-items:flex-start;background:var(--bg-2);border-radius:8px;padding:6px 10px;}
.plural-forms > div > span{width:20px;height:20px;border-radius:50%;background:var(--surface);color:var(--text-soft);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.kb-focus td{background:var(--primary-bg)!important;}
.kb-focus td:first-child{box-shadow:inset 3px 0 0 var(--primary);}
kbd{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;border-radius:5px;border:1px solid var(--border-strong);border-bottom-width:2px;background:var(--surface);font:600 11px/1 "Inter",system-ui,sans-serif;color:var(--text-soft);}
.kb-hint{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:12px;color:var(--text-faint);padding:0 4px 8px;}
.kb-hint span{display:inline-flex;gap:4px;align-items:center;}
.kb-hint a{margin-left:auto;color:var(--text-faint);text-decoration:none;display:inline-flex;gap:6px;align-items:center;}
.kb-hint a:hover{color:var(--primary);}
.kb-help .kb-line{display:flex;justify-content:space-between;gap:16px;padding:6px 0;border-bottom:1px solid var(--border);font-size:14px;}
.kb-help .kb-line > span:first-child{display:inline-flex;gap:4px;}
.kb-help .kb-line > span:last-child{color:var(--text-soft);text-align:right;}
@media(max-width:900px){ .kb-hint{display:none;} }
/* ---- motion ---- */
@keyframes rise{from{opacity:0;transform:translateY(10px) scale(.985);}to{opacity:1;transform:none;}}
@keyframes ringIn{from{stroke-dashoffset:var(--c);}}
.entering .stagger > *{animation:rise .5s var(--ease) both;animation-delay:calc(var(--i,0) * 45ms);}
.entering .ring-val{animation:ringIn 1.1s var(--ease) both;}
.entering .dash-hero{animation:rise .5s var(--ease) both;}
::view-transition-old(page){animation:vtOut .18s ease both;}
::view-transition-new(page){animation:vtIn .32s var(--ease) both;}
@keyframes vtOut{to{opacity:0;transform:translateY(-6px);}}
@keyframes vtIn{from{opacity:0;transform:translateY(10px);}}
html.nav-vt::view-transition-old(root),html.nav-vt::view-transition-new(root){animation:none;}
html.theme-vt::view-transition-old(root),html.theme-vt::view-transition-new(root){animation:none;mix-blend-mode:normal;}
html.theme-vt::view-transition-old(page),html.theme-vt::view-transition-new(page){animation:none;}
.btn:active,.lang-card:active,.chip:active{transform:scale(.98);}

/* ---- dashboard ---- */
:root{--ring-track:var(--bg-2);}
.dash-hero{position:relative;overflow:hidden;display:flex;align-items:center;gap:24px;justify-content:space-between;background:var(--brand-grad);color:#fff;border-radius:20px;padding:28px 32px;margin-bottom:20px;box-shadow:0 14px 40px rgba(124,31,201,.25);}
.dash-hero::before{content:'';position:absolute;inset:-40% -10% auto auto;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 62%);pointer-events:none;}
.dash-hero::after{content:'';position:absolute;left:30%;bottom:-220px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(255,110,205,.32),transparent 65%);pointer-events:none;}
.dash-hero > *{position:relative;z-index:1;}
.dash-hello{font-size:14px;opacity:.85;margin-bottom:6px;}
.dash-hero h1{margin:0 0 6px;font-size:28px;letter-spacing:-.02em;line-height:1.2;}
.dash-hero p{margin:0;opacity:.85;font-size:14px;}
.dash-hero p b{color:#fff;}
.dash-hero-ring{position:relative;flex-shrink:0;width:132px;height:132px;--ring-track:rgba(255,255,255,.2);}
.dash-hero-ring > div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.dash-hero-ring b{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1;}
.dash-hero-ring span{font-size:12px;opacity:.8;margin-top:4px;}
.notice{display:flex;align-items:center;gap:12px;background:var(--med-bg);color:var(--text);border:1px solid color-mix(in srgb,var(--med) 30%,transparent);border-radius:var(--r-md);padding:10px 12px 10px 16px;margin-bottom:20px;font-size:13px;}
.notice > svg{color:var(--med);}
.notice span{flex:1;}
.kpi-ic{width:34px;height:34px;border-radius:10px;background:var(--primary-bg);color:var(--primary);display:flex;align-items:center;justify-content:center;margin-bottom:12px;}
.kpi.crit .kpi-ic{background:var(--crit-bg);color:var(--crit);} .kpi.ok .kpi-ic{background:var(--ok-bg);color:var(--ok);}
.kpi.ok{box-shadow:inset 3px 0 0 var(--ok),var(--shadow-sm);}
.delta{font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;margin-bottom:4px;}
.delta.up{background:var(--crit-bg);color:var(--crit);} .delta.down{background:var(--ok-bg);color:var(--ok);}
.section-title{font-size:18px;font-weight:650;margin:0;letter-spacing:-.01em;}
.lang-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;}
.lang-card{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:16px;box-shadow:var(--shadow-sm);transition:transform .2s var(--ease),box-shadow .2s ease,border-color .2s ease;}
.lang-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:var(--border-strong);}
.lang-card:focus-visible{outline:2px solid var(--primary);outline-offset:2px;}
.lang-card-head{display:flex;align-items:center;gap:12px;}
.lang-flag{width:40px;height:40px;border-radius:12px;background:var(--bg-2);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
.lang-name{font-weight:600;font-size:15px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lang-code{font-size:12px;color:var(--text-faint);margin-top:1px;}
.lang-ring{position:relative;width:48px;height:48px;flex-shrink:0;}
.lang-ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--text);}
.lang-bar{display:flex;gap:2px;height:6px;border-radius:99px;overflow:hidden;background:var(--bg-2);}
.lang-bar i{display:block;height:100%;}
.lang-stats{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;align-items:end;font-size:12px;color:var(--text-faint);}
.lang-stats b{display:block;font-size:16px;color:var(--text);font-weight:650;font-variant-numeric:tabular-nums;}
.lang-spark{display:flex;align-items:flex-end;gap:2px;height:24px;}
.lang-spark i{width:4px;border-radius:2px;background:var(--primary);}
.dash-split{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);}
.attn{display:flex;flex-direction:column;}
.attn-item{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;padding:12px 8px;border-bottom:1px solid var(--border);border-radius:8px;transition:background .15s ease;}
.attn-item:last-child{border-bottom:none;}
.attn-item:hover{background:var(--surface-2);}
.attn-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;background:var(--low);}
.attn-dot.sev-critical{background:var(--crit);box-shadow:0 0 0 4px var(--crit-bg);} .attn-dot.sev-high{background:var(--high);box-shadow:0 0 0 4px var(--high-bg);} .attn-dot.sev-medium{background:var(--med);}
.attn-title{font-size:14px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.attn-meta{font-size:12px;color:var(--text-faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
@media(max-width:1100px){ .dash-split{grid-template-columns:minmax(0,1fr);} }
@media(max-width:700px){ .dash-hero{flex-direction:column;align-items:flex-start;padding:22px;} .dash-hero h1{font-size:22px;} .dash-hero-ring{align-self:center;} .notice{flex-wrap:wrap;} }
.side-badge-count.me{background:linear-gradient(135deg,#F05BC4,#B06CF5);}
.chg{display:inline-flex;gap:8px;align-items:center;font-variant-numeric:tabular-nums;font-weight:600;font-size:13px;}
.chg-fix{color:var(--ok);} .chg-new{color:var(--crit);} .chg-keep{color:var(--text-soft);font-weight:500;}
.trend-legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;font-size:12px;color:var(--text-soft);}
.trend-legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle;}
.discussion{display:flex;flex-direction:column;gap:10px;margin-bottom:10px;}
.bubble{display:flex;gap:10px;align-items:flex-start;}
.bubble-ava{width:28px;height:28px;border-radius:50%;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.bubble > div{background:var(--bg-2);border-radius:4px 12px 12px 12px;padding:8px 12px;min-width:0;max-width:100%;}
.bubble.mine > div{background:var(--primary-bg);}
.bubble-meta{font-size:12px;color:var(--text-faint);margin-bottom:2px;}
.bubble-meta b{color:var(--text-soft);font-weight:600;}
.bubble-text{font-size:14px;white-space:pre-wrap;word-break:break-word;}
.comment-box{display:flex;gap:8px;align-items:flex-end;}
.comment-box textarea{flex:1;min-height:44px;font-family:inherit;font-size:14px;resize:vertical;}
.history-log{margin-top:14px;font-size:13px;}
.history-log summary{cursor:pointer;color:var(--text-soft);font-weight:500;}
.ctx-shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;}
.ctx-shot{all:unset;cursor:pointer;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--surface);transition:box-shadow .15s ease,transform .15s ease;}
.ctx-shot:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);}
.ctx-shot img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top;}
.ctx-shot span{display:block;font-size:11px;color:var(--text-soft);padding:4px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tm{margin-top:10px;}
.tm-item{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;gap:10px;width:100%;cursor:pointer;padding:7px 10px;border-radius:8px;background:var(--bg-2);margin-bottom:4px;font-size:13px;}
.tm-item:hover{background:var(--primary-bg);}
.tm-meta{font-size:12px;color:var(--text-faint);white-space:nowrap;}
.ai-summary{border-color:color-mix(in srgb,var(--primary) 30%,var(--border));background:linear-gradient(180deg,var(--primary-bg),var(--surface) 70%);}
.ai-prio{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:14px;}
.sync-badge .sync-dot{position:absolute;bottom:7px;right:6px;}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--text-faint);display:inline-block;box-shadow:0 0 0 2px var(--surface);flex-shrink:0;}
.sync-badge[data-state="ok"] .sync-dot,.sync-dot[data-state="ok"]{background:var(--ok);}
.sync-badge[data-state="busy"] .sync-dot,.sync-dot[data-state="busy"]{background:var(--primary);animation:pulse 1s ease-in-out infinite;}
.sync-badge[data-state="error"] .sync-dot,.sync-dot[data-state="error"]{background:var(--crit);}
.sync-badge[data-state="busy"] svg{animation:pulse 1s ease-in-out infinite;}
@keyframes pulse{50%{opacity:.35;}}
/* tour */
#tourRoot{position:fixed;inset:0;z-index:600;}
.tour-dim{position:fixed;inset:0;background:rgba(15,8,28,.55);}
.tour-spot{position:fixed;border-radius:12px;box-shadow:0 0 0 9999px rgba(15,8,28,.55),0 0 0 3px rgba(240,91,196,.9);transition:all .3s var(--ease);pointer-events:none;}
.tour-card{position:fixed;width:340px;max-width:calc(100vw - 24px);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);padding:18px 20px;animation:modalIn .25s var(--ease);}
.tour-card h3{margin:2px 0 6px;font-size:17px;}
.tour-card p{margin:0;color:var(--text-soft);font-size:14px;line-height:1.55;}
.tour-count{font-size:12px;font-weight:600;color:var(--primary);}
.install-btn{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;margin-bottom:10px;border-radius:var(--r-sm);color:var(--side-text);cursor:pointer;font-size:14px;width:100%;}
.install-btn:hover{background:rgba(255,255,255,.06);color:#fff;}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px;}
.person{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--border);border-radius:10px;cursor:pointer;font-size:14px;transition:border-color .15s ease,background .15s ease;}
.person:hover{border-color:var(--primary);background:var(--primary-bg);}
.person.on{border-color:var(--primary);background:var(--primary-bg);font-weight:600;}
.dialog:has(#peopleList){width:620px;}
.rhist{position:relative;padding-left:16px;border-left:2px solid var(--border);display:flex;flex-direction:column;gap:10px;}
.rhist-item{position:relative;}
.rhist-item::before{content:'';position:absolute;left:-23px;z-index:1;top:4px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--primary);}
.rhist-item.fix::before{background:var(--primary);}
.rhist-item.first::before{border-color:var(--text-faint);}
.rhist-meta{font-size:12px;color:var(--text-muted);margin-bottom:4px;}
.rhist-diff{padding:7px 10px;background:var(--bg);border-radius:7px;font-size:12.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word;}
.rhist-diff del,.rhist del{background:var(--crit-bg);color:var(--crit);text-decoration:line-through;border-radius:3px;padding:0 2px;}
.rhist-diff ins,.rhist ins{background:var(--ok-bg);color:inherit;text-decoration:none;border-radius:3px;padding:0 2px;}
.subfolders{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-bottom:8px;}
.subfolder{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);cursor:pointer;box-shadow:var(--shadow-sm);transition:transform .2s var(--ease),box-shadow .2s ease,border-color .2s ease;}
.subfolder:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--border-strong);}
.subfolder-ic{width:38px;height:38px;border-radius:10px;background:var(--bg-2);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.subfolder-name{font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.subfolder-new{justify-content:center;border-style:dashed;box-shadow:none;color:var(--text-soft);font-weight:500;gap:8px;}
.subfolder-new:hover{color:var(--primary);background:var(--primary-bg);border-color:var(--primary);}
.tree-tg{border:none;background:none;width:22px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:var(--text-faint);cursor:pointer;padding:0;transition:transform .15s ease,background .15s ease;}
.tree-tg:hover{background:var(--bg-2);color:var(--text);}
.tree-tg.open{transform:rotate(90deg);}
/* ---- responsive ---- */
@media(max-width:900px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;height:100%;transform:translateX(-100%);transition:transform .25s var(--ease);box-shadow:var(--shadow-lg);width:264px;}
  body.nav-open .sidebar{transform:none;}
  .side-overlay{display:block;position:fixed;inset:0;background:var(--overlay);z-index:35;opacity:0;pointer-events:none;transition:opacity .2s ease;}
  body.nav-open .side-overlay{opacity:1;pointer-events:auto;}
  .top-ic.menu-btn{display:flex;}
  .topbar{padding:0 12px 0 8px;}
  .top-search{display:none;}
  .top-ic.mob-search{display:flex;}
  .content{padding:20px 16px 48px;}
  .page-title{font-size:22px;}
  .checklist,.grid-4,.grid-3,.grid-2{grid-template-columns:minmax(0,1fr);}
  .onboard{grid-template-columns:1fr;}
  .onboard-art{order:-1;padding:16px;}
  .onboard-art img{max-width:260px;}
  .project-hero{padding:20px;}
  .modal{padding:20px;}
}
@media(max-width:560px){ .grid-4{grid-template-columns:repeat(2,minmax(0,1fr));} .kpi .num{font-size:22px;} .page-head{align-items:flex-start;} }
@media(prefers-reduced-motion:reduce){ *,*::before,*::after{animation:none!important;transition:none!important;} ::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important;} }
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="side-brand">
      <div class="side-brand-row">
        <span class="side-logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l7.5 3.6v6.2c0 4.6-3.2 7.9-7.5 9.2-4.3-1.3-7.5-4.6-7.5-9.2V6.1L12 2.5z"/><path d="M8.7 12.2l2.2 2.2 4.4-4.6"/></svg></span>
        <div>
          <div class="side-logo-text">LQA Hub</div>
          <div class="side-tagline">Проверка локализации</div>
        </div>
      </div>
    </div>
    <nav class="side-nav" id="sideNav"></nav>
    <div class="side-foot">
      <button type="button" class="side-link install-btn" id="installBtn" style="display:none;" onclick="installApp()"><span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/></svg></span><span class="lbl">Установить приложение</span></button>
      <div class="theme-toggle" id="themeToggle">
        <button type="button" data-mode="light" onclick="setTheme('light', event)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Светлая</button>
        <button type="button" data-mode="dark" onclick="setTheme('dark', event)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>Тёмная</button>
      </div>
    </div>
  </aside>
  <div class="side-overlay" onclick="toggleNav(false)"></div>
  <div class="main">
    <header class="topbar">
      <button type="button" class="top-ic menu-btn" title="Меню" onclick="toggleNav()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <div class="crumbs" id="crumbs"></div>
      <div class="top-search">
        <span class="s-ic"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></span>
        <input type="text" id="globalSearch" placeholder="Поиск и команды" readonly onfocus="this.blur();openPalette()" onclick="openPalette()">
        <span class="kbd-hint" id="kbdHint">Ctrl K</span>
      </div>
      <button type="button" class="top-ic mob-search" title="Поиск и команды" onclick="openPalette()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></button>
      <button type="button" class="top-ic sync-badge" id="syncBadge" style="display:none;" onclick="syncNow(true)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg><span class="sync-dot"></span></button>
      <button type="button" class="top-ic" title="Уведомления" onclick="toggleNotifCenter()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="dot" id="notifDot"></span></button>
      <button type="button" class="avatar" id="meAvatar" onclick="openWhoAmI()" style="border:none;cursor:pointer;">?</button>
    </header>
    <main class="content" id="content"></main>
  </div>
</div>
<div id="modalRoot"></div>
<div id="detailPanelOverlay" class="detail-panel-overlay" onclick="closeDetailPanel()"></div>
<div id="detailPanel" class="detail-panel"><div class="detail-panel-inner" id="detailPanelBody"></div></div>
<div class="toasts" id="toasts"></div>

<script>
/* =========================================================
   STORE — localStorage-backed, table-generic, backend-ready
   ========================================================= */
// Illustrations (user-provided WB pack), cropped to their clean area and re-encoded as WebP so the

   straight past — that quota, not any parsing logic, was what made big uploads hang. */
const IDB_NAME = 'lqa_v1_idb', IDB_STORE = 'tables';
let idbConnPromise = null;
function idbOpen(){
  if(idbConnPromise) return idbConnPromise;
  idbConnPromise = new Promise((resolve, reject)=>{
    if(!window.indexedDB){ reject(new Error('IndexedDB недоступен в этом браузере')); return; }
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(IDB_STORE, {keyPath:'table'}); };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
  return idbConnPromise;
}
function idbPersist(table, data){
  idbOpen().then(db=>{
    try{
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).put({table, data});
      tx.onerror = ()=>console.warn('IndexedDB write failed for', table, tx.error);
    }catch(e){ console.warn('IndexedDB write failed for', table, e); }
  }).catch(e=>console.warn('IndexedDB unavailable, changes will not persist across reloads', e));
}
async function idbLoadAll(){
  try{
    const db = await idbOpen();
    return await new Promise((resolve, reject)=>{
      const tx = db.transaction(IDB_STORE, 'readonly');
      const req = tx.objectStore(IDB_STORE).getAll();
      req.onsuccess = ()=>{
        const out = {};
        (req.result||[]).forEach(rec=>{ out[rec.table] = rec.data; });
        resolve(out);
      };
      req.onerror = ()=>reject(req.error);
    });
  }catch(e){
    console.warn('IndexedDB load failed, starting empty', e);
    return {};
  }
}
function migrateFromLocalStorageIfNeeded(loaded){
  // one-time carry-over for anyone who already has data in the old localStorage version
  if(Object.keys(loaded).length>0) return loaded;
  const out = {}; let migratedAny = false;
  try{
    for(let i=0;i<localStorage.length;i++){
      const key = localStorage.key(i);
      if(key && key.startsWith(DB_PREFIX)){
        try{ out[key.slice(DB_PREFIX.length)] = JSON.parse(localStorage.getItem(key)); migratedAny = true; }catch(e){}
      }
    }
  }catch(e){}
  if(migratedAny) Object.keys(out).forEach(table=>idbPersist(table, out[table]));
  return out;
}
/* Excel library loader: the static <script> tag in <head> is the fast path;
   if that CDN is blocked by a corporate network, try a couple of alternates
   before giving up, instead of just failing silently on one host. */
let xlsxLoadPromise = null;
function ensureXlsx(){
  if(typeof XLSX !== 'undefined') return Promise.resolve(true);
  if(xlsxLoadPromise) return xlsxLoadPromise;
  const urls = [
    'https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js', // newer build — fixes several zip-parsing edge cases the frozen npm 0.18.5 has
    'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
    'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',
    'https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js'
  ];
  xlsxLoadPromise = (async ()=>{
    for(const url of urls){
      if(typeof XLSX !== 'undefined') return true;
      try{
        await new Promise((resolve, reject)=>{
          const s = document.createElement('script');
          s.src = url; s.onload = resolve; s.onerror = reject;
          document.head.appendChild(s);
        });
        if(typeof XLSX !== 'undefined') return true;
      }catch(e){ /* try next source */ }
    }
    return typeof XLSX !== 'undefined';
  })();
  return xlsxLoadPromise;
}

/* Some .xlsx exporters (notably Smartcat's termbase export) write the zip with a
   "data descriptor" flag SheetJS's bundled zip reader mis-parses ("Bad compressed
   size" error), even though the file is perfectly valid — Python's zipfile and any
   spec-correct reader (JSZip included) open it fine. Rather than gamble on a newer
   SheetJS build fixing it, read such files ourselves: JSZip to unzip correctly,
   then parse the worksheet XML directly with the browser's own DOMParser. */
let jszipLoadPromise = null;
function ensureJSZip(){
  if(typeof JSZip !== 'undefined') return Promise.resolve(true);
  if(jszipLoadPromise) return jszipLoadPromise;
  const urls = [
    'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js',
    'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js',
    'https://unpkg.com/jszip@3.10.1/dist/jszip.min.js'
  ];
  jszipLoadPromise = (async ()=>{
    for(const url of urls){
      if(typeof JSZip !== 'undefined') return true;
      try{
        await new Promise((resolve, reject)=>{
          const s = document.createElement('script');
          s.src = url; s.onload = resolve; s.onerror = reject;
          document.head.appendChild(s);
        });
        if(typeof JSZip !== 'undefined') return true;
      }catch(e){ /* try next source */ }
    }
    return typeof JSZip !== 'undefined';
  })();
  return jszipLoadPromise;
}
async function parseOoxmlXlsxFallback(buf){
  const ok = await ensureJSZip();
  if(!ok) throw new Error('JSZip не загрузился');
  const zip = await JSZip.loadAsync(buf);
  let sheetPath = 'xl/worksheets/sheet1.xml';
  if(!zip.file(sheetPath)){
    const found = Object.keys(zip.files).find(n=>/^xl\/worksheets\/sheet\d+\.xml$/.test(n));
    if(!found) throw new Error('Не найден лист с данными внутри файла');
    sheetPath = found;
  }
  const NS = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main';
  const parser = new DOMParser();

  let sharedStrings = [];
  const ssFile = zip.file('xl/sharedStrings.xml');
  if(ssFile){
    const ssDoc = parser.parseFromString(await ssFile.async('string'), 'application/xml');
    for(const si of ssDoc.getElementsByTagNameNS(NS, 'si')){
      let text = '';
      for(const t of si.getElementsByTagNameNS(NS, 't')) text += t.textContent;
      sharedStrings.push(text);
    }
  }

  const sheetDoc = parser.parseFromString(await zip.file(sheetPath).async('string'), 'application/xml');
  const matrix = [];
  for(const row of sheetDoc.getElementsByTagNameNS(NS, 'row')){
    const vals = [];
    for(const c of row.getElementsByTagNameNS(NS, 'c')){
      const type = c.getAttribute('t');
      let val = '';
      if(type === 's'){
        const vEl = c.getElementsByTagNameNS(NS,'v')[0];
        const idx = vEl ? parseInt(vEl.textContent,10) : -1;
        val = sharedStrings[idx] || '';
      } else if(type === 'inlineStr'){
        const isEl = c.getElementsByTagNameNS(NS,'is')[0];
        if(isEl) for(const t of isEl.getElementsByTagNameNS(NS,'t')) val += t.textContent;
      } else {
        const vEl = c.getElementsByTagNameNS(NS,'v')[0];
        val = vEl ? vEl.textContent : '';
      }
      vals.push(val);
    }
    matrix.push(vals);
  }
  return matrix;
}
/* Smartcat's termbase export has its own column layout (Comments, CreationDate,
   Author, LastModifiedDate, LastModifiedBy, "ru-RU Term1", "<lang> Term1", "<lang>
   Term2"...) rather than our plain [term, approved, forbidden]. Detect it and
   remap automatically for whichever language the glossary is set to; otherwise
   leave the matrix as-is for the normal column-based import. */
function remapSmartcatMatrix(matrix, langCode){
  if(!matrix.length || !langCode) return null;
  const header = matrix[0].map(h=>String(h||'').trim());
  const headerLower = header.map(h=>h.toLowerCase());
  const looksSmartcat = headerLower.some(h=>h.includes('creationdate')) && headerLower.some(h=>h.includes('term1'));
  if(!looksSmartcat) return null;
  const srcIdx = header.findIndex(h=>/^ru(-ru)?\s*term\d*/i.test(h));
  if(srcIdx<0) return null;
  const langLower = langCode.toLowerCase();
  const termCols = header.map((h,i)=>({h,i})).filter(({h})=>h.toLowerCase().startsWith(langLower+' term'));
  if(!termCols.length) return null;
  termCols.sort((a,b)=>a.h.localeCompare(b.h));
  const approvedIdx = termCols[0].i;
  const out = [['term','approved','forbidden']];
  for(let r=1;r<matrix.length;r++){
    const row = matrix[r];
    const term = (row[srcIdx]||'').trim();
    const approved = (row[approvedIdx]||'').trim();
    if(!term || !approved) continue;
    out.push([term, approved, '']);
  }
  return out;
}
let DB = {};
function dbList(table){ return DB[table] || []; }
function dbSave(table, arr){ DB[table] = arr; idbPersist(table, arr); onLocalChange(table); }
function dbGet(table, id){ return (DB[table]||[]).find(x=>x.id===id) || null; }
function dbUpsert(table, rec){ const arr = DB[table] = DB[table] || []; const i = arr.findIndex(x=>x.id===rec.id); if(i>=0) arr[i]=rec; else arr.push(rec); idbPersist(table, arr); onLocalChange(table); return rec; }
function dbRemove(table, id){ DB[table] = (DB[table]||[]).filter(x=>x.id!==id); idbPersist(table, DB[table]); onLocalChange(table); }
function dbQuery(table, pred){ return (DB[table]||[]).filter(pred); }
function uid(){ return 'id_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8); }
function nowISO(){ return new Date().toISOString(); }
function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso); return d.toLocaleDateString('ru-RU')+' '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// Gives each folder a stable color (deterministic from its id) so it's visually
// recognizable across tables at a glance, without needing to read the name every time.
const FOLDER_COLORS = ['#9A139E','#2563EB','#059669','#D97706','#DC2626','#7C3AED','#0891B2','#DB2777','#4D7C0F','#B91C1C'];
function folderColor(id){
  if(!id) return '#94A3B8';
  let hash = 0;
  for(let i=0;i<id.length;i++) hash = (hash*31 + id.charCodeAt(i)) | 0;
  return FOLDER_COLORS[Math.abs(hash) % FOLDER_COLORS.length];
}
function folderBadge(comp){

}
// One look for every "nothing here yet" screen: illustration (or a small icon), title, text, optional action.

function getSettings(){
  const DEFAULTS = { id:'global', checkVars:true, checkTags:true, checkBreaks:true, checkSpaces:true, checkPunct:true, checkLength:true, lengthRatio:2.2, checkUntranslated:false, checkConsistency:true, checkGlossary:true, checkRebranding:true, checkPlurals:true, checkLocale:true, checkDnt:true, checkScript:true, checkLimits:true, lengthRules:'', checkNumbers:true, checkLangRules:true, customLangRules:'', ignoreRules:[], dntTerms:'Wildberries\nWB Partners\nWB Club',
    aiEnabled:false, aiEndpointUrl:'', aiModel:'', aiToken:'', aiBatchSize:15 };
  let s = dbGet('settings','global');
  if(!s){
    s = Object.assign({}, DEFAULTS);
    dbUpsert('settings', s);
  } else {
    let changed = false;
    Object.keys(DEFAULTS).forEach(k=>{ if(!(k in s)){ s[k] = DEFAULTS[k]; changed = true; } });
    if(changed) dbUpsert('settings', s); // picks up any new check added after this browser's settings were first saved
  }

}
function saveSettings(patch){
  const s = Object.assign(getSettings(), patch);
  dbUpsert('settings', s);
  return s;
}

let notifLog = [];
function toast(msg, opts){
  opts = opts || {};
  notifLog.unshift({msg, ts:Date.now()});
  notifLog = notifLog.slice(0,20);
  document.getElementById('notifDot').style.display = 'block';
  const el = document.createElement('div');
  el.className = 'toast';
  const text = document.createElement('span'); text.textContent = msg; el.appendChild(text);
  const remove = ()=>{ el.classList.add('out'); setTimeout(()=>el.remove(), 220); };
  if(opts.action){
    const b = document.createElement('button'); b.className = 'toast-action'; b.textContent = opts.action.label;
    b.onclick = ()=>{ remove(); opts.action.fn(); };
    el.appendChild(b);
  }
  const box = document.getElementById('toasts');
  box.appendChild(el);
  // keep the stack short: the oldest plain toasts make room, ones with an action stay longest
  const plain = [...box.children].filter(t=>!t.querySelector('.toast-action') && !t.classList.contains('out'));
  if(box.children.length > 4 && plain.length) plain[0].remove();
  setTimeout(remove, opts.duration || 4200);
}
function toggleNotifCenter(){
  document.getElementById('notifDot').style.display = 'none';
  if(!notifLog.length){ toast('Уведомлений пока нет'); return; }
  openModal(`<h3>Уведомления</h3><div style="margin-top:10px;display:flex;flex-direction:column;gap:8px;max-height:340px;overflow:auto;">${
    notifLog.map(n=>`<div style="border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:12.5px;">${esc(n.msg)}<div style="color:var(--text-faint);font-size:11px;margin-top:3px;">${new Date(n.ts).toLocaleTimeString('ru-RU')}</div></div>`).join('')
  }</div><div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Закрыть</button></div>`);
}

/* =========================================================
   DIALOGS — in-app replacements for confirm()/prompt()
   ========================================================= */
// Separate root above modals, the detail panel and the screenshot viewer, so a confirmation
// can be asked from inside any of them without closing what's underneath.
function uiDialog(inner, onMount){
  return new Promise(resolve=>{
    let root = document.getElementById('dialogRoot');
    if(!root){ root = document.createElement('div'); root.id = 'dialogRoot'; document.body.appendChild(root); }
    const prevFocus = document.activeElement;
    root.innerHTML = `<div class="dialog-bg"><div class="dialog" role="dialog" aria-modal="true">${inner}</div></div>`;
    const close = val=>{ root.innerHTML = ''; document.removeEventListener('keydown', onKey, true); if(prevFocus && prevFocus.focus) try{ prevFocus.focus(); }catch(e){} resolve(val); };
    const onKey = e=>{
      if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); close(null); }
      else if(e.key==='Enter' && !(e.target && e.target.tagName==='TEXTAREA')){ e.preventDefault(); e.stopPropagation(); root.querySelector('[data-ok]').click(); }
    };
    document.addEventListener('keydown', onKey, true);
    root.querySelector('.dialog-bg').addEventListener('mousedown', e=>{ if(e.target.classList.contains('dialog-bg')) close(null); });
    root.querySelectorAll('[data-cancel]').forEach(b=>b.onclick = ()=>close(null));
    onMount(root, close);
  });
}
function uiConfirm(o){
  o = typeof o==='string' ? {title:o} : o;
  return uiDialog(`
    ${o.danger!==false||o.icon?`<div class="dialog-ic ${o.danger!==false?'danger':''}">${icon(o.icon||'trash',20)}</div>`:''}
    <h3>${esc(o.title)}</h3>${o.text?`<div class="dialog-text">${o.text}</div>`:''}
    <div class="modal-actions"><button class="btn secondary" data-cancel>${esc(o.cancelText||'Отмена')}</button><button class="btn ${o.danger!==false?'danger-solid':''}" data-ok>${esc(o.okText||'Удалить')}</button></div>`,
    (root, close)=>{ const ok = root.querySelector('[data-ok]'); ok.onclick = ()=>close(true); ok.focus(); }).then(v=>v===true);
}
function uiPrompt(o){
  return uiDialog(`<h3>${esc(o.title)}</h3>${o.text?`<div class="dialog-text">${o.text}</div>`:''}
    <label class="field" style="margin-top:14px;">${esc(o.label||'')}<input type="text" id="uiPromptInput" value="${esc(o.value||'')}" placeholder="${esc(o.placeholder||'')}"></label>
    <div class="modal-actions"><button class="btn secondary" data-cancel>Отмена</button><button class="btn" data-ok>${esc(o.okText||'Сохранить')}</button></div>`,
    (root, close)=>{ const inp = root.querySelector('#uiPromptInput'); root.querySelector('[data-ok]').onclick = ()=>close(inp.value); inp.focus(); inp.select(); })
    .then(v=> v==null ? null : String(v).trim());
}

/* ---------- undo for deletions ----------
   Every delete in the app replaces table arrays with filtered copies (dbSave/dbRemove), so keeping
   the previous array references is enough to put everything back. */
function snapshotTables(tables){
  const snap = {};
  tables.forEach(t=>{ snap[t] = (DB[t]||[]).slice(); });
  return snap;
}
function restoreSnapshot(snap){ Object.keys(snap).forEach(t=>dbSave(t, snap[t])); }
function toastUndo(msg, snap, afterUndo){
  toast(msg, {duration:8000, action:{label:'Отменить', fn:()=>{
    restoreSnapshot(snap);
    toast('Восстановлено');
    if(afterUndo) afterUndo(); else router();
  }}});
}

   BACKUP — the whole store as one JSON file
   ========================================================= */
const BACKUP_KEY = 'lqa_last_backup';
function lastBackupAt(){ try{ return +localStorage.getItem(BACKUP_KEY) || 0; }catch(e){ return 0; } }
function dataIsEmpty(){ return !dbList('projects').length && !dbList('glossaries').length; }
function backupStats(){
  const tables = Object.keys(DB).filter(t=>Array.isArray(DB[t]) && !t.startsWith('_'));
  let bytes = 0; tables.forEach(t=>{ try{ bytes += JSON.stringify(DB[t]).length; }catch(e){} });
  return {tables, bytes};
}
function fmtBytes(n){ return n>1048576 ? (n/1048576).toFixed(1)+' МБ' : Math.max(1,Math.round(n/1024))+' КБ'; }
function downloadBackup(){
  const payload = {app:'lqa-hub', version:1, exportedAt:nowISO(), tables:{}};
  Object.keys(DB).forEach(t=>{ if(Array.isArray(DB[t]) && !t.startsWith('_')) payload.tables[t] = DB[t]; });
  const blob = new Blob([JSON.stringify(payload)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'lqa-hub-backup-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 2000);
  try{ localStorage.setItem(BACKUP_KEY, String(Date.now())); }catch(e){}
  toast('Резервная копия скачана — храни файл в надёжном месте (Google Диск, папка команды)');
  if((location.hash||'#/')==='#/' || location.hash.startsWith('#/settings')) router();
}
function pickBackupFile(){
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = ()=>{ if(inp.files[0]) restoreBackupFromFile(inp.files[0]); };
  inp.click();
}
async function restoreBackupFromFile(file){
  let data;
  try{ data = JSON.parse(await file.text()); }catch(e){ toast('Это не файл резервной копии LQA Hub'); return; }
  if(!data || data.app!=='lqa-hub' || !data.tables || typeof data.tables!=='object'){ toast('Это не файл резервной копии LQA Hub'); return; }
  const t = data.tables;
  const n = k=>(t[k]||[]).length;
  const ok = await uiConfirm({title:'Восстановить из резервной копии?', okText:'Восстановить', icon:'upload',
    text:`Копия от <b>${esc(fmtDate(data.exportedAt))}</b>: ${n('projects')} проектов, ${n('rows').toLocaleString('ru-RU')} строк, ${n('issues').toLocaleString('ru-RU')} проблем, ${n('visualShots')} скриншотов.<br><br>${syncEnabled() ? 'Командное хранилище включено: записи из копии добавятся к данным команды и заменят совпадающие, остальное у команды не пропадёт.' : 'Всё, что сейчас есть в платформе, заменится содержимым копии. Если сомневаешься — сначала скачай копию текущих данных.'}`});
  if(!ok) return;
  const before = snapshotTables(Object.keys(DB));
  Object.keys(DB).forEach(k=>{ if(!(k in t) && !k.startsWith('_')) dbSave(k, []); });
  Object.keys(t).forEach(k=>{ if(Array.isArray(t[k]) && !k.startsWith('_')) dbSave(k, t[k]); });
  // with team storage on, a restore is merged into the team data rather than deleting what's not in the file
  if(syncEnabled()){ DB._sync = [{id:'state', lastRev:0, base:{}}]; saveSyncState(); }
  getSettings();
  issuesPageState = {};
  toastUndo('Данные восстановлены из копии', before, ()=>{ issuesPageState = {}; router(); });
  location.hash = '#/';
  router();
}
