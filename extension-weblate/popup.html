<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Выгрузка из Weblate</title>
<style>
  :root { --bg:#fff; --text:#1f1633; --soft:#6b6280; --line:#e4dff0; --primary:#7c3aed; --primary-2:#5b21b6; --danger:#d92d20; --ok:#15803d; --chip:#f4f0fb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#17131f; --text:#efeaf7; --soft:#a49cb6; --line:#2e2840; --chip:#231d30; --primary:#a78bfa; --primary-2:#8b5cf6; --danger:#f87171; --ok:#4ade80; } }
  * { box-sizing: border-box; }
  body { margin:0; width:380px; background:var(--bg); color:var(--text); font:13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding:14px 16px 10px; border-bottom:1px solid var(--line); }
  h1 { font-size:15px; margin:0; }
  .sub { color:var(--soft); margin-top:2px; word-break:break-word; }
  main { padding:12px 16px 16px; }
  .block { margin-bottom:14px; }
  .label { font-weight:600; margin-bottom:6px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .label a { font-weight:400; color:var(--primary); cursor:pointer; text-decoration:none; font-size:12px; }
  .list { max-height:150px; overflow:auto; border:1px solid var(--line); border-radius:8px; padding:4px 0; }
  .list label { display:flex; gap:8px; align-items:center; padding:3px 10px; cursor:pointer; }
  .list label:hover { background:var(--chip); }
  .list .pct { margin-left:auto; color:var(--soft); font-size:12px; }
  input[type=search], input[type=password] { width:100%; padding:7px 10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); font:inherit; margin-bottom:6px; }
  .radios label { display:flex; gap:8px; align-items:flex-start; margin:4px 0; cursor:pointer; }
  button.go { width:100%; padding:10px; border:0; border-radius:10px; background:linear-gradient(135deg,var(--primary),var(--primary-2)); color:#fff; font:600 14px system-ui, sans-serif; cursor:pointer; }
  button.go:disabled { opacity:.5; cursor:default; }
  .msg { margin-top:10px; color:var(--soft); white-space:pre-wrap; }
  .msg.err { color:var(--danger); }
  .msg.ok { color:var(--ok); }
  details { margin-top:6px; color:var(--soft); }
  details summary { cursor:pointer; }
  .empty { padding:24px 16px; color:var(--soft); }
</style>
</head>
<body>
<header><h1>Выгрузка из Weblate в .po</h1><div class="sub" id="where">Смотрю, что открыто…</div></header>
<main id="main" hidden>
  <div class="block">
    <div class="label">Языки <a id="langAll">все</a></div>
    <input type="search" id="langFilter" placeholder="Найти язык">
    <div class="list" id="langs"></div>
  </div>
  <div class="block">
    <div class="label">Компоненты <span><a id="compAll">все</a> · <a id="compNone">снять</a></span></div>
    <input type="search" id="compFilter" placeholder="Найти компонент">
    <div class="list" id="comps"></div>
  </div>
  <div class="block radios">
    <div class="label">Какие строки</div>
    <label><input type="radio" name="strings" value="translated" checked> Только переведённые</label>
    <label><input type="radio" name="strings" value="fuzzy"> Переведённые и «требуют правки» (помечаются fuzzy)</label>
    <label><input type="radio" name="strings" value="all"> Все, включая непереведённые</label>
  </div>
  <div class="block radios">
    <div class="label">Файлы</div>
    <label><input type="radio" name="split" value="one" checked> Один .po на язык — все выбранные компоненты вместе</label>
    <label><input type="radio" name="split" value="each"> Отдельный .po на каждый компонент</label>
  </div>
  <button class="go" id="go">Выгрузить .po</button>
  <div class="msg" id="msg"></div>
  <details><summary>API-ключ Weblate (если без него не пускает)</summary>
    <div style="margin-top:6px;">Обычно не нужен: расширение ходит в Weblate с твоим входом. Если Weblate всё равно отказывает — возьми ключ в Weblate: профиль → «API-доступ».</div>
    <input type="password" id="token" placeholder="wlu_…" style="margin-top:6px;" autocomplete="off">
  </details>
</main>
<div class="empty" id="empty" hidden></div>
<script src="popup.js"></script>
</body>
</html>
